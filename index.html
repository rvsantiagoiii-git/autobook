    :root {
      --brand-50: #ecfdf5;
      --brand-100: #d1fae5;
      --brand-200: #a7f3d0;
      --brand-400: #34d399;
      --brand-500: #10b981;
      --brand-600: #059669;
      --brand-700: #047857;
      --brand-contrast: #ffffff;
      --brand-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--brand-font);
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    /* Dynamic Dealership Brand Theme Overrides */
    .bg-emerald-600 { background-color: var(--brand-600) !important; }
    .hover\:bg-emerald-700:hover { background-color: var(--brand-700) !important; }
    .hover\:bg-emerald-600:hover { background-color: var(--brand-600) !important; }
    .bg-emerald-500 { background-color: var(--brand-500) !important; }
    .bg-emerald-50 { background-color: var(--brand-50) !important; }
    .bg-emerald-100 { background-color: var(--brand-100) !important; }
    .text-emerald-700 { color: var(--brand-700) !important; }
    .text-emerald-600 { color: var(--brand-600) !important; }
    .text-emerald-500 { color: var(--brand-500) !important; }
    .text-emerald-400 { color: var(--brand-400) !important; }
    .border-emerald-200 { border-color: var(--brand-200) !important; }
    .border-emerald-500 { border-color: var(--brand-500) !important; }
    .bg-emerald-600.text-white { color: var(--brand-contrast) !important; }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.9; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .live-pulse::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background-color: var(--brand-500);
      animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes slideInToast {
      from { transform: translateY(16px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .toast-enter {
      animation: slideInToast 0.25s ease-out forwards;
    }

    function normalizeHexColor(hex) {
      if (!hex) return '#059669';
      let cleaned = String(hex).trim();
      if (!cleaned.startsWith('#')) cleaned = '#' + cleaned;
      if (/^#[0-9A-Fa-f]{3}$/.test(cleaned)) {
        cleaned = '#' + cleaned[1] + cleaned[1] + cleaned[2] + cleaned[2] + cleaned[3] + cleaned[3];
      }
      return /^#[0-9A-Fa-f]{6}$/.test(cleaned) ? cleaned.toLowerCase() : '#059669';
    }

    function hexToRgb(hex) {
      const clean = normalizeHexColor(hex).slice(1);
      return {
        r: parseInt(clean.slice(0, 2), 16),
        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)
      };
    }

    function mixRgbWithWhite(rgb, weight) {
      const r = Math.round(rgb.r * (1 - weight) + 255 * weight);
      const g = Math.round(rgb.g * (1 - weight) + 255 * weight);
      const b = Math.round(rgb.b * (1 - weight) + 255 * weight);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function darkenRgb(rgb, factor) {
      const r = Math.max(0, Math.round(rgb.r * (1 - factor)));
      const g = Math.max(0, Math.round(rgb.g * (1 - factor)));
      const b = Math.max(0, Math.round(rgb.b * (1 - factor)));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function buildCustomThemeFromHex(hex) {
      const validHex = normalizeHexColor(hex);
      const rgb = hexToRgb(validHex);
      const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
      return {
        '--brand-50': mixRgbWithWhite(rgb, 0.92),
        '--brand-100': mixRgbWithWhite(rgb, 0.82),
        '--brand-200': mixRgbWithWhite(rgb, 0.65),
        '--brand-400': mixRgbWithWhite(rgb, 0.22),
        '--brand-500': mixRgbWithWhite(rgb, 0.1),
        '--brand-600': validHex,
        '--brand-700': darkenRgb(rgb, 0.2),
        '--brand-contrast': luminance > 0.62 ? '#0f172a' : '#ffffff'
      };
    }

    function applyBrandingToDocument(brandingInput) {

      const rootEl = document.documentElement;

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    // Date, Time & Currency Helpers
    function getDateOffsetStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatDisplayDate(isoDate) {
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      if (isoDate === today) return 'Today';
      if (isoDate === tomorrow) return 'Tomorrow';
      const d = new Date(isoDate + 'T00:00:00');
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function formatPHP(amount) {
      return '₱' + Number(amount || 0).toLocaleString('en-PH');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsAttr(str) {
      return String(str ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;');
    }

    function getStatusStageMeta(statusLabel) {
      const pipeline = (typeof state !== 'undefined' && state && Array.isArray(state.statusPipeline) && state.statusPipeline.length)
        ? state.statusPipeline
        : getDefaultStatusPipeline();
      const found = pipeline.find(s => s.label.toLowerCase() === String(statusLabel || '').toLowerCase());
      if (found) {
        const palette = STAGE_COLOR_PALETTES[found.color] || STAGE_COLOR_PALETTES.emerald;
        return { ...found, palette };
      }
      return {
        id: 'custom_fallback',
        label: statusLabel || 'Ready for Release',
        color: 'emerald',
        allowBooking: statusLabel !== 'Sold' && statusLabel !== 'Reserved',
        systemRole: statusLabel === 'Sold' ? 'SOLD' : statusLabel === 'Reserved' ? 'RESERVED' : 'ACTIVE',
        palette: STAGE_COLOR_PALETTES.emerald
      };
    }

    function isCarSold(car) {
      if (!car) return false;
      const meta = getStatusStageMeta(car.status);
      return meta.systemRole === 'SOLD' || String(car.status).toLowerCase() === 'sold';
    }

    function isCarReserved(car) {
      if (!car) return false;
      const meta = getStatusStageMeta(car.status);
      return meta.systemRole === 'RESERVED' || String(car.status).toLowerCase() === 'reserved' || Boolean(car.reservation);
    }

    function isCarInPreparation(car) {
      if (!car) return false;
      const meta = getStatusStageMeta(car.status);
      if (meta.systemRole === 'PREP_RECON' || meta.systemRole === 'PREP_DETAIL') return true;
      const normalized = String(car.status || '').toLowerCase();
      return normalized.includes('reconditioning') || normalized.includes('pms') || normalized.includes('detailing');
    }

    function isCarBookable(car) {
      if (!car || isCarSold(car) || isCarReserved(car) || isCarInPreparation(car)) return false;
      const meta = getStatusStageMeta(car.status);
      return meta.allowBooking !== false;
    }

    function getCarReconTotal(car) {
      if (!car || !Array.isArray(car.reconExpenses)) return 0;
      return car.reconExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    }

    function getCarAcquisitionCost(car) {
      if (!car) return 0;
      if (typeof car.acquisitionPrice === 'number' && !isNaN(car.acquisitionPrice)) {
        return car.acquisitionPrice;
      }
      return Math.max(0, (Number(car.basePrice) || 0) - getCarReconTotal(car));
    }

    function getCarMarginBuffer(car) {
      if (!car) return 0;
      if (typeof car.targetMargin === 'number' && !isNaN(car.targetMargin)) {
        return car.targetMargin;
      }
      return Math.max(0, (Number(car.basePrice) || 0) - (getCarAcquisitionCost(car) + getCarReconTotal(car)));
    }

    function getCarTotalInvested(car) {
      return getCarAcquisitionCost(car) + getCarReconTotal(car);
    }

    function recalculateCarBasePrice(car) {
      if (!car) return 0;
      const buyIn = getCarAcquisitionCost(car);
      const reconTotal = getCarReconTotal(car);
      const margin = getCarMarginBuffer(car);
      car.acquisitionPrice = buyIn;
      car.targetMargin = margin;
      car.basePrice = buyIn + reconTotal + margin;
      return car.basePrice;
    }

    function getPrepWorkflowStep(car) {
      if (!car) return 4;
      const meta = getStatusStageMeta(car.status);
      const normalized = String(car.status || '').toLowerCase();
      if (meta.systemRole === 'PREP_RECON' || normalized.includes('reconditioning') || normalized.includes('pms')) return 2;
      if (meta.systemRole === 'PREP_DETAIL' || normalized.includes('detailing')) return 3;
      return 4;
    }

    function getNextPrepWorkflowStage(car) {
      const pipeline = (typeof state !== 'undefined' && state && Array.isArray(state.statusPipeline) && state.statusPipeline.length)
        ? state.statusPipeline
        : getDefaultStatusPipeline();
      const step = getPrepWorkflowStep(car);
      if (step === 2) {
        return pipeline.find(s => s.systemRole === 'PREP_DETAIL') || pipeline.find(s => s.systemRole === 'AVAILABLE') || pipeline[0];
      }
      if (step === 3) {
        return pipeline.find(s => s.systemRole === 'AVAILABLE') || pipeline[0];
      }
      return null;
    }

    function getCarPhotos(car) {
      if (!car) return [];
      if (Array.isArray(car.photos) && car.photos.length > 0) return car.photos;
      if (car.imageUrl) {
        return [{ label: 'Primary Photo', url: car.imageUrl }];
      }
      return [{
        label: 'Showroom Preview',
        url: makeCarSamplePhoto(`${car.year || ''} ${car.make || ''} ${car.model || ''}`.trim(), '#065f46', '#34d399', 'SHOWROOM VIEW')
      }];
    }

      const passed = CHECKLIST_ITEMS.filter(item => Boolean(checklist[item.id])).length;
      return { passed, total: CHECKLIST_ITEMS.length };
    }

    let state = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const defaults = createDefaultState();
          if (!parsed.agents) parsed.agents = JSON.parse(JSON.stringify(DEFAULT_USERS));
          if (!parsed.invites) parsed.invites = defaults.invites;
          if (!parsed.branding) parsed.branding = { ...DEFAULT_BRANDING };
          if (!parsed.sourcingIncentive) parsed.sourcingIncentive = { ...defaults.sourcingIncentive };
          if (!Array.isArray(parsed.statusPipeline) || parsed.statusPipeline.length === 0) {
            parsed.statusPipeline = getDefaultStatusPipeline();
          }
          if (!parsed.prepFilter) parsed.prepFilter = 'ALL';
          if (Array.isArray(parsed.cars)) {
            parsed.cars.forEach(c => {
              if (!Array.isArray(c.reconExpenses)) c.reconExpenses = [];
              if (typeof c.acquisitionPrice !== 'number') {
                c.acquisitionPrice = Math.max(0, (Number(c.basePrice) || 0) - getCarReconTotal(c));
              }
              if (typeof c.targetMargin !== 'number') {
                c.targetMargin = Math.max(0, (Number(c.basePrice) || 0) - (c.acquisitionPrice + getCarReconTotal(c)));
              }
            });
          }
          return parsed;
        }
      } catch (err) {
        console.warn('State restore fallback:', err);
      }
      return createDefaultState();
    })();

    function getSourcingBonusAmount(basePrice) {
      const cfg = state.sourcingIncentive;
      if (!cfg || !cfg.enabled) return 0;
      if (cfg.type === 'PERCENT') {
        return Math.round((Number(basePrice) || 0) * ((Number(cfg.amount) || 0) / 100));
      }
      return Math.max(0, Number(cfg.amount) || 0);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('State save warning:', err);
      }
    }

      return getUserRecord(state.currentUserId) || DEFAULT_USERS.owner_rv;

    // Compress uploaded image files via HTML5 Canvas so localStorage stays fast & mobile-friendly
    function compressImageFile(file, maxWidth = 960, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

                          <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs">
                            <div class="flex items-center justify-between gap-2">
                              <span class="font-extrabold text-rose-900">Reserved by ${escapeHtml(holderName)}</span>
                              ${canSeeReservationBuyer && !isCarSold(car) ? `
                                <button onclick="releaseReservation('${car.id}')" class="text-[11px] font-bold text-rose-700 underline hover:text-rose-900">Release Hold</button>
                              ` : ''}
                            </div>
                            ${canSeeReservationBuyer ? `
                              <p class="text-[11px] text-rose-800 mt-1">
                                Buyer: <strong>${escapeHtml(car.reservation.buyerName)}</strong> &bull; Deposit: <strong>${formatPHP(car.reservation.depositAmount)}</strong>
                              </p>
                              ${car.reservation.buyerPhone ? `
                                <p class="text-[11px] text-rose-900 font-bold mt-0.5 flex items-center gap-1.5">
                                  <i data-lucide="phone" class="w-3 h-3 text-rose-600 shrink-0"></i>
                                  <a href="tel:${escapeHtml(car.reservation.buyerPhone)}" class="underline hover:text-rose-700">${escapeHtml(car.reservation.buyerPhone)}</a>
                                </p>
                              ` : ''}
                            ` : `
                              <p class="text-[11px] text-rose-700 mt-0.5 flex items-center gap-1">
                                <i data-lucide="eye-off" class="w-3 h-3 shrink-0"></i>
                                <span>Buyer details &amp; contact private to handling agent &amp; owner</span>
                              </p>
                            `}
                          </div>
                        `;
                      })() : ''}

                      ${!isCarSold(car) && carBookingsToday.length > 0 ? `
                        <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-[11px]">
                          <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-slate-700">Today's Booked Viewings (${carBookingsToday.length})</span>
                            <button onclick="openCalendarForCar('${car.id}')" class="text-emerald-700 font-bold hover:underline">Schedule &rarr;</button>
                          </div>
                          <div class="flex flex-wrap gap-1">
                            ${carBookingsToday.map(bk => {
                              const holder = getUserRecord(bk.agentId);
                              return `
                                <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700 font-semibold">
                                  ${bk.slot} &bull; ${bk.agentId === user.id ? 'You' : escapeHtml(holder.name.split(' ')[0])}
                                </span>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      ` : ''}
                    </div>

                    <!-- Card Action Footer -->
                    ${isCarSold(car) ? (() => {
                      const saleRecord = state.sales.find(s => s.carId === car.id);
                      const sellerId = car.soldByAgentId || saleRecord?.agentId || car.reservation?.agentId;
                      const sellerUser = sellerId ? getUserRecord(sellerId) : null;
                      const scoutBonusPaid = saleRecord?.sourcingBonus || 0;
                      const scoutUser = saleRecord?.sourcedByAgentId ? getUserRecord(saleRecord.sourcedByAgentId) : null;
                      return `
                        <div class="p-3 rounded-xl bg-slate-900 text-white text-xs space-y-1">
                          <div class="flex items-center justify-between gap-2">
                            <span class="font-extrabold text-emerald-400 flex items-center gap-1.5">
                              <i data-lucide="badge-check" class="w-4 h-4 shrink-0"></i>
                              <span>Sold by ${escapeHtml(sellerUser?.name || 'Dealership Team')}</span>
                            </span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                              ${escapeHtml(car.soldAt || saleRecord?.date || 'Closed')}
                            </span>
                          </div>
                          ${isOwner && saleRecord ? `
                            <p class="text-[11px] text-slate-300">
                              Model: <strong>${saleRecord.payoutModel === 'MARKUP' ? 'Base + Patong' : `${saleRecord.commissionRateApplied || state.commissionRate}% Comm`}</strong>
                              &bull; Agent Payout: <strong class="text-emerald-300">${formatPHP(saleRecord.agentPayout)}</strong>
                              (${escapeHtml(saleRecord.status)})
                            </p>
                            ${scoutBonusPaid > 0 && scoutUser ? `
                              <p class="text-[11px] text-indigo-300">
                                + Scout Incentive: <strong>${formatPHP(scoutBonusPaid)}</strong> to ${escapeHtml(scoutUser.name)}
                              </p>
                            ` : ''}
                          ` : `
                            <p class="text-[10px] text-slate-400">Unit Sold &bull; Locked from Further Bookings</p>
                          `}
                        </div>
                      `;
                    })() : priorityLockedForMe ? `
                      <div class="text-center text-[11px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-xl py-2 px-3">
                        Locked under ${escapeHtml(scoutAgent?.name || 'Scout')}'s 48h Attribution Window
                      </div>
                    ` : (() => {
                      const canMarkSold = canUserMarkCarSold(car, user);
                      const soldLockTitle = car.reservation && car.reservation.agentId !== user.id
                        ? `Reserved by ${getUserRecord(car.reservation.agentId)?.name || 'another agent'}`
                        : 'Book a viewing or place a reservation under your name first';
                      return `
                        <div>
                          <div class="grid grid-cols-3 gap-1.5">
                            <button
                              onclick="openBookViewingModal('${car.id}')"
                              ${!bookable ? 'disabled' : ''}
                              class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                bookable
                                  ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs'
                                  : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                              }"
                            >
                              <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                              <span>Book</span>
                            </button>
                            <button
                              onclick="openReserveCarModal('${car.id}')"
                              ${isCarReserved(car) ? 'disabled' : ''}
                              class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                !isCarReserved(car)
                                  ? 'bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300'
                                  : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                              }"
                            >
                              <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                              <span>Reserve</span>
                            </button>
                            <button
                              onclick="openMarkSoldModal('${car.id}')"
                              ${!canMarkSold ? 'disabled' : ''}
                              title="${escapeHtml(canMarkSold ? 'Mark vehicle sold & submit payout' : soldLockTitle)}"
                              class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                                canMarkSold
                                  ? 'bg-slate-900 hover:bg-slate-800 text-white'
                                  : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                              }"
                            >
                              <i data-lucide="${canMarkSold ? 'badge-check' : 'lock'}" class="w-3.5 h-3.5 ${canMarkSold ? 'text-emerald-400' : 'text-slate-400'}"></i>
                              <span>Sold</span>
                            </button>
                          </div>
                          ${!canMarkSold && !isOwner ? `
                            <p class="text-[10px] text-slate-500 text-center mt-1.5">
                              ${car.reservation && car.reservation.agentId !== user.id
                                ? `Held by ${escapeHtml(getUserRecord(car.reservation.agentId)?.name || 'another agent')}`
                                : 'Book a viewing or reserve under your name to unlock Sold'}
                            </p>
                          ` : ''}
                        </div>
                      `;
                    })()}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    // =========================================================================
    // 4B. VIEW 1B: UNDER PREPARATION BAY (OWNER / CO-OWNER / ADMIN ONLY)
    // =========================================================================
    function renderUnderPrepView() {
      const user = getCurrentUser();
      if (!isOwnerRole(user)) {
        state.activeTab = 'inventory';
        return renderInventoryView();
      }

      const prepCars = state.cars.filter(c => isCarInPreparation(c));
      const reconStageCars = prepCars.filter(c => getPrepWorkflowStep(c) === 2);
      const detailStageCars = prepCars.filter(c => getPrepWorkflowStep(c) === 3);

      const totalBuyInCapital = prepCars.reduce((sum, c) => sum + getCarAcquisitionCost(c), 0);
      const totalPrepSpent = prepCars.reduce((sum, c) => sum + getCarReconTotal(c), 0);
      const projectedShowroomValue = prepCars.reduce((sum, c) => sum + (Number(c.basePrice) || 0), 0);
      const projectedPatongProfit = projectedShowroomValue - (totalBuyInCapital + totalPrepSpent);

      const filteredPrepCars = prepCars.filter(c => {
        if (state.prepFilter === 'RECON') return getPrepWorkflowStep(c) === 2;
        if (state.prepFilter === 'DETAILING') return getPrepWorkflowStep(c) === 3;
        return true;
      });

      return `
        <!-- Header Banner -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[11px] font-extrabold mb-1">
              <i data-lucide="shield-alert" class="w-3 h-3"></i> Owner / Co-Owner / Admin Bay Only
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">Under Preparation — Reconditioning &amp; Detailing</h2>
            <p class="text-xs text-slate-500">Log repair, PMS, and detailing costs below. Every expense rolls directly into the Base Selling Price before releasing to agents.</p>
          </div>
          <button
            onclick="openAddCarModal()"
            class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Intake Newly Bought Unit</span>
          </button>
        </div>

        <!-- Prep Bay Capital & Cost KPIs -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Units In Bay</span>
            <p class="text-2xl font-black text-slate-900 mt-1">${prepCars.length}</p>
            <p class="text-[11px] text-amber-700 font-semibold mt-0.5">${reconStageCars.length} Recon/PMS &bull; ${detailStageCars.length} Detailing</p>
          </div>
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Unit Buy-In</span>
            <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(totalBuyInCapital)}</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Acquisition capital in prep</p>
          </div>
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Recon &amp; Detailing Spent</span>
            <p class="text-2xl font-black text-amber-700 mt-1">${formatPHP(totalPrepSpent)}</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Auto-added to floor prices</p>
          </div>
          <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-xs">
            <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">Target Release Value</span>
            <p class="text-2xl font-black mt-1">${formatPHP(projectedShowroomValue)}</p>
            <p class="text-[11px] text-emerald-300 font-semibold mt-0.5">Est. Patong Net: ${formatPHP(projectedPatongProfit)}</p>
          </div>
        </div>

        <!-- Stage Filter Pills -->
        <div class="flex items-center gap-2 mb-5 overflow-x-auto pb-1">
          ${[
            { id: 'ALL', label: `All In Prep (${prepCars.length})` },
            { id: 'RECON', label: `Step 2: Reconditioning / PMS (${reconStageCars.length})` },
            { id: 'DETAILING', label: `Step 3: Detailing (${detailStageCars.length})` }
          ].map(tab => `
            <button
              onclick="setPrepFilter('${tab.id}')"
              class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                state.prepFilter === tab.id
                  ? 'bg-slate-900 text-white shadow-xs'
                  : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
              }"
            >
              ${tab.label}
            </button>
          `).join('')}
        </div>

        ${filteredPrepCars.length === 0 ? `
          <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
            <i data-lucide="sparkles" class="w-10 h-10 text-emerald-500 mx-auto mb-3"></i>
            <p class="text-sm font-bold text-slate-800">All preparation bays are clear!</p>
            <p class="text-xs text-slate-500 mt-1">Acquire a car lead in Car Sourcing or click "Intake Newly Bought Unit" to start reconditioning and detailing.</p>
          </div>
        ` : `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${filteredPrepCars.map(car => {
              const photos = getCarPhotos(car);
              const primaryPhoto = photos[0];
              const stageMeta = getStatusStageMeta(car.status);
              const prepStep = getPrepWorkflowStep(car);
              const nextStage = getNextPrepWorkflowStage(car);
              const buyIn = getCarAcquisitionCost(car);
              const reconTotal = getCarReconTotal(car);
              const marginBuffer = getCarMarginBuffer(car);
              const totalInvested = buyIn + reconTotal;
              const estProfitPatong = car.basePrice - totalInvested;
              const estProfitComm = Math.round(car.basePrice * (1 - state.commissionRate / 100)) - totalInvested;
              const score = getChecklistScore(car.checklist);

              return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
                  <!-- Top Photo & Stage Header -->
                  <div class="relative h-44 bg-slate-900 overflow-hidden">
                    <img
                      src="${primaryPhoto.url}"
                      alt="${car.year} ${escapeHtml(car.make)} ${escapeHtml(car.model)}"
                      onclick="openCarGalleryModal('${car.id}', 0)"
                      class="w-full h-full object-cover cursor-pointer hover:scale-105 transition duration-300"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/20 to-transparent pointer-events-none"></div>

                    <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                      <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold border shadow-xs ${stageMeta.palette.badgeClass}">
                        ${escapeHtml(car.status)}
                      </span>
                      <span class="px-2 py-1 rounded-full text-[10px] font-bold bg-slate-950/80 text-slate-200 border border-white/15">
                        Hidden from Agents
                      </span>
                    </div>

                    <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5">
                      <button
                        onclick="openEditCarImagesModal('${car.id}')"
                        class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-600/95 hover:bg-emerald-600 text-white shadow-xs flex items-center gap-1 transition"
                      >
                        <i data-lucide="camera" class="w-3 h-3"></i>
                        <span>Photos (${photos.length})</span>
                      </button>
                    </div>

                    <div class="absolute bottom-2.5 left-3 right-3 flex items-end justify-between gap-2">
                      <div>
                        <p class="text-[11px] font-bold uppercase tracking-wider text-amber-300">
                          ${car.year} &bull; ${escapeHtml(car.plateNo)} &bull; ${escapeHtml(car.mileage)}
                        </p>
                        <h3 class="text-base font-extrabold text-white">${escapeHtml(car.make)} ${escapeHtml(car.model)}</h3>
                      </div>
                      <button
                        onclick="openChecklistModal('${car.id}')"
                        class="px-2 py-1 rounded-lg text-[10px] font-extrabold ${score.passed === score.total ? 'bg-emerald-500 text-slate-950' : 'bg-amber-400 text-slate-950'} flex items-center gap-1"
                      >
                        <i data-lucide="clipboard-check" class="w-3 h-3"></i>
                        <span>${score.passed}/${score.total} Checks</span>
                      </button>
                    </div>
                  </div>

                  <!-- Body: 4-Step Pipeline + Inline Cost Roll-up Box -->
                  <div class="p-4 sm:p-5 space-y-4 flex-1 flex flex-col justify-between">
                    <div class="space-y-4">
                      <!-- 4-Step Workflow Tracker -->
                      <div class="p-3 rounded-xl bg-amber-50/80 border border-amber-200">
                        <div class="flex items-center justify-between gap-2 mb-2">
                          <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-900">
                            Prep Pipeline (Step ${prepStep} of 4)
                          </span>
                          ${nextStage ? `
                            <button
                              onclick="advanceCarPrepStage('${car.id}')"
                              class="px-3 py-1 rounded-lg text-[11px] font-extrabold ${
                                nextStage.systemRole === 'AVAILABLE'
                                  ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                  : 'bg-amber-500 hover:bg-amber-600 text-slate-950'
                              } transition flex items-center gap-1 shadow-xs"
                            >
                              <span>${nextStage.systemRole === 'AVAILABLE' ? 'Release to Live Inventory' : `Move to ${escapeHtml(nextStage.label)}`}</span>
                              <i data-lucide="arrow-right" class="w-3 h-3"></i>
                            </button>
                          ` : ''}
                        </div>
                        <div class="grid grid-cols-4 gap-1 text-[10px] font-bold">
                          ${[
                            { step: 1, label: '1. Acquired' },
                            { step: 2, label: '2. Recon/PMS' },
                            { step: 3, label: '3. Detailing' },
                            { step: 4, label: '4. Release' }
                          ].map(st => {
                            const done = prepStep > st.step;
                            const current = prepStep === st.step;
                            return `
                              <div class="px-1.5 py-1 rounded text-center truncate ${
                                current
                                  ? 'bg-amber-500 text-slate-950 font-extrabold'
                                  : done
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : 'bg-white/80 text-slate-400 border border-amber-200/60'
                              }">
                                ${st.label}
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>

                      <!-- INLINE RECONDITIONING, DETAILING & BASE SELLING PRICE BOX -->
                      <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3.5 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-extrabold text-slate-900 flex items-center gap-1.5">
                            <i data-lucide="calculator" class="w-4 h-4 text-emerald-600"></i>
                            <span>Prep Cost &amp; Base Selling Price Builder</span>
                          </span>
                          <button
                            onclick="openCarReconModal('${car.id}')"
                            class="text-[11px] font-bold text-emerald-700 hover:underline"
                          >
                            Edit Buy-In / Full Ledger
                          </button>
                        </div>

                        <!-- 3-Column Cost Formula Summary + Net Profit Readout -->
                        <div class="grid grid-cols-3 gap-2 text-xs">
                          <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] font-bold text-slate-400 uppercase block">Unit Buy-In</span>
                            <span class="font-extrabold text-slate-900">${formatPHP(buyIn)}</span>
                          </div>
                          <div class="bg-white p-2.5 rounded-xl border border-amber-200">
                            <span class="text-[10px] font-bold text-amber-700 uppercase block">+ Recon/Detail</span>
                            <span class="font-extrabold text-amber-800">${formatPHP(reconTotal)}</span>
                          </div>
                          <div class="bg-slate-900 text-white p-2.5 rounded-xl">
                            <span class="text-[10px] font-bold text-emerald-400 uppercase block">Base Sell Price</span>
                            <span class="font-black text-sm">${formatPHP(car.basePrice)}</span>
                          </div>
                        </div>

                        <!-- Live Est. Net Profit Box (Patong vs Commission) -->
                        <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                          <div>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-800 block">Est. Net Profit (Patong Deal)</span>
                            <span class="text-base font-black ${estProfitPatong >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${formatPHP(estProfitPatong)}</span>
                          </div>
                          <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-600 block">If sold @ ${Number(state.commissionRate).toFixed(1)}% Comm</span>
                            <span class="text-xs font-extrabold ${estProfitComm >= 0 ? 'text-slate-800' : 'text-rose-600'}">${formatPHP(estProfitComm)} net</span>
                          </div>
                        </div>

                        <!-- Dealership Target Profit Buffer Input -->
                        <div class="flex items-center justify-between gap-2 bg-white px-3 py-2 rounded-xl border border-slate-200">
                          <label class="text-[11px] font-bold text-slate-600">Dealership Margin / Profit Buffer (PHP):</label>
                          <input
                            type="number"
                            min="0"
                            step="1000"
                            value="${marginBuffer}"
                            onchange="updateCarMarginInline('${car.id}', this.value)"
                            class="w-32 px-2.5 py-1 border border-slate-300 rounded-lg text-xs font-extrabold text-right text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>

                        <!-- Quick Add Reconditioning / Detailing Expense Form -->
                        <form onsubmit="submitInlineReconExpense(event, '${car.id}')" class="grid grid-cols-1 sm:grid-cols-12 gap-1.5 pt-1">
                          <select name="category" class="sm:col-span-4 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold">
                            ${RECON_CATEGORIES.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('')}
                          </select>
                          <input
                            type="text"
                            name="note"
                            required
                            placeholder="Item / shop (e.g., Exterior buff)"
                            class="sm:col-span-4 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px]"
                          />
                          <input
                            type="number"
                            name="amount"
                            required
                            min="100"
                            step="100"
                            placeholder="PHP ₱"
                            class="sm:col-span-2 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] font-bold"
                          />
                          <button
                            type="submit"
                            class="sm:col-span-2 px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-extrabold transition"
                          >
                            + Add
                          </button>
                        </form>

                        <!-- Itemized Expenses List -->
                        ${(car.reconExpenses || []).length > 0 ? `
                          <div class="divide-y divide-slate-200/80 border-t border-slate-200 pt-1.5 max-h-32 overflow-y-auto">
                            ${car.reconExpenses.map(exp => `
                              <div class="py-1.5 flex items-center justify-between gap-2 text-[11px]">
                                <div class="min-w-0">
                                  <span class="font-bold text-slate-800">${escapeHtml(exp.category)}:</span>
                                  <span class="text-slate-600">${escapeHtml(exp.note)}</span>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                  <span class="font-extrabold text-amber-800">+${formatPHP(exp.amount)}</span>
                                  <button
                                    type="button"
                                    onclick="deleteReconExpense('${car.id}', '${exp.id}')"
                                    title="Remove expense"
                                    class="text-slate-400 hover:text-rose-600"
                                  >
                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                  </button>
                                </div>
                              </div>
                            `).join('')}
                          </div>
                        ` : `
                          <p class="text-[11px] text-slate-400 italic">No detailing or repair expenses logged yet.</p>
                        `}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    // =========================================================================
    // 5. VIEW 2: CONFLICT-FREE VIEWING CALENDAR (ATOMIC SLOT LOCKING)
    // =========================================================================
    const TIME_SLOTS = ['09:00 AM', '10:00 AM', '11:00 AM', '01:00 PM', '02:00 PM', '03:00 PM', '04:00 PM', '05:00 PM'];

    function renderCalendarView() {
      const user = getCurrentUser();
      const isOwner = isOwnerRole(user);
      const bookableCars = state.cars.filter(c => !isCarSold(c) && !isCarInPreparation(c));

      if (!bookableCars.some(c => c.id === state.calendarCarId) && bookableCars.length > 0) {
        state.calendarCarId = bookableCars[0].id;
      }

      const selectedCar = state.cars.find(c => c.id === state.calendarCarId) || bookableCars[0];
      const dateOptions = [getDateOffsetStr(0), getDateOffsetStr(1), getDateOffsetStr(2)];

      if (!dateOptions.includes(state.calendarDateFilter)) {
        state.calendarDateFilter = dateOptions[0];
      }

      const dayBookings = selectedCar
        ? state.bookings.filter(b => b.carId === selectedCar.id && b.date === state.calendarDateFilter && b.status === 'CONFIRMED')
        : [];

      const priorityLockedForMe = selectedCar ? hasActivePriorityLock(selectedCar, user) : false;
      const scoutAgent = selectedCar?.sourcedByAgentId ? getUserRecord(selectedCar.sourcedByAgentId) : null;

      return `
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">Conflict-Free Viewing Calendar</h2>
            <p class="text-xs text-slate-500 mt-0.5">Atomic time-slot locking prevents two partner agents from bringing buyers at the exact same hour.</p>
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
            <select
              onchange="setCalendarCar(this.value)"
              class="px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 shadow-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
            >
              ${bookableCars.map(c => `
                <option value="${c.id}" ${c.id === selectedCar?.id ? 'selected' : ''}>
                  ${c.year} ${escapeHtml(c.make)} ${escapeHtml(c.model)} (${escapeHtml(c.plateNo)}) — ${escapeHtml(c.status)}
                </option>
              `).join('')}
            </select>

            <div class="inline-flex bg-white p-1 rounded-xl border border-slate-200 shadow-xs">
              ${dateOptions.map(d => `
                <button
                  onclick="setCalendarDate('${d}')"
                  class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    state.calendarDateFilter === d
                      ? 'bg-emerald-600 text-white'
                      : 'text-slate-600 hover:bg-slate-100'
                  }"
                >
                  ${formatDisplayDate(d)}
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        ${!selectedCar ? `
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">
            No showroom-ready units available for viewing schedules.
          </div>
        ` : `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left: Selected Vehicle Summary -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4 self-start">
              <div class="relative h-40 rounded-xl overflow-hidden bg-slate-900">
                <img src="${getCarPhotos(selectedCar)[0].url}" alt="${escapeHtml(selectedCar.model)}" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/75 via-transparent to-transparent"></div>
                <span class="absolute top-2.5 left-2.5 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold border ${getStatusStageMeta(selectedCar.status).palette.badgeClass}">
                  ${escapeHtml(selectedCar.status)}
                </span>
                <div class="absolute bottom-2.5 left-3 right-3 text-white">
                  <p class="text-[11px] font-bold text-emerald-300">${selectedCar.year} &bull; ${escapeHtml(selectedCar.plateNo)}</p>
                  <p class="text-sm font-extrabold truncate">${escapeHtml(selectedCar.make)} ${escapeHtml(selectedCar.model)}</p>
                </div>
              </div>

              <div class="flex items-center justify-between text-xs border-b border-slate-100 pb-3">
                <span class="text-slate-500 font-medium">Base Floor Price</span>
                <span class="text-base font-black text-slate-900">${formatPHP(selectedCar.basePrice)}</span>
              </div>

              ${isCarReserved(selectedCar) ? `
                <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-900">
                  <p class="font-extrabold">Unit Currently Reserved</p>
                  <p class="text-[11px] mt-0.5">Held by ${escapeHtml(getUserRecord(selectedCar.reservation?.agentId)?.name || 'Agent')}. New viewings are paused unless the hold is released.</p>
                </div>
              ` : priorityLockedForMe ? `
                <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                  <p class="font-extrabold">48h Scout Priority Window</p>
                  <p class="text-[11px] mt-0.5">Sourced by ${escapeHtml(scoutAgent?.name || 'Partner Agent')}. Other agents cannot book until the 48h window expires.</p>
                </div>
              ` : `
                <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900">
                  <p class="font-bold">Open for Buyer Viewings</p>
                  <p class="text-[11px] mt-0.5">Tap any green slot on the right to lock a 1-hour showroom viewing.</p>
                </div>
              `}
            </div>

            <!-- Right: Atomic Hourly Slot Grid -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-extrabold text-slate-900">
                  Showroom Slots &mdash; ${formatDisplayDate(state.calendarDateFilter)}
                </h3>
                <span class="text-[11px] font-semibold text-slate-500">
                  ${dayBookings.length} / ${TIME_SLOTS.length} Slots Booked
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${TIME_SLOTS.map(slot => {
                  const booking = dayBookings.find(b => b.slot === slot);
                  if (booking) {
                    const holder = getUserRecord(booking.agentId);
                    const isMine = booking.agentId === user.id;
                    const canSeeBuyer = isOwner || isMine;
                    return `
                      <div class="p-3.5 rounded-2xl border ${isMine ? 'bg-indigo-50/70 border-indigo-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between gap-3">
                        <div class="min-w-0">
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-black text-slate-900">${slot}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isMine ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}">
                              ${isMine ? 'Your Booking' : `Locked • ${escapeHtml(holder.name.split(' ')[0])}`}
                            </span>
                          </div>
                          ${canSeeBuyer ? `
                            <p class="text-xs font-bold text-slate-800 mt-1 truncate">${escapeHtml(booking.buyerName)}</p>
                            <p class="text-[11px] text-slate-500">${escapeHtml(booking.buyerPhone)} &bull; Agent: ${escapeHtml(holder.name)}</p>
                          ` : `
                            <p class="text-[11px] text-slate-500 mt-1 flex items-center gap-1">
                              <i data-lucide="eye-off" class="w-3 h-3"></i> Buyer details private to ${escapeHtml(holder.name)}
                            </p>
                          `}
                        </div>

                        ${canSeeBuyer ? `
                          <button
                            onclick="cancelBooking('${booking.id}')"
                            class="shrink-0 px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition"
                          >
                            Release
                          </button>
                        ` : `
                          <span class="shrink-0 p-2 rounded-xl bg-slate-200/70 text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                          </span>
                        `}
                      </div>
                    `;
                  }

                  const disabled = !isCarBookable(selectedCar) || priorityLockedForMe;
                  return `
                    <button
                      onclick="openBookViewingModal('${selectedCar.id}', '${state.calendarDateFilter}', '${slot}')"
                      ${disabled ? 'disabled' : ''}
                      class="p-3.5 rounded-2xl border text-left transition flex items-center justify-between ${
                        disabled
                          ? 'bg-slate-50 border-slate-200 opacity-55 cursor-not-allowed'
                          : 'bg-emerald-50/40 hover:bg-emerald-50 border-emerald-200 hover:border-emerald-400 cursor-pointer'
                      }"
                    >
                      <div>
                        <span class="text-xs font-black text-slate-900 block">${slot}</span>
                        <span class="text-[11px] font-semibold ${disabled ? 'text-slate-400' : 'text-emerald-700'}">
                          ${disabled ? 'Unavailable' : 'Available — Tap to Lock Slot'}
                        </span>
                      </div>
                      <span class="w-8 h-8 rounded-xl ${disabled ? 'bg-slate-200 text-slate-400' : 'bg-emerald-600 text-white'} flex items-center justify-center">
                        <i data-lucide="${disabled ? 'lock' : 'plus'}" class="w-4 h-4"></i>
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `}
      `;
    }

    // =========================================================================
    // 6. VIEW 3: SALES LEDGER, PAYOUTS & OWNER BI DASHBOARD
    // =========================================================================
    function renderSalesView() {
      const user = getCurrentUser();
      const isOwner = isOwnerRole(user);

      const visibleSales = isOwner
        ? state.sales
        : state.sales.filter(s => s.agentId === user.id);

      const approvedSales = visibleSales.filter(s => s.status === 'APPROVED');
      const pendingSales = visibleSales.filter(s => s.status === 'PENDING');

      const totalDealershipNet = approvedSales.reduce((sum, s) => sum + s.dealershipNet, 0);
      const totalVerifiedNetProfit = approvedSales.reduce((sum, s) => {
        const car = state.cars.find(c => c.id === s.carId);
        const unitCost = typeof s.unitCostSnapshot === 'number'
          ? s.unitCostSnapshot
          : (car ? getCarTotalInvested(car) : s.basePriceSnapshot);
        const scoutPayout = Number(s.sourcingBonus) || 0;
        return sum + (s.dealershipNet - unitCost - scoutPayout);
      }, 0);
      const totalAgentEarned = approvedSales.reduce((sum, s) => sum + s.agentPayout, 0);
      const totalPendingPayout = pendingSales.reduce((sum, s) => sum + s.agentPayout, 0);

      const activeCars = state.cars.filter(c => !isCarSold(c));
      const avgDaysOnLot = activeCars.length
        ? Math.round(activeCars.reduce((sum, c) => sum + c.listedDaysAgo, 0) / activeCars.length)
        : 0;
      const slowMovingCount = activeCars.filter(c => c.listedDaysAgo >= 30).length;

      const agentLeaderboard = Object.values(state.agents)
        .filter(u => u.role === 'AGENT')
        .map(agent => {
          const closed = state.sales.filter(s => s.agentId === agent.id && s.status === 'APPROVED');
          const earned = closed.reduce((sum, s) => sum + s.agentPayout, 0);
          return { ...agent, unitsSold: closed.length, earned };
        })
        .sort((a, b) => b.unitsSold - a.unitsSold || b.earned - a.earned);

      return `
        <!-- Top Header & CSV Export -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">
              ${isOwner ? 'Dealership Sales Ledger & Turnover BI' : 'My Closed Deals & Payout Tracker'}
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
              ${isOwner
                ? 'Tracks Base Floor Revenue, Net Profit after Buy-In & Recon, Agent Commissions, and Inventory Aging.'
                : 'Your private earnings ledger across Base + Markup (Patong) and % Commission deals.'}
            </p>
          </div>

          <div class="flex items-center gap-2">
            ${isOwner ? `
              <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-slate-200 text-xs">
                <span class="font-bold text-slate-600">Default Comm %:</span>
                <input
                  type="number"
                  step="0.5"
                  min="1.0"
                  max="3.0"
                  value="${Number(state.commissionRate).toFixed(1)}"
                  onchange="updateCommissionRate(this.value)"
                  class="w-14 font-extrabold text-slate-900 border border-slate-200 rounded-lg px-1.5 py-0.5 text-center"
                />
              </div>
              <button
                onclick="exportSalesLedgerCSV()"
                class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5 transition"
              >
                <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>Export CSV</span>
              </button>
            ` : ''}
          </div>
        </div>

        <!-- KPI Summary Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
              ${isOwner ? 'Verified Net Profit' : 'Approved Earnings'}
            </span>
            <p class="text-2xl font-black text-slate-900 mt-1">
              ${formatPHP(isOwner ? totalVerifiedNetProfit : totalAgentEarned)}
            </p>
            <p class="text-[11px] text-emerald-600 font-semibold mt-0.5">
              ${isOwner ? `Gross Net: ${formatPHP(totalDealershipNet)} (${approvedSales.length} sold)` : `${approvedSales.length} verified deal(s)`}
            </p>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
              ${isOwner ? 'Agent Payouts Approved' : 'Pending Verification'}
            </span>
            <p class="text-2xl font-black text-slate-900 mt-1">
              ${formatPHP(isOwner ? totalAgentEarned : totalPendingPayout)}
            </p>
            <p class="text-[11px] text-amber-600 font-semibold mt-0.5">
              ${pendingSales.length} deal(s) awaiting release
            </p>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Avg Days on Lot</span>
            <p class="text-2xl font-black text-slate-900 mt-1">${avgDaysOnLot} Days</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Active inventory velocity</p>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Slow-Moving (&ge;30d)</span>
            <p class="text-2xl font-black ${slowMovingCount > 0 ? 'text-amber-600' : 'text-emerald-600'} mt-1">${slowMovingCount} Unit(s)</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Flagged for price boost</p>
          </div>
        </div>

        ${isOwner ? `
          <!-- Owner Agent Leaderboard -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs mb-6">
            <h3 class="text-sm font-extrabold text-slate-900 mb-3">Partner Agent Performance Leaderboard</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${agentLeaderboard.map((ag, idx) => `
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-lg ${idx === 0 ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-700'} text-xs font-black flex items-center justify-center">
                      #${idx + 1}
                    </span>
                    <div>
                      <p class="text-xs font-extrabold text-slate-900">${escapeHtml(ag.name)}</p>
                      <p class="text-[11px] text-slate-500">${ag.unitsSold} Unit(s) Closed</p>
                    </div>
                  </div>
                  <span class="text-xs font-black text-emerald-700">${formatPHP(ag.earned)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Sales Transactions Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-slate-900">Closed &amp; Pending Vehicle Transactions</h3>
            <span class="text-xs font-semibold text-slate-500">${visibleSales.length} Record(s)</span>
          </div>

          ${visibleSales.length === 0 ? `
            <div class="p-10 text-center text-xs text-slate-500">
              No sales recorded yet under this view.
            </div>
          ` : `
            <div class="divide-y divide-slate-100">
              ${visibleSales.map(sale => {
                const agent = getUserRecord(sale.agentId);
                const isMarkup = sale.payoutModel === 'MARKUP';
                const showBuyerPrice = !isMarkup || !isOwner;
                const car = state.cars.find(c => c.id === sale.carId);
                const unitCost = typeof sale.unitCostSnapshot === 'number'
                  ? sale.unitCostSnapshot
                  : (car ? getCarTotalInvested(car) : sale.basePriceSnapshot);
                const scoutBonus = Number(sale.sourcingBonus) || 0;
                const scoutUser = sale.sourcedByAgentId ? getUserRecord(sale.sourcedByAgentId) : null;
                const dealNetProfit = sale.dealershipNet - unitCost - scoutBonus;

                return `
                  <div class="p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div class="space-y-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-extrabold text-slate-900">${escapeHtml(sale.carTitle)}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                          isMarkup
                            ? 'bg-indigo-100 text-indigo-800'
                            : 'bg-sky-100 text-sky-800'
                        }">
                          ${isMarkup ? 'Base + Markup (Patong)' : `${sale.commissionRateApplied || state.commissionRate}% Commission`}
                        </span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                          sale.status === 'APPROVED'
                            ? 'bg-emerald-100 text-emerald-800'
                            : 'bg-amber-100 text-amber-900'
                        }">
                          ${sale.status}
                        </span>
                      </div>
                      <p class="text-xs text-slate-500">
                        Sold by: <strong class="text-slate-700">${escapeHtml(agent.name)}</strong> &bull; Date: ${escapeHtml(sale.date)}
                        ${scoutBonus > 0 && scoutUser ? ` &bull; <span class="text-indigo-700 font-semibold">Scout Bonus: ${formatPHP(scoutBonus)} (${escapeHtml(scoutUser.name)})</span>` : ''}
                      </p>
                      ${sale.notes ? `<p class="text-[11px] text-slate-500 italic">"${escapeHtml(sale.notes)}"</p>` : ''}
                    </div>

                    <div class="flex flex-wrap items-center gap-4 sm:gap-6">
                      <div class="text-xs">
                        <span class="text-slate-400 block text-[10px]">Floor Price</span>
                        <strong class="text-slate-800">${formatPHP(sale.basePriceSnapshot)}</strong>
                      </div>

                      <div class="text-xs">
                        <span class="text-slate-400 block text-[10px]">Buyer Price</span>
                        <strong class="text-slate-800">
                          ${showBuyerPrice
                            ? formatPHP(sale.reportedSalePrice || (sale.basePriceSnapshot + sale.agentMarkup))
                            : 'Private (Patong)'}
                        </strong>
                      </div>

                      ${isOwner ? `
                        <div class="text-xs">
                          <span class="text-slate-400 block text-[10px]">Net Profit</span>
                          <strong class="${dealNetProfit >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${formatPHP(dealNetProfit)}</strong>
                        </div>
                      ` : ''}

                      <div class="text-xs">
                        <span class="text-slate-400 block text-[10px]">Agent Payout</span>
                        <strong class="text-emerald-700 text-sm font-black">${formatPHP(sale.agentPayout)}</strong>
                      </div>

                      ${isOwner && sale.status === 'PENDING' ? `
                        <button
                          onclick="approveSalePayout('${sale.id}')"
                          class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs transition"
                        >
                          Verify &amp; Approve
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // =========================================================================
    // 7. VIEW 4: CAR SOURCING & 48-HOUR AGENT LEAD ATTRIBUTION
    // =========================================================================
    function renderSourcingView() {
      const user = getCurrentUser();
      const isOwner = isOwnerRole(user);
      const incentiveCfg = state.sourcingIncentive || { enabled: false, type: 'FIXED', amount: 5000 };
      const incentiveLabel = incentiveCfg.type === 'PERCENT'
        ? `${Number(incentiveCfg.amount).toFixed(1)}% of Base Floor Price`
        : `${formatPHP(incentiveCfg.amount)} Finder's Bonus`;

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">Off-Market Car Sourcing &amp; 48h Lead Attribution</h2>
            <p class="text-xs text-slate-500 mt-0.5">
              Agents submit direct seller leads with a 9-point screening check. Once acquired, the car enters <strong>Under Prep (Reconditioning / PMS)</strong> with a <strong>48-hour exclusive booking lock</strong> for the scouting agent.
            </p>
          </div>

          <button
            onclick="openSubmitLeadModal()"
            class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition"
          >
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>Submit Seller Lead</span>
          </button>
        </div>

        <!-- Optional Sourced Car Finder's Incentive Banner / Owner Control -->
        <div class="mb-5 p-4 rounded-2xl border ${incentiveCfg.enabled ? 'bg-indigo-50/80 border-indigo-200' : 'bg-slate-100 border-slate-200'} flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-xl ${incentiveCfg.enabled ? 'bg-indigo-600 text-white' : 'bg-slate-300 text-slate-600'} flex items-center justify-center shrink-0">
              <i data-lucide="gift" class="w-4 h-4"></i>
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-extrabold text-slate-900">Sourced Car Finder's Incentive</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${incentiveCfg.enabled ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                  ${incentiveCfg.enabled ? `ACTIVE: ${incentiveLabel} on Sale` : 'OFF (48h Priority Lock Only)'}
                </span>
              </div>
              <p class="text-[11px] text-slate-600 mt-0.5">
                ${incentiveCfg.enabled

            </div>

      if (modalType === 'reserve-car') {
