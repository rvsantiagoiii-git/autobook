    function acquireLeadIntoInventory(leadId) {
      if (!isLeadership(getCurrentUser())) return;
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead || lead.status === 'ACQUIRED') return;

      lead.status = 'ACQUIRED';
      const parts = lead.makeModel.trim().split(/\s+/);
      const parsedYear = parseInt(parts[0], 10);
      const year = !Number.isNaN(parsedYear) && parsedYear > 1990 ? parsedYear : 2021;
      const make = !Number.isNaN(parsedYear) ? (parts[1] || 'Toyota') : (parts[0] || 'Toyota');
      const model = !Number.isNaN(parsedYear) ? parts.slice(2).join(' ') : parts.slice(1).join(' ');

      const acquisitionPrice = Number(lead.askingPrice) || 850000;
      const reconAmt = Number(lead.estRecon) || 15000;
      const basePrice = Number(lead.targetFloorPrice) || (acquisitionPrice + reconAmt + 45000);
      const targetMargin = Math.max(0, basePrice - acquisitionPrice - reconAmt);
      const lockedFee = clampFindersAmount(lead.finderFeeAmount ?? getAutoTieredFindersAmount(basePrice));

      state.cars.unshift({
        id: 'car_' + Date.now(),
        make,
        model: model || 'Showroom Unit',
        year,
        plateNo: lead.plateNo,
        mileage: lead.mileage,
        fuel: 'Gasoline',
        color: 'Showroom Finish',
        acquisitionPrice,
        targetMargin,
        reconExpenses: reconAmt > 0
          ? [{ id: 'rec_' + Date.now(), category: 'Mechanical / PMS', note: 'Initial intake recon budget', amount: reconAmt }]
          : [],
        basePrice,
        status: 'Get the Car (Intake)',
        sourcedByAgentId: lead.agentId,
        finderFeeAmount: lockedFee,
        finderFeeAutoScaled: false,
        priorityLockUntil: Date.now() + (48 * 60 * 60 * 1000),
        soldAt: null,
        soldByAgentId: null,
        photos: [
          { label: 'Sourced Unit Intake', url: makeCarSamplePhoto(lead.makeModel, '#312e81', '#818cf8', `${formatPHP(lockedFee)} SCOUTED`) }
        ],
        checklist: {
          orcr_docs: true, no_lto_alarm: true, open_deed_ids: true,
          not_flooded: true, no_major_accident: true, odo_not_tampered: true,
          cold_ac_engine: true, fresh_paint_interior: false, spare_jack_keys: true
        },
        reservation: null
      });

      state.activeTab = 'prep';
      saveState();
      renderApp();
      emitLiveEvent(
        'Lead Acquired to Under Prep!',
        `${lead.makeModel} moved to Under Prep with ${formatPHP(lockedFee)} Fixed Finder’s Fee locked to ${getUserRecord(lead.agentId).name}.`,
        'emerald'
      );
    }

      renderApp();
      if (!forceSilent) {
        emitLiveEvent('Demo Reset Complete', 'Magief Cars AutoBook v2.0 restored with default inventory, proofs & ₱3,000–₱10,000 Fixed Finder’s Fees.', 'emerald');
      }
    }

    // CSV Export
    function exportSalesLedgerCSV() {
      const user = getCurrentUser();
      const leadership = isLeadership(user);
      const rows = leadership
        ? state.sales
        : state.sales.filter(s => s.agentId === user.id || s.sourcedByAgentId === user.id);

      const headers = [
        'Sale ID', 'Date', 'Vehicle', 'Buyer', 'Closing Agent', 'Closing Model',
        'Closing Payout (PHP)', 'Closing Released',
        'Sourcing Agent', 'Price Tier', 'Fixed Finder Fee (PHP)', 'Finder Released',
        'Payment Channel', 'Reference No', 'Funds Status', 'Base Floor Price (PHP)', 'Final Selling Price (PHP)'
      ];

      const lines = [headers.join(',')];
      rows.forEach(s => {
        const closer = getUserRecord(s.agentId).name;
        const scout = s.sourcedByAgentId ? getUserRecord(s.sourcedByAgentId).name : 'Direct Lot';
        const basis = Number(s.sourcingPriceBasis) || Number(s.basePriceSnapshot) || 0;
        const bonus = Number(s.sourcingBonus) || 0;
        const tierLabel = s.sourcingTierLabel || getPriceTierLabel(basis);

        const cols = [
          s.id,
          s.date,
          `"${String(s.carTitle || '').replace(/"/g, '""')}"`,
          `"${String(s.buyerName || '').replace(/"/g, '""')}"`,
          `"${closer}"`,
          s.payoutModel === 'MARKUP' ? 'Base + Patong' : `${s.commissionRateApplied || state.commissionRate}% Comm`,
          Number(s.agentPayout) || 0,
          s.closingPayoutReleased ? 'Released' : 'Pending',
          `"${scout}"`,
          `"${s.sourcedByAgentId ? tierLabel : 'N/A'}"`,
          bonus,
          s.sourcedByAgentId ? (s.sourcingBonusReleased ? 'Released' : 'Pending') : 'N/A',
          `"${String(s.paymentChannel || '').replace(/"/g, '""')}"`,
          `"${String(s.referenceNo || '').replace(/"/g, '""')}"`,
          s.paymentVerified !== false ? 'Funds Cleared' : 'Pending Proof',
          Number(s.basePriceSnapshot) || 0,
          Number(s.finalSellingPrice) || 0
        ];
        lines.push(cols.join(','));
      });

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Magief_Cars_Sales_and_Finders_Payouts_${getDateOffsetStr(0)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      emitLiveEvent('CSV Exported', `Downloaded ${rows.length} closed deal & finder's fee record(s).`, 'emerald');
    }

    // =========================================================================
    // 13. MAIN RENDER CONTROLLER & DOMContentLoaded BOOTSTRAP
    // =========================================================================
    function renderApp() {
      applyBrandingToDocument(state.branding);
      renderRoleSwitcher();
      renderNavigation();

      const appContent = document.getElementById('app-content');
      if (!appContent) return;

      if (state.activeTab === 'inventory') {
        appContent.innerHTML = renderInventoryView();
      } else if (state.activeTab === 'prep') {
        appContent.innerHTML = renderUnderPrepView();
      } else if (state.activeTab === 'calendar') {
        appContent.innerHTML = renderCalendarView();
      } else if (state.activeTab === 'sourcing') {
        appContent.innerHTML = renderSourcingView();
      } else if (state.activeTab === 'sales') {
        appContent.innerHTML = renderSalesView();
      } else if (state.activeTab === 'settings') {
        appContent.innerHTML = renderSettingsView();
      } else {
        state.activeTab = 'inventory';
        appContent.innerHTML = renderInventoryView();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const switcher = document.getElementById('role-switcher');
      if (switcher) {
        switcher.addEventListener('change', e => {
          state.currentUserId = e.target.value;
          saveState();
          renderApp();
          const u = getCurrentUser();
          emitLiveEvent('Active Profile Switched', `Viewing workspace as ${u.name} (${u.label}).`, 'indigo');
        });
      }

      renderApp();
    });
  </script>
</body>
</html>
