<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoBook v2.0 — Real-Time Dealership & Agent Booking Platform</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --brand-50: #ecfdf5;
      --brand-100: #d1fae5;
      --brand-200: #a7f3d0;
      --brand-300: #6ee7b7;
      --brand-400: #34d399;
      --brand-500: #10b981;
      --brand-600: #059669;
      --brand-700: #047857;
      --brand-on-primary: #ffffff;
      --brand-font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--brand-font);
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    /* Dynamic Dealership Brand Accent Overrides */
    .bg-emerald-50 { background-color: var(--brand-50) !important; }
    .bg-emerald-100 { background-color: var(--brand-100) !important; }
    .hover\:bg-emerald-100:hover { background-color: var(--brand-100) !important; }
    .hover\:bg-emerald-200:hover { background-color: var(--brand-200) !important; }
    .bg-emerald-400 { background-color: var(--brand-400) !important; }
    .bg-emerald-500 { background-color: var(--brand-500) !important; }
    .bg-emerald-600 { background-color: var(--brand-600) !important; color: var(--brand-on-primary) !important; }
    .hover\:bg-emerald-700:hover { background-color: var(--brand-700) !important; }
    .bg-emerald-500\/15 { background-color: color-mix(in srgb, var(--brand-500) 15%, transparent) !important; }
    .bg-emerald-500\/20 { background-color: color-mix(in srgb, var(--brand-500) 20%, transparent) !important; }
    .text-emerald-300 { color: var(--brand-300) !important; }
    .text-emerald-400 { color: var(--brand-400) !important; }
    .text-emerald-600 { color: var(--brand-600) !important; }
    .text-emerald-700 { color: var(--brand-700) !important; }
    .text-emerald-800 { color: var(--brand-700) !important; }
    .text-emerald-900 { color: var(--brand-700) !important; }
    .border-emerald-200 { border-color: var(--brand-200) !important; }
    .border-emerald-400 { border-color: var(--brand-400) !important; }
    .border-emerald-500\/30 { border-color: color-mix(in srgb, var(--brand-500) 30%, transparent) !important; }
    .border-emerald-500\/50 { border-color: color-mix(in srgb, var(--brand-500) 50%, transparent) !important; }
    .hover\:border-emerald-300:hover { border-color: var(--brand-300) !important; }
    .hover\:border-emerald-400:hover { border-color: var(--brand-400) !important; }
    .accent-emerald-600 { accent-color: var(--brand-600) !important; }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .toast-enter {
      animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-8">

  <!-- Real-Time Socket.io Event Toast Stack -->

  <!-- Main Workspace Container -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Rendered dynamically by JS -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur border-t border-slate-800 px-2 py-1.5 grid grid-cols-4 gap-1">

      <span>Sourcing</span>
      <span id="mobile-leads-badge" class="hidden absolute top-1 right-4 w-4 h-4 text-[9px] font-bold rounded-full bg-indigo-500 text-white flex items-center justify-center">0</span>

  <!-- Modal Root Container -->
  <div id="modal-root"></div>

  <script>
    // =========================================================================
    // AUTOBOOK v2.0 — STATE & PHILIPPINE DEALERSHIP DOMAIN MODEL
    // =========================================================================

    const STORAGE_KEY = 'autobook_v2_ph_state_v6';

    // Curated Dealership White-Label Theme Presets & Fonts
    const BRAND_THEMES = {
      emerald: {
        name: 'Emerald Executive (Default)',
        c50: '#ecfdf5', c100: '#d1fae5', c200: '#a7f3d0', c300: '#6ee7b7',
        c400: '#34d399', c500: '#10b981', c600: '#059669', c700: '#047857',
        onPrimary: '#ffffff'
      },
      cobalt: {
        name: 'Midnight Cobalt Blue',
        c50: '#eff6ff', c100: '#dbeafe', c200: '#bfdbfe', c300: '#93c5fd',
        c400: '#60a5fa', c500: '#3b82f6', c600: '#2563eb', c700: '#1d4ed8',
        onPrimary: '#ffffff'
      },
      crimson: {
        name: 'Crimson Performance Red',
        c50: '#fff1f2', c100: '#ffe4e6', c200: '#fecdd3', c300: '#fda4af',
        c400: '#fb7185', c500: '#f43f5e', c600: '#e11d48', c700: '#be123c',
        onPrimary: '#ffffff'
      },
      gold: {
        name: 'Luxury Amber Gold',
        c50: '#fffbeb', c100: '#fef3c7', c200: '#fde68a', c300: '#fcd34d',
        c400: '#fbbf24', c500: '#f59e0b', c600: '#d97706', c700: '#b45309',
        onPrimary: '#ffffff'
      },
      violet: {
        name: 'Royal Indigo & Violet',
        c50: '#f5f3ff', c100: '#ede9fe', c200: '#ddd6fe', c300: '#c4b5fd',
        c400: '#a78bfa', c500: '#8b5cf6', c600: '#7c3aed', c700: '#6d28d9',
        onPrimary: '#ffffff'
      }
    };

    const BRAND_FONTS = {
      inter: { label: 'Inter (Clean Modern SaaS)', stack: "'Inter', system-ui, -apple-system, sans-serif" },
      jakarta: { label: 'Plus Jakarta Sans (Geometric Luxury)', stack: "'Plus Jakarta Sans', 'Inter', sans-serif" },
      roboto_cond: { label: 'Roboto Condensed (Automotive Sport)', stack: "'Roboto Condensed', 'Inter', sans-serif" }
    };

    function getDefaultBranding() {
      return {
        dealershipName: 'Metro Manila Auto Hub',
        tagline: 'Quezon Ave Main Lot',
        logoUrl: '',
        themeKey: 'emerald',
        customHex: '#0f766e',
        fontKey: 'inter'
      };
    }

    // Generate full 50–700 tonal scale & WCAG button contrast from any custom hex color
    function buildCustomThemeFromHex(hexInput) {
      const clean = /^#([0-9A-Fa-f]{6})$/.test(hexInput) ? hexInput : '#059669';
      const r = parseInt(clean.slice(1, 3), 16);
      const g = parseInt(clean.slice(3, 5), 16);
      const b = parseInt(clean.slice(5, 7), 16);

      const mix = (targetR, targetG, targetB, weight) => {
        const nr = Math.round(r * (1 - weight) + targetR * weight);
        const ng = Math.round(g * (1 - weight) + targetG * weight);
        const nb = Math.round(b * (1 - weight) + targetB * weight);
        return '#' + [nr, ng, nb].map(v => v.toString(16).padStart(2, '0')).join('');
      };

      // Relative luminance for automatic white vs. dark text contrast
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return {
        name: `Custom (${clean.toUpperCase()})`,
        c50: mix(255, 255, 255, 0.92),
        c100: mix(255, 255, 255, 0.82),
        c200: mix(255, 255, 255, 0.65),
        c300: mix(255, 255, 255, 0.42),
        c400: mix(255, 255, 255, 0.20),
        c500: mix(255, 255, 255, 0.08),
        c600: clean,
        c700: mix(0, 0, 0, 0.22),
        onPrimary: luminance > 0.62 ? '#0f172a' : '#ffffff'
      };
    }

    function applyDealershipBranding() {
      const b = (state && state.branding) ? state.branding : getDefaultBranding();
      const theme = b.themeKey === 'custom'
        ? buildCustomThemeFromHex(b.customHex || '#059669')
        : (BRAND_THEMES[b.themeKey] || BRAND_THEMES.emerald);
      const font = BRAND_FONTS[b.fontKey] || BRAND_FONTS.inter;
      const rootEl = document.documentElement;

      rootEl.style.setProperty('--brand-50', theme.c50);
      rootEl.style.setProperty('--brand-100', theme.c100);
      rootEl.style.setProperty('--brand-200', theme.c200);
      rootEl.style.setProperty('--brand-300', theme.c300);
      rootEl.style.setProperty('--brand-400', theme.c400);
      rootEl.style.setProperty('--brand-500', theme.c500);
      rootEl.style.setProperty('--brand-600', theme.c600);
      rootEl.style.setProperty('--brand-700', theme.c700);
      rootEl.style.setProperty('--brand-on-primary', theme.onPrimary);
      rootEl.style.setProperty('--brand-font', font.stack);

      const nameEl = document.getElementById('header-dealership-name');
      const tagEl = document.getElementById('header-dealership-tagline');
      const logoBox = document.getElementById('header-brand-logo-box');

      if (nameEl) nameEl.textContent = b.dealershipName || 'Metro Manila Auto Hub';
      if (tagEl) tagEl.textContent = b.tagline || 'Quezon Ave Main Lot';
      if (logoBox) {
        if (b.logoUrl) {
          logoBox.innerHTML = `<img src="${b.logoUrl}" alt="${b.dealershipName}" class="w-full h-full object-cover" />`;
        } else {
          logoBox.innerHTML = `<i data-lucide="car-front" class="w-5 h-5"></i>`;
        }
      }
      document.title = `${b.dealershipName || 'AutoBook'} — Dealership & Agent Portal`;
    }

    // 9-Point Used Car Screening Checklist (Owner Intake & Agent Sourcing)
    const CHECKLIST_ITEMS = [
      {
        id: 'orcr_docs',
        group: 'Legal & LTO Verification',
        label: 'Original OR / CR On-Hand & Verified',
        shortLabel: 'Orig OR/CR'
      },
      {
        id: 'no_lto_alarm',
        group: 'Legal & LTO Verification',
        label: 'Clean LTO / HPG Record (No Alarm or Apprehension)',
        shortLabel: 'No LTO Alarm'
      },
      {
        id: 'open_deed_ids',
        group: 'Legal & LTO Verification',
        label: 'Open Deed of Sale + 2 Valid Owner IDs w/ 3 Signatures',
        shortLabel: 'Deed & IDs'
      },
      {
        id: 'not_flooded',
        group: 'Condition, History & Completeness',
        label: 'Guaranteed Not Flooded (No Silt / Rust / Waterline)',
        shortLabel: 'Not Flooded'
      },
      {
        id: 'no_major_accident',
        group: 'Condition, History & Completeness',
        label: 'No Major Accident / Original Chassis & Apron Intact',
        shortLabel: 'No Major Crash'
      },
      {
        id: 'odo_not_tampered',
        group: 'Condition, History & Completeness',
        label: 'Genuine Odometer Reading (Not Tampered / Rolled Back)',
        shortLabel: 'Genuine Odo'
      },
      {
        id: 'cold_ac_engine',
        group: 'Condition, History & Completeness',
        label: 'Cold A/C & Healthy Engine / Transmission',
        shortLabel: 'Cold A/C & Engine'
      },
      {
        id: 'fresh_paint_interior',
        group: 'Condition, History & Completeness',
        label: 'Fresh Exterior Paint & Clean Interior',
        shortLabel: 'Fresh Paint & Interior'
      },
      {
        id: 'spare_jack_keys',
        group: 'Condition, History & Completeness',
        label: 'Complete Spare Tire, Jack & 2 Original Keys',
        shortLabel: 'Spare, Jack & 2 Keys'
      }
    ];

    // Default Dealership Users & Roles (Multi-Tenant Isolation)
    const DEFAULT_USERS = {
      owner_carlo: { id: 'owner_carlo', name: 'Carlo Mendoza', role: 'OWNER', label: 'Dealership Admin', phone: '0917-100-0001', active: true, joinedAt: 'Founder' },
      agent_marco: { id: 'agent_marco', name: 'Marco Reyes', role: 'AGENT', label: 'Sales Agent', phone: '0917-234-8812', active: true, joinedAt: 'Oct 12' },
      agent_bianca: { id: 'agent_bianca', name: 'Bianca Cruz', role: 'AGENT', label: 'Sales Agent', phone: '0918-902-4410', active: true, joinedAt: 'Oct 18' },
      agent_jomar: { id: 'agent_jomar', name: 'Jomar Santos', role: 'AGENT', label: 'Sales Agent', phone: '0917-611-3390', active: true, joinedAt: 'Nov 02' }
    };

    function getUserRecord(userId) {
      if (typeof state !== 'undefined' && state && state.agents && state.agents[userId]) {
        return state.agents[userId];
      }
      return DEFAULT_USERS[userId] || { id: userId, name: 'Agent', role: 'AGENT', label: 'Sales Agent', active: true };
    }

    // Date, Time & Currency Helpers
    function getDateOffsetStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      if (dateStr === today) return 'Today';
      if (dateStr === tomorrow) return 'Tomorrow';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function formatPHP(amount) {
      const num = Number(amount) || 0;
      return '₱' + Math.round(num).toLocaleString('en-PH');
    }

    function getDaysBetween(startDateStr, endDateStr = getDateOffsetStr(0)) {
      if (!startDateStr) return 0;
      const [sy, sm, sd] = startDateStr.split('-').map(Number);
      const [ey, em, ed] = endDateStr.split('-').map(Number);
      const start = Date.UTC(sy, sm - 1, sd);
      const end = Date.UTC(ey, em - 1, ed);
      return Math.max(0, Math.round((end - start) / 86400000));
    }

    // Default Philippine Dealership Visual Assets (Clean SVG Car Angle Previews)
    function buildCarPreviewSvg(title, subtitle, bodyHex, accentHex, angleLabel) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
          </linearGradient>
        </defs>
        <rect width="800" height="480" fill="url(#bg)"/>
        <circle cx="650" cy="110" r="170" fill="${accentHex}" opacity="0.14"/>
        <ellipse cx="400" cy="365" rx="255" ry="22" fill="#020617" opacity="0.7"/>
        <path d="M180 295 L220 220 Q245 190 300 185 L475 185 Q535 188 570 225 L625 260 Q645 275 640 305 L625 322 L175 322 Q162 310 180 295 Z" fill="${bodyHex}" stroke="${accentHex}" stroke-width="4"/>
        <path d="M248 225 L278 196 L462 196 L515 225 Z" fill="#0f172a" opacity="0.82"/>
        <circle cx="255" cy="322" r="42" fill="#090d16" stroke="#94a3b8" stroke-width="6"/>
        <circle cx="255" cy="322" r="18" fill="#cbd5e1"/>
        <circle cx="545" cy="322" r="42" fill="#090d16" stroke="#94a3b8" stroke-width="6"/>
        <circle cx="545" cy="322" r="18" fill="#cbd5e1"/>
        <rect x="44" y="38" width="190" height="32" rx="16" fill="${accentHex}" opacity="0.22"/>
        <text x="139" y="59" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">${angleLabel}</text>
        <text x="44" y="422" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="800">${title}</text>
        <text x="44" y="450" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15" font-weight="500">${subtitle}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function getDefaultCarPhotos(car) {
      const label = `${car.year} ${car.make} ${car.model}`;
      const sub = `${car.variant || ''} • ${car.transmission || 'Automatic'} • ${car.mileage || 'Verified Unit'}`;
      return [
        {
          id: 'p_front',
          caption: 'Front 3/4 Exterior',

    function emitLiveEvent(title, message, variant = 'emerald') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {

        indigo: 'bg-slate-950 border-indigo-500/50 text-white',

      };

      const dotColors = {
        emerald: 'bg-emerald-400',
        amber: 'bg-amber-400',
        indigo: 'bg-indigo-400',
        rose: 'bg-rose-400'
      };

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto rounded-2xl border p-3.5 shadow-2xl ${styles[variant] || styles.emerald}`;
      toast.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0 ${dotColors[variant] || dotColors.emerald}"></span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold tracking-tight flex items-center justify-between gap-2">
              <span>${title}</span>
              <span class="text-[10px] font-medium text-slate-400">WS • Just now</span>
            </div>
            <p class="text-xs text-slate-300 mt-0.5 leading-relaxed">${message}</p>
          </div>
        </div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(1rem)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 4200);
    }

    // =========================================================================
    // IMAGE COMPRESSION & MULTI-PHOTO GALLERY HELPERS
    // =========================================================================

    let pendingUploadPhotos = [];
    let activeGalleryState = null;

    function compressImageFile(file, maxWidth = 900, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoFilesSelected(fileList, previewContainerId) {
      const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;

      const remaining = Math.max(0, 6 - pendingUploadPhotos.length);
      const batch = files.slice(0, remaining);

      for (const file of batch) {
        try {
          const dataUrl = await compressImageFile(file);
          const cleanName = file.name.replace(/\.[^/.]+$/, '').slice(0, 26) || 'Vehicle Photo';
          pendingUploadPhotos.push({
            id: 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            caption: cleanName,
            url: dataUrl
          });
        } catch (err) {
          console.warn('Photo compression skipped:', err);
        }
      }

      renderPendingPhotoStrip(previewContainerId);
      if (files.length > remaining) {
        emitLiveEvent('Photo Limit Reached', 'Maximum of 6 photos per vehicle is allowed.', 'amber');
      }
    }

    function removePendingPhoto(photoId, previewContainerId) {
      pendingUploadPhotos = pendingUploadPhotos.filter(p => p.id !== photoId);
      renderPendingPhotoStrip(previewContainerId);
    }

    function renderPendingPhotoStrip(containerId) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (!pendingUploadPhotos.length) {
        el.innerHTML = `<div class="text-[11px] text-slate-400 italic">No custom photos uploaded yet (default preview angles will be attached automatically).</div>`;
        return;
      }
      el.innerHTML = `
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
          ${pendingUploadPhotos.map((p, idx) => `
            <div class="relative group rounded-xl overflow-hidden border border-slate-200 bg-slate-900 aspect-[16/10]">
              <img src="${p.url}" alt="${p.caption}" class="w-full h-full object-cover" />
              ${idx === 0 ? `<span class="absolute bottom-1 left-1 px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[9px] font-bold">COVER</span>` : ''}
              <button type="button" onclick="removePendingPhoto('${p.id}', '${containerId}')" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-slate-950/80 text-white hover:bg-rose-600 flex items-center justify-center text-xs font-bold">×</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function selectCardPhoto(carId, photoIndex) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const photos = (car.photos && car.photos.length) ? car.photos : getDefaultCarPhotos(car);
      const selected = photos[photoIndex];
      if (!selected) return;

      const mainImg = document.getElementById(`card-main-photo-${carId}`);
      const captionEl = document.getElementById(`card-photo-caption-${carId}`);
      if (mainImg) mainImg.src = selected.url;
      if (captionEl) captionEl.textContent = selected.caption || `Angle ${photoIndex + 1}`;

      photos.forEach((_, idx) => {
        const thumb = document.getElementById(`card-thumb-${carId}-${idx}`);
        if (thumb) {
          thumb.className = idx === photoIndex
            ? 'w-11 h-8 rounded-lg overflow-hidden border-2 border-emerald-400 shrink-0 transition'
            : 'w-11 h-8 rounded-lg overflow-hidden border border-white/25 opacity-70 hover:opacity-100 shrink-0 transition';
        }
      });
    }

    function openPhotoGallery(sourceType, itemId, startIndex = 0) {
      let title = '';
      let subtitle = '';
      let photos = [];
      let canEditPhotos = false;
      const user = getCurrentUser();

      if (sourceType === 'car') {
        const car = state.cars.find(c => c.id === itemId);
        if (!car) return;
        title = `${car.year} ${car.make} ${car.model} ${car.variant}`;
        subtitle = `${car.color} • ${car.mileage} • ${car.transmission}`;
        photos = (car.photos && car.photos.length) ? car.photos : getDefaultCarPhotos(car);
        canEditPhotos = user.role === 'OWNER' && car.status !== 'Sold';
      } else {
        const lead = state.leads.find(l => l.id === itemId);
        if (!lead) return;
        title = lead.makeModelYear;
        subtitle = `${lead.location} • ${lead.mileage}`;
        photos = (lead.photos && lead.photos.length) ? lead.photos : getDefaultCarPhotos({ year: '', make: lead.makeModelYear, model: '', variant: '', transmission: 'Verified', mileage: lead.mileage });
        canEditPhotos = user.role === 'OWNER' && lead.status !== 'ACQUIRED';
      }

      activeGalleryState = {
        sourceType,
        itemId,
        title,
        subtitle,
        photos,
        canEditPhotos,
        index: Math.max(0, Math.min(startIndex, photos.length - 1))
      };

      renderGalleryModal();
    }

    function stepGalleryPhoto(delta) {
      if (!activeGalleryState) return;
      const len = activeGalleryState.photos.length;
      activeGalleryState.index = (activeGalleryState.index + delta + len) % len;
      renderGalleryModal();
    }

    function setGalleryIndex(idx) {
      if (!activeGalleryState) return;
      activeGalleryState.index = idx;
      renderGalleryModal();

                  <img src="${p.url}" alt="${p.caption || ''}" class="w-full h-full object-cover" />
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function closeGalleryModal() {
      activeGalleryState = null;
      closeModal();
    }

    // =========================================================================
    // OWNER-ONLY VEHICLE IMAGE MANAGER (LOCKED ONCE APPROVED / SOLD)
    // =========================================================================

    function canModifyImages(sourceType, itemId) {
      const user = getCurrentUser();
      if (user.role !== 'OWNER') return false;
      if (sourceType === 'car') {
        const car = state.cars.find(c => c.id === itemId);
        return Boolean(car && car.status !== 'Sold');
      }
      if (sourceType === 'lead') {
        const lead = state.leads.find(l => l.id === itemId);
        return Boolean(lead && lead.status !== 'ACQUIRED');
      }
      return false;
    }

    function openEditPhotosModal(sourceType, itemId) {
      const user = getCurrentUser();
      if (user.role !== 'OWNER') {
        emitLiveEvent('Access Denied', 'Only the Dealership Owner / Admin can modify vehicle photos.', 'rose');
        return;
      }

      let label = '';
      let existingPhotos = [];

      if (sourceType === 'car') {
        const car = state.cars.find(c => c.id === itemId);
        if (!car) return;
        if (car.status === 'Sold') {
          emitLiveEvent('Photos Locked', 'This unit is already Sold/Approved. Images can no longer be modified.', 'rose');
          return;
        }
        label = `${car.year} ${car.make} ${car.model} ${car.variant}`;
        existingPhotos = (car.photos && car.photos.length) ? car.photos : getDefaultCarPhotos(car);
      } else {
        const lead = state.leads.find(l => l.id === itemId);
        if (!lead) return;
        if (lead.status === 'ACQUIRED') {
          emitLiveEvent('Photos Locked', 'This lead is already Acquired/Approved into inventory.', 'rose');
          return;
        }
        label = lead.makeModelYear;
        existingPhotos = (lead.photos && lead.photos.length) ? lead.photos : getDefaultCarPhotos({ year: '', make: lead.makeModelYear, model: '', variant: '', transmission: 'Verified', mileage: lead.mileage });
      }

      pendingUploadPhotos = existingPhotos.map(p => ({ ...p }));
      activeGalleryState = null;

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white rounded-3xl max-w-lg w-full border border-slate-200 shadow-2xl overflow-hidden my-auto">
            <div class="px-6 py-4 bg-slate-950 text-white flex items-center justify-between">
              <div class="flex items-center gap-2.5 min-w-0">
                <i data-lucide="image-plus" class="w-5 h-5 text-amber-400 shrink-0"></i>
                <div class="min-w-0">
                  <h3 class="text-base font-extrabold truncate">Change Vehicle Images</h3>
                  <p class="text-xs text-slate-400 truncate">${label}</p>
                </div>
              </div>
              <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <form onsubmit="submitEditPhotos(event, '${sourceType}', '${itemId}')" class="p-6 space-y-4">
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-950 flex items-start gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                <div><strong>Admin-Only Photo Control:</strong> The first photo serves as the primary cover image for agents. Once a vehicle is <strong>Sold / Approved</strong>, images are permanently locked.</div>
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-xs font-bold text-slate-700">Current Gallery (${pendingUploadPhotos.length}/6)</label>
                  <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                    <span>Add / Replace Photos</span>
                    <input type="file" accept="image/*" multiple onchange="handlePhotoFilesSelected(this.files, 'edit-car-photo-preview')" class="hidden" />
                  </label>
                </div>
                <div id="edit-car-photo-preview" class="p-3 rounded-2xl bg-slate-50 border border-dashed border-slate-300"></div>
              </div>

              <div class="pt-2 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 text-white text-xs font-extrabold transition">Save Updated Photos</button>
              </div>
            </form>
          </div>
        </div>
      `;
      renderPendingPhotoStrip('edit-car-photo-preview');
      lucide.createIcons();
    }

    function submitEditPhotos(e, sourceType, itemId) {
      e.preventDefault();
      if (!canModifyImages(sourceType, itemId)) {
        emitLiveEvent('Action Blocked', 'Only the Owner can edit photos before a vehicle is Sold/Approved.', 'rose');
        closeModal();
        return;
      }

      if (sourceType === 'car') {
        const car = state.cars.find(c => c.id === itemId);
        if (!car) return;
        car.photos = pendingUploadPhotos.length ? [...pendingUploadPhotos] : getDefaultCarPhotos(car);
        saveState();
        closeModal();
        renderApp();
        emitLiveEvent('Vehicle Photos Updated', `Owner updated ${car.photos.length} photo(s) for ${car.year} ${car.make} ${car.model}.`, 'emerald');
      } else {
        const lead = state.leads.find(l => l.id === itemId);
        if (!lead) return;
        lead.photos = pendingUploadPhotos.length
          ? [...pendingUploadPhotos]
          : getDefaultCarPhotos({ year: '', make: lead.makeModelYear, model: '', variant: '', transmission: 'Verified', mileage: lead.mileage });
        saveState();
        closeModal();
        renderApp();
        emitLiveEvent('Lead Photos Updated', `Owner updated ${lead.photos.length} photo(s) for ${lead.makeModelYear}.`, 'emerald');
      }
    }

    // =========================================================================
    // CHECKLIST RENDERING & VALIDATION HELPERS
    // =========================================================================

    function countChecklistPassed(checklistObj) {
      if (!checklistObj) return 0;
      return CHECKLIST_ITEMS.filter(item => Boolean(checklistObj[item.id])).length;
    }

    function renderChecklistFormSection(prefix, initialMap = {}) {
      const legalItems = CHECKLIST_ITEMS.filter(i => i.group.startsWith('Legal'));
      const conditionItems = CHECKLIST_ITEMS.filter(i => i.group.startsWith('Condition'));

      return `
        <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <div class="text-xs font-extrabold text-slate-900 flex items-center gap-1.5">
                <i data-lucide="clipboard-check" class="w-4 h-4 text-emerald-600"></i>
                <span>9-Point Used Car Screening Checklist</span>
              </div>
              <p class="text-[11px] text-slate-500">Verify LTO papers, flood/accident history &amp; mechanical condition.</p>
            </div>
            <button type="button" onclick="toggleAllChecklist('${prefix}', true)" class="px-2.5 py-1 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-900 text-[11px] font-bold transition shrink-0">
              Check All 9
            </button>
          </div>

          <div class="space-y-2">
            <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Legal &amp; LTO Verification</div>
            <div class="grid grid-cols-1 gap-1.5">
              ${legalItems.map(item => `
                <label class="flex items-center gap-2.5 p-2 rounded-xl bg-white border border-slate-200 hover:border-emerald-300 cursor-pointer text-xs">
                  <input type="checkbox" name="${prefix}_${item.id}" ${initialMap[item.id] ? 'checked' : ''} class="w-4 h-4 rounded accent-emerald-600 shrink-0" />
                  <span class="font-medium text-slate-800">${item.label}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <div class="space-y-2">
            <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Condition, History &amp; Completeness</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
              ${conditionItems.map(item => `
                <label class="flex items-center gap-2 p-2 rounded-xl bg-white border border-slate-200 hover:border-emerald-300 cursor-pointer text-xs">
                  <input type="checkbox" name="${prefix}_${item.id}" ${initialMap[item.id] ? 'checked' : ''} class="w-4 h-4 rounded accent-emerald-600 shrink-0" />
                  <span class="font-medium text-slate-800 leading-snug">${item.label}</span>
                </label>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function toggleAllChecklist(prefix, checkedVal) {
      CHECKLIST_ITEMS.forEach(item => {
        const el = document.querySelector(`input[name="${prefix}_${item.id}"]`);
        if (el) el.checked = checkedVal;
      });
    }

    function extractChecklistFromForm(formEl, prefix) {
      const result = {};
      CHECKLIST_ITEMS.forEach(item => {
        const input = formEl.elements[`${prefix}_${item.id}`];
        result[item.id] = Boolean(input && input.checked);
      });
      return result;
    }

    // =========================================================================
    // CORE BUSINESS LOGIC: PRIORITY LOCKS, CONFLICT PREVENTION & PAYOUTS
    // =========================================================================

    function hasActivePriorityLock(car, currentUser) {
      if (!car.sourcedByAgentId || !car.priorityLockUntil) return false;
      if (Date.now() > car.priorityLockUntil) return false;
      if (currentUser.role === 'OWNER') return false;
      return currentUser.id !== car.sourcedByAgentId;
    }

    function formatRemainingHours(untilMs) {
      const diffMs = Math.max(0, untilMs - Date.now());
      const hrs = Math.ceil(diffMs / (1000 * 60 * 60));
      return `${hrs}h left`;
    }

    function computeEstimatedPayout(car, sellingPrice = null) {
      const price = sellingPrice !== null ? Number(sellingPrice) : Number(car.basePrice);
      if (car.payoutModel === 'MARKUP') {
        if (sellingPrice !== null && sellingPrice > car.basePrice) {
          return sellingPrice - car.basePrice;
        }
        return 0;
      }
      // PERCENTAGE (1.0% - 3.0% of final selling price)
      return Math.round(price * (state.commissionRate / 100));
    }

    function getStatusBadgeHTML(status) {
      const map = {
        'Available': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Under Viewing': 'bg-sky-50 text-sky-700 border-sky-200',
        'Reserved': 'bg-amber-50 text-amber-800 border-amber-200',
        'Pending Sale': 'bg-purple-50 text-purple-700 border-purple-200',
        'Sold': 'bg-slate-200 text-slate-700 border-slate-300'
      };
      const dot = {
        'Available': 'bg-emerald-500',
        'Under Viewing': 'bg-sky-500',
        'Reserved': 'bg-amber-500',
        'Pending Sale': 'bg-purple-500',
        'Sold': 'bg-slate-500'
      };
      return `
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${map[status] || map['Available']}">
          <span class="w-1.5 h-1.5 rounded-full ${dot[status] || dot['Available']}"></span>
          ${status}
        </span>
      `;
    }

    function getPayoutModelBadgeHTML(car) {
      if (car.payoutModel === 'MARKUP') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">Base + Patong (100% Spread)</span>`;
      }
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200">${state.commissionRate.toFixed(1)}% Commission</span>`;
    }

    // =========================================================================
    // TAB 1: LIVE INVENTORY VIEW
    // =========================================================================

    function renderInventoryView(user) {
      const filters = ['ALL', 'Available', 'Under Viewing', 'Reserved', 'Sold'];
      const filteredCars = state.cars.filter(c => {
        if (state.inventoryFilter === 'ALL') return true;
        return c.status === state.inventoryFilter;
      });

      const availableCount = state.cars.filter(c => c.status === 'Available').length;
      const viewingCount = state.cars.filter(c => c.status === 'Under Viewing').length;
      const reservedCount = state.cars.filter(c => c.status === 'Reserved').length;

      return `
        <div class="space-y-6">
          <!-- Top Summary & Action Bar -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Live Dealership Lot</h1>
              <p class="text-sm text-slate-500 mt-0.5">
                Real-time stock visibility • <strong class="text-slate-700">${availableCount} Available</strong>,
                <strong class="text-sky-700">${viewingCount} Under Viewing</strong>,
                <strong class="text-amber-700">${reservedCount} Reserved</strong>
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">
              ${user.role === 'OWNER' ? `
                <button onclick="openModal('add-car-modal')" class="px-4 py-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 text-white text-xs font-bold shadow-sm transition flex items-center gap-2">
                  <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i>
                  <span>Add Car to Inventory</span>
                </button>
              ` : `
                <button onclick="switchTab('sourcing')" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm transition flex items-center gap-2">
                  <i data-lucide="radar" class="w-4 h-4"></i>
                  <span>Submit Off-Market Car (+48h Lock)</span>
                </button>
              `}
            </div>
          </div>

          <!-- Filter Pills -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
            ${filters.map(f => {
              const active = state.inventoryFilter === f;
              return `
                <button onclick="setInventoryFilter('${f}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border ${
                  active
                    ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }">
                  ${f === 'ALL' ? `All Units (${state.cars.length})` : f}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Vehicle Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${filteredCars.map(car => {
              const scout = car.sourcedByAgentId ? getUserRecord(car.sourcedByAgentId) : null;
              const priorityLockedForMe = hasActivePriorityLock(car, user);
              const myPriorityLock = car.sourcedByAgentId === user.id && car.priorityLockUntil && Date.now() < car.priorityLockUntil;
              const estCommission = computeEstimatedPayout(car);
              const upcomingBookings = state.bookings.filter(b => b.carId === car.id && b.status === 'CONFIRMED');
              const passedCount = countChecklistPassed(car.checklist);
              const photos = (car.photos && car.photos.length) ? car.photos : getDefaultCarPhotos(car);
              const coverPhoto = photos[0];
              const lotDays = car.status === 'Sold' && car.soldAt
                ? getDaysBetween(car.listedAt, car.soldAt)
                : getDaysBetween(car.listedAt);

              return `
                <div class="bg-white rounded-2xl border ${priorityLockedForMe ? 'border-amber-300 ring-2 ring-amber-500/10' : 'border-slate-200'} shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
                  <div>
                    <!-- Vehicle Photo Stage & Thumbnail Strip -->
                    <div class="relative bg-slate-900 aspect-[16/10] overflow-hidden group">
                      <img
                        id="card-main-photo-${car.id}"
                        src="${coverPhoto.url}"
                        alt="${car.year} ${car.make} ${car.model}"
                        onclick="openPhotoGallery('car', '${car.id}', 0)"
                        class="w-full h-full object-cover cursor-pointer group-hover:scale-[1.02] transition duration-300"
                      />
                      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-slate-950/35 pointer-events-none"></div>

                      <!-- Top Overlays: Status + Lot Age + Photo Count -->
                      <div class="absolute top-3 inset-x-3 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          ${getStatusBadgeHTML(car.status)}
                          <span class="px-2 py-0.5 rounded-full bg-slate-950/80 text-slate-200 border border-white/15 text-[10px] font-bold">
                            ${car.status === 'Sold' ? `Sold in ${lotDays}d` : `${lotDays}d on lot`}
                          </span>
                        </div>
                        <div class="flex items-center gap-1.5">
                          ${canModifyImages('car', car.id) ? `
                            <button type="button" onclick="openEditPhotosModal('car', '${car.id}')" class="px-2.5 py-1 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-[11px] font-extrabold shadow flex items-center gap-1 transition" title="Owner-Only: Change Vehicle Images">
                              <i data-lucide="image-plus" class="w-3 h-3"></i>
                              <span>Change Images</span>
                            </button>
                          ` : ''}
                          <button type="button" onclick="openPhotoGallery('car', '${car.id}', 0)" class="px-2.5 py-1 rounded-full bg-slate-950/80 hover:bg-slate-900 text-white border border-white/15 text-[11px] font-bold flex items-center gap-1.5 transition">
                            <i data-lucide="camera" class="w-3.5 h-3.5 text-emerald-400"></i>
                            <span>${photos.length}</span>
                          </button>
                        </div>
                      </div>

                      <!-- Bottom Photo Caption & Thumbnail Switcher -->
                      <div class="absolute bottom-2.5 inset-x-3 flex items-end justify-between gap-2">
                        <span id="card-photo-caption-${car.id}" class="text-[11px] font-semibold text-white/95 truncate bg-slate-950/60 px-2 py-0.5 rounded-md">
                          ${coverPhoto.caption || 'Front 3/4 View'}
                        </span>
                        ${photos.length > 1 ? `
                          <div class="flex items-center gap-1 shrink-0">
                            ${photos.slice(0, 4).map((p, idx) => `
                              <button
                                type="button"
                                id="card-thumb-${car.id}-${idx}"
                                onclick="selectCardPhoto('${car.id}', ${idx})"
                                title="${p.caption || `Angle ${idx + 1}`}"
                                class="${idx === 0 ? 'w-11 h-8 rounded-lg overflow-hidden border-2 border-emerald-400 shrink-0 transition' : 'w-11 h-8 rounded-lg overflow-hidden border border-white/25 opacity-70 hover:opacity-100 shrink-0 transition'}"
                              >
                                <img src="${p.url}" alt="" class="w-full h-full object-cover" />
                              </button>
                            `).join('')}
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <div class="p-5 space-y-4">
                      <!-- Title & Specs -->
                      <div>
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${car.category}</span>
                          <span class="text-[11px] font-semibold text-slate-500">${car.location}</span>
                        </div>
                        <h3 class="text-lg font-extrabold text-slate-900 leading-snug">
                          ${car.year} ${car.make} ${car.model} <span class="font-semibold text-slate-600">${car.variant}</span>
                        </h3>
                        <p class="text-xs text-slate-500 mt-1">
                          ${car.color} • ${car.mileage} • ${car.transmission} • Coding: ${car.plateEnding}
                        </p>
                      </div>

                      <!-- 48-Hour Agent Sourcing Priority Lock Banner -->
                      ${scout && car.priorityLockUntil && Date.now() < car.priorityLockUntil ? `
                        <div class="p-3 rounded-xl ${myPriorityLock ? 'bg-indigo-50 border border-indigo-200 text-indigo-900' : 'bg-amber-50 border border-amber-200 text-amber-900'} text-xs flex items-start gap-2.5">
                          <i data-lucide="${myPriorityLock ? 'shield-check' : 'lock'}" class="w-4 h-4 mt-0.5 shrink-0 ${myPriorityLock ? 'text-indigo-600' : 'text-amber-600'}"></i>
                          <div>
                            <div class="font-bold">
                              ${myPriorityLock ? 'Your 48h Exclusive Booking Window' : `48h Exclusive Lock: ${scout.name}`}

                            <div class="text-[11px] opacity-85 mt-0.5">
                              Sourced lead priority active (${formatRemainingHours(car.priorityLockUntil)}).
                            </div>
                          </div>
                        </div>
                      ` : ''}

                      <!-- Pricing & Payout Structure Box -->
                      <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2.5">
                        <div class="flex items-baseline justify-between">
                          <span class="text-xs font-medium text-slate-500">Internal Base Price</span>
                          <span class="text-base font-extrabold text-slate-900">${formatPHP(car.basePrice)}</span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                          <span class="text-slate-500">Payout Structure</span>
                          ${getPayoutModelBadgeHTML(car)}
                        </div>
                        <div class="pt-2 border-t border-slate-200/80 flex items-center justify-between text-xs">
                          <span class="font-semibold text-slate-600">
                            ${car.payoutModel === 'MARKUP' ? 'Target Retail (Patong Ref.)' : `Est. Payout (${state.commissionRate.toFixed(1)}%)`}
                          </span>
                          <span class="font-extrabold text-emerald-700">
                            ${car.payoutModel === 'MARKUP'
                              ? `${formatPHP(car.suggestedRetail)} (+${formatPHP(car.suggestedRetail - car.basePrice)})`

                      <!-- 9-Point Inspection & Active Viewings Strip -->
                      <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600">

                          <i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i>
                          <span>${passedCount}/9 Screened</span>

                        <div class="flex items-center gap-1.5 text-slate-500">

                        <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-between gap-2 text-xs">
                          <div>
                            <div class="font-bold text-amber-950">Reserved by ${getUserRecord(car.reservation.agentId)?.name || 'Agent'}</div>
                            <div class="text-[11px] text-amber-800">Deposit: ${formatPHP(car.reservation.depositAmount)} • ${car.reservation.reservedAt}</div>
                          </div>
                          ${user.role === 'OWNER' ? `
                            <button onclick="releaseReservation('${car.id}')" class="px-2.5 py-1.5 rounded-lg bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 font-bold text-[11px] shrink-0">
                              Release

                    </div>
                  </div>

    function setAnalyticsRange(range) {

    function exportLedgerCSV() {
      const headers = ['Sale ID', 'Vehicle', 'Agent', 'Payout Model', 'Base Price (PHP)', 'Reported Sale Price (PHP)', 'Rate (%)', 'Agent Payout (PHP)', 'Status', 'Submitted Date', 'Verified Date'];
      const rows = state.sales.map(s => {
        const agentName = getUserRecord(s.agentId)?.name || s.agentId;
        const reported = s.payoutModel === 'MARKUP' ? 'Private (Patong)' : (s.reportedSalePrice || s.basePriceSnapshot);
        return [
          s.id,
          `"${s.carLabel}"`,
          `"${agentName}"`,
          s.payoutModel,
          s.basePriceSnapshot,
          reported,
          s.commissionRateSnapshot || '0',
          s.calculatedPayout,
          s.status,
          s.submittedAt,
          s.verifiedAt || 'Pending'
        ].join(',');
      });

      const csvContent = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `AutoBook_Sales_Ledger_${getDateOffsetStr(0)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      emitLiveEvent('CSV Ledger Exported', `Downloaded ${state.sales.length} sales record(s) for bookkeeping.`, 'emerald');
    }

    function renderSalesView(user) {
      const isOwner = user.role === 'OWNER';
      const rangeDaysMap = { '7D': 7, '30D': 30, 'ALL': null };

      const scopedSales = state.sales.filter(s => {
        if (!isOwner && s.agentId !== user.id) return false;
        if (maxAgeDays !== null && s.submittedAt) {
          return getDaysBetween(s.submittedAt) <= maxAgeDays;
        }
        return true;
      });

      const pendingSales = scopedSales.filter(s => s.status === 'PENDING');
      const verifiedSales = scopedSales.filter(s => s.status === 'APPROVED' || s.status === 'PAID');

      const totalFloorVolume = verifiedSales.reduce((acc, s) => acc + Number(s.basePriceSnapshot || 0), 0);

      // Owner Analytics & Turnover BI Metrics

          pendingCount: pending.length,

          sourcedCount,

      const checklist = lead.checklist || {};
      const passed = countChecklistPassed(checklist);
      const modalRoot = document.getElementById('modal-root');

                  return `

                  `;

              <div class="pt-1 flex items-center justify-between gap-2">

                  <button type="button" onclick="setLeadStatus('${lead.id}', 'INSPECTING'); closeModal();" class="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold">

              </div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();

    function toggleLeadChecklistItem(leadId, itemId) {
      if (getCurrentUser().role !== 'OWNER') return;
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead || lead.status === 'ACQUIRED') return;
      if (!lead.checklist) lead.checklist = {};
      lead.checklist[itemId] = !lead.checklist[itemId];
      if (lead.status === 'PENDING_INSPECTION') {
        lead.status = 'INSPECTING';
      }
      saveState();
      renderApp();
      openLeadChecklistModal(leadId);
    }
    function setLeadStatus(leadId, nextStatus) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead || lead.status === 'ACQUIRED') return;
      lead.status = nextStatus;
      saveState();
      renderApp();
      const labels = {
        'PENDING_INSPECTION': { title: 'Moved to Pending', variant: 'amber', desc: 'moved back to Pending Inspection.' },
        'INSPECTING': { title: 'Inspection Active', variant: 'indigo', desc: 'is now under physical & LTO inspection.' },
        'REJECTED': { title: 'Lead Rejected / Passed', variant: 'rose', desc: 'was marked Rejected / Passed.' }
      };
      const meta = labels[nextStatus] || labels['INSPECTING'];
      emitLiveEvent(meta.title, `${lead.makeModelYear} ${meta.desc}`, meta.variant);
    }

    function markLeadInspecting(leadId) {
      setLeadStatus(leadId, 'INSPECTING');
    }

    function updateSaleModalPreview() {
      const carSelect = document.getElementById('sale-car-select');
      if (!carSelect) return;
      const car = state.cars.find(c => c.id === carSelect.value);
      if (!car) return;

      const selectedModel = document.querySelector('input[name="payoutModel"]:checked')?.value || 'PERCENTAGE';
      const priceWrapper = document.getElementById('reported-price-wrapper');
      const priceInput = document.getElementById('reported-sale-price');
      const baseLabel = document.getElementById('sale-base-price-label');
      const pctBadge = document.getElementById('sale-pct-preview');
      const finalPreview = document.getElementById('sale-final-payout-preview');

      baseLabel.textContent = formatPHP(car.basePrice);

      const sellingPrice = Number(priceInput?.value || car.basePrice);
      const pctPayout = Math.round(sellingPrice * (state.commissionRate / 100));

      pctBadge.textContent = formatPHP(pctPayout);

      if (selectedModel === 'MARKUP') {
        priceWrapper.classList.add('hidden');
        finalPreview.textContent = '₱0 (Agent keeps 100% Patong)';
      } else {
        priceWrapper.classList.remove('hidden');
        finalPreview.textContent = formatPHP(pctPayout);
      }
    }

      const file = Array.from(fileList || []).find(f => f.type.startsWith('image/'));

      try {

        const hiddenInput = document.getElementById('brand-logo-data-input');
        const previewBox = document.getElementById('brand-modal-logo-preview');
        if (hiddenInput) hiddenInput.value = compressed;
        if (previewBox) previewBox.innerHTML = `<img src="${compressed}" alt="Logo" class="w-full h-full object-cover" />`;
      } catch (err) {
        console.warn('Logo upload skipped:', err);
      }

    function submitQuickBooking(e, carId, dateStr, slot) {
      e.preventDefault();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      // Atomic Concurrency Guard
      const conflict = state.bookings.find(
        b => b.carId === carId && b.date === dateStr && b.timeSlot === slot && b.status === 'CONFIRMED'
      );
      if (conflict) {
        emitLiveEvent('Slot Conflict Prevented', `That ${slot} slot was just locked by another agent.`, 'rose');
        closeModal();
        renderApp();
        return;
      }

      const buyerAlias = e.target.buyerAlias.value.trim();
      state.bookings.push({
        id: 'bk_' + Date.now(),
        carId,
        agentId: user.id,
        date: dateStr,
        timeSlot: slot,
        buyerAlias,
        status: 'CONFIRMED',
        createdAt: 'Just now'
      });

      if (car.status === 'Available') {
        car.status = 'Under Viewing';
      }

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Viewing Slot Locked',
        `${user.name} locked ${car.year} ${car.make} ${car.model} for ${formatDisplayDate(dateStr)} at ${slot}.`,
        'emerald'
      );
    }

    function cancelBooking(bookingId) {
      const idx = state.bookings.findIndex(b => b.id === bookingId);
      if (idx === -1) return;
      const bk = state.bookings[idx];
      const car = state.cars.find(c => c.id === bk.carId);
      state.bookings.splice(idx, 1);

      if (car && car.status === 'Under Viewing') {
        const remaining = state.bookings.filter(b => b.carId === car.id && b.status === 'CONFIRMED');
        if (remaining.length === 0) {
          car.status = 'Available';
        }
      }

      saveState();
      renderApp();
      emitLiveEvent('Viewing Slot Released', `${bk.timeSlot} on ${formatDisplayDate(bk.date)} is open again.`, 'amber');
    }

      e.preventDefault();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      const depositAmount = Number(e.target.depositAmount.value) || 20000;

      car.status = 'Reserved';
      car.reservation = {

        reservedAt: 'Just now'

      saveState();
      closeModal();

      emitLiveEvent(

        `${user.name} reserved ${car.year} ${car.make} ${car.model} (${formatPHP(depositAmount)} deposit).`,
        'amber'
      );
    }

      const car = state.cars.find(c => c.id === carId);

      car.status = 'Available';

    }

    function submitClosedSale(e) {
      e.preventDefault();
      const user = getCurrentUser();
      const form = e.target;
      const car = state.cars.find(c => c.id === form.carId.value);
      if (!car) return;

      const payoutModel = form.payoutModel.value;
      const reportedSalePrice = payoutModel === 'MARKUP' ? null : Number(form.reportedSalePrice.value || car.basePrice);
      const calculatedPayout = payoutModel === 'MARKUP'
        ? 0
        : computeEstimatedPayout({ ...car, payoutModel }, reportedSalePrice);

      state.sales.unshift({
        id: 'sale_' + Date.now(),
        carId: car.id,
        carLabel: `${car.year} ${car.make} ${car.model} ${car.variant}`,
        agentId: user.id,
        payoutModel,
        basePriceSnapshot: car.basePrice,
        reportedSalePrice,
        commissionRateSnapshot: payoutModel === 'PERCENTAGE' ? state.commissionRate : null,
        calculatedPayout,
        status: 'PENDING',
        submittedAt: getDateOffsetStr(0),
        verifiedAt: null
      });

      saveState();
      closeModal();
      state.activeTab = 'sales';
      renderApp();
      emitLiveEvent(
        'Sale Logged for Verification',
        `${user.name} submitted closed sale on ${car.year} ${car.make} ${car.model}.`,
        'indigo'
      );
    }

    function verifySale(saleId) {
      const sale = state.sales.find(s => s.id === saleId);
      if (!sale) return;
      sale.status = 'APPROVED';
      sale.verifiedAt = getDateOffsetStr(0);

      const car = state.cars.find(c => c.id === sale.carId);
      if (car) {
        car.status = 'Sold';
        car.soldAt = getDateOffsetStr(0);
        car.location = 'Released to Buyer';
      }

      saveState();
      renderApp();
      emitLiveEvent(
        'Sale Approved & Unit Locked',
        `${sale.carLabel} marked SOLD across all agent dashboards.`,
        'emerald'
      );
    }

      const checklist = extractChecklistFromForm(f, 'addcar');
      const newCarObj = {
        id: 'car_' + Date.now(),
        make: f.make.value.trim(),
        model: f.model.value.trim(),
        variant: f.variant.value.trim(),
        year: Number(f.year.value),
        color: 'Pearl White',
        mileage: '18,500 km',
        transmission: 'Automatic',
        fuel: 'Diesel',
        category: f.category.value,
        basePrice: Number(f.basePrice.value),
        suggestedRetail: Number(f.suggestedRetail.value),
        payoutModel: f.payoutModel.value,
        status: 'Available',
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        plateEnding: '5 (Wednesday Coding)',
        location: 'Main Lot - Quezon Ave',
        photos: [],
        checklist,
        sourcedByAgentId: null,
        priorityLockUntil: null,
        reservation: null
      };
      newCarObj.photos = pendingUploadPhotos.length ? [...pendingUploadPhotos] : getDefaultCarPhotos(newCarObj);
      state.cars.unshift(newCarObj);

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('New Car Published', `${f.year.value} ${f.make.value} ${f.model.value} is now live for all agents.`, 'emerald');
    }

    function submitNewLead(e) {
      e.preventDefault();
      const user = getCurrentUser();
      const f = e.target;
      const checklist = extractChecklistFromForm(f, 'lead');
      const makeModelYear = f.makeModelYear.value.trim();

      state.leads.unshift({
        id: 'lead_' + Date.now(),
        agentId: user.id,
        makeModelYear,
        category: f.category.value,
        askingPrice: Number(f.askingPrice.value),
        mileage: 'Verified upon inspection',
        location: 'Metro Manila',
        sellerName: f.sellerName.value.trim(),
        sellerPhone: f.sellerPhone.value.trim(),
        notes: f.notes.value.trim(),
        photos: pendingUploadPhotos.length
          ? [...pendingUploadPhotos]
          : getDefaultCarPhotos({ year: '', make: makeModelYear, model: '', variant: '', transmission: 'Verified', mileage: 'Direct Owner' }),
        checklist,
        status: 'PENDING_INSPECTION',
        submittedAt: 'Just now',
        convertedCarId: null
      });

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Off-Market Lead Submitted', `${user.name} submitted ${f.makeModelYear.value} for dealership inspection.`, 'indigo');
    }

    function markLeadInspecting(leadId) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      lead.status = 'INSPECTING';
      saveState();
      renderApp();
      emitLiveEvent('Inspection Started', `Dealership team is inspecting ${lead.makeModelYear}.`, 'amber');
    }

    function submitAcquireLead(e, leadId) {
      e.preventDefault();
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;

      const basePrice = Number(e.target.basePrice.value);
      const suggestedRetail = Number(e.target.suggestedRetail.value);
      const newCarId = 'car_' + Date.now();
      const parts = lead.makeModelYear.split(' ');
      const year = Number(parts[0]) || 2021;
      const make = parts[1] || 'Unit';
      const model = parts.slice(2).join(' ') || lead.makeModelYear;

      const acquiredCar = {
        id: newCarId,
        make,
        model,
        variant: '(Sourced)',
        year,
        color: 'Verified Unit',
        mileage: lead.mileage,
        transmission: 'Automatic',
        fuel: 'Diesel',
        category: lead.category,
        basePrice,
        suggestedRetail,
        payoutModel: 'MARKUP',
        status: 'Available',
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        plateEnding: '8 (Thursday Coding)',
        location: 'Main Lot - Newly Acquired',
        photos: (lead.photos && lead.photos.length) ? [...lead.photos] : [],
        checklist: lead.checklist || {
          orcr_docs: true,
          no_lto_alarm: true,
          open_deed_ids: true,
          not_flooded: true,
          no_major_accident: true,
          odo_not_tampered: true,
          cold_ac_engine: true,
          fresh_paint_interior: true,
          spare_jack_keys: true
        },
        sourcedByAgentId: lead.agentId,
        priorityLockUntil: Date.now() + 48 * 60 * 60 * 1000, // 48-hour exclusive agent lock
        reservation: null
      };
      if (!acquiredCar.photos.length) {
        acquiredCar.photos = getDefaultCarPhotos(acquiredCar);
      }
      state.cars.unshift(acquiredCar);

      lead.status = 'ACQUIRED';
      lead.convertedCarId = newCarId;

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Lead Acquired + 48h Lock Active',
        `${lead.makeModelYear} published! ${getUserRecord(lead.agentId)?.name || 'Sourcing Agent'} holds a 48h exclusive booking window.`,
        'emerald'
      );
    }

    // =========================================================================
    // AGENT MANAGEMENT & SINGLE-USE INVITE ACTIONS
    // =========================================================================

    function createAgentInvite(e) {
      e.preventDefault();
      if (getCurrentUser().role !== 'OWNER') return;
      const note = e.target.inviteNote.value.trim();
      const token = 'AB-' + Math.random().toString(36).substring(2, 8).toUpperCase();

      state.invites.unshift({
        token,
        note,
        status: 'ACTIVE',
        createdAt: 'Just now',
        usedByName: null
      });

      saveState();
      openModal('agents-modal');
      emitLiveEvent('Invite Token Created', `Single-use invite ${token} generated for ${note}.`, 'indigo');
    }

    function copyInviteLink(url) {
      const tempInput = document.createElement('input');
      tempInput.value = url;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      emitLiveEvent('Invite Link Copied', 'Single-use partner invite URL copied to clipboard.', 'emerald');
    }

    function submitAcceptInvite(e, token) {
      e.preventDefault();
      const invite = state.invites.find(i => i.token === token && i.status === 'ACTIVE');
      if (!invite) return;

      const agentName = e.target.agentName.value.trim();
      const agentPhone = e.target.agentPhone.value.trim();
      const newAgentId = 'agent_' + Date.now();

      state.agents[newAgentId] = {
        id: newAgentId,
        name: agentName,
        role: 'AGENT',
        label: 'Sales Agent',
        phone: agentPhone,
        active: true,
        joinedAt: 'Just now'
      };

      invite.status = 'USED';
      invite.usedByName = agentName;
      state.currentUserId = newAgentId;

      // Clear ?invite= query param cleanly if present
      if (window.location.search.includes('invite=')) {
        window.history.replaceState({}, '', window.location.pathname);
      }

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Welcome to AutoBook!', `${agentName} joined Metro Manila Auto Hub via single-use invite.`, 'emerald');
    }

    function toggleAgentActiveStatus(agentId) {
      if (getCurrentUser().role !== 'OWNER') return;
      const agent = state.agents[agentId];
      if (!agent || agent.role === 'OWNER') return;

      const nextActive = agent.active === false;
      agent.active = nextActive;

      if (!nextActive) {
        // Immediately release future confirmed viewing slots while preserving past sales
        const beforeCount = state.bookings.length;
        state.bookings = state.bookings.filter(b => !(b.agentId === agentId && b.status === 'CONFIRMED'));
        const releasedCount = beforeCount - state.bookings.length;

        // Reset any cars that were only Under Viewing due to those released bookings
        state.cars.forEach(car => {
          if (car.status === 'Under Viewing') {
            const hasRemaining = state.bookings.some(b => b.carId === car.id && b.status === 'CONFIRMED');
            if (!hasRemaining) car.status = 'Available';
          }
        });

        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent(
          'Agent Deactivated',
          `${agent.name} deactivated. ${releasedCount} future viewing slot(s) released automatically.`,
          'rose'
        );
      } else {
        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent('Agent Reactivated', `${agent.name} can now book viewings and log sales again.`, 'emerald');
      }
    }

    // =========================================================================
    // MAIN RENDER LOOP & NAVIGATION SYNC
    // =========================================================================

    function renderRoleSwitcher() {
      const switcher = document.getElementById('role-switcher');
      const manageBtn = document.getElementById('manage-agents-btn');
      const brandBtn = document.getElementById('brand-settings-btn');
      const currentUser = getCurrentUser();

      [manageBtn, brandBtn].forEach(btn => {
        if (!btn) return;
        if (currentUser.role === 'OWNER') {
          btn.classList.remove('hidden');
          btn.classList.add('inline-flex');
        } else {
          btn.classList.add('hidden');
          btn.classList.remove('inline-flex');
        }
      });

      if (!switcher) return;
      const activeMembers = Object.values(state.agents).filter(u => u.role === 'OWNER' || u.active !== false);
      switcher.innerHTML = activeMembers.map(u => `
        <option value="${u.id}" ${u.id === state.currentUserId ? 'selected' : ''}>
          ${u.role === 'OWNER' ? 'Owner' : 'Agent'}: ${u.name} (${u.label})
        </option>
      `).join('');
    }

    function renderApp() {
      applyDealershipBranding();
      renderRoleSwitcher();
      const user = getCurrentUser();
      const root = document.getElementById('app-root');

      // Update Top & Mobile Tab States
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const isTab = btn.dataset.tab === state.activeTab;
        btn.className = `nav-tab-btn px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 ${
          isTab ? 'bg-emerald-500 text-slate-950 font-bold shadow-sm' : 'text-slate-300 hover:text-white hover:bg-slate-800'
        }`;
      });

      document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
        const isTab = btn.dataset.tab === state.activeTab;
        btn.className = `mobile-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition ${
          isTab ? 'text-emerald-400 bg-slate-900' : 'text-slate-400 hover:text-white'
        }`;
      });

      // Update Notification Badges
      const pendingCount = state.sales.filter(s => s.status === 'PENDING').length;
      const leadsCount = state.leads.filter(l => l.status !== 'ACQUIRED').length;

      ['nav-pending-badge', 'mobile-pending-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (pendingCount > 0) {
          el.textContent = pendingCount;
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });

      ['nav-leads-badge', 'mobile-leads-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (leadsCount > 0) {
          el.textContent = leadsCount;
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });

      // Render Active View
      if (state.activeTab === 'inventory') {
        root.innerHTML = renderInventoryView(user);
      } else if (state.activeTab === 'calendar') {
        root.innerHTML = renderCalendarView(user);
      } else if (state.activeTab === 'sales') {
        root.innerHTML = renderSalesView(user);
      } else if (state.activeTab === 'sourcing') {
        root.innerHTML = renderSourcingView(user);
      }

      lucide.createIcons();
    }

    // Event Listeners Setup
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      const roleSwitcher = document.getElementById('role-switcher');
      if (roleSwitcher) {
        roleSwitcher.addEventListener('change', (e) => {
          state.currentUserId = e.target.value;
          saveState();
          renderApp();
          const u = getCurrentUser();
          emitLiveEvent('Switched Active Session', `Viewing as ${u.name} (${u.label}).`, 'indigo');
        });
      }

      const resetBtn = document.getElementById('reset-demo-btn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          localStorage.removeItem(STORAGE_KEY);
          state = createDefaultState();
          saveState();
          renderApp();
          emitLiveEvent('Demo Data Reset', 'Restored clean Metro Manila Auto Hub inventory & bookings.', 'amber');
        });
      }

      renderApp();

      // Auto-open invite onboarding modal if ?invite=TOKEN is present in URL
      const urlParams = new URLSearchParams(window.location.search);
      const inviteToken = urlParams.get('invite');
      if (inviteToken) {
        openAcceptInviteModal(inviteToken);
      }
    });
  </script>
</body>
</html>
