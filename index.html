    :root {
      --brand-font: 'Inter';

  <script>
    // =========================================================================
    // AUTOBOOK v2.0 — STATE, SEED DATA & MULTI-TENANT DEALERSHIP STORE
    // =========================================================================

    const STORAGE_KEY = 'autobook_v2_ph_state_v11';

    // Curated Dealership White-Label Theme Presets & Fonts
    const BRAND_THEMES = {
      emerald: {
        name: 'Emerald Executive (Default)',
        c50: '#ecfdf5', c100: '#d1fae5', c200: '#a7f3d0', c300: '#6ee7b7',
        c400: '#34d399', c500: '#10b981', c600: '#059669', c700: '#047857',
        onPrimary: '#ffffff'
      },
      cobalt: {
        name: 'Midnight Cobalt Blue',
        c50: '#eff6ff', c100: '#dbeafe', c200: '#bfdbfe', c300: '#93c5fd',
        c400: '#60a5fa', c500: '#3b82f6', c600: '#2563eb', c700: '#1d4ed8',
        onPrimary: '#ffffff'
      },
      crimson: {
        name: 'Crimson Performance Red',
        c50: '#fff1f2', c100: '#ffe4e6', c200: '#fecdd3', c300: '#fda4af',
        c400: '#fb7185', c500: '#f43f5e', c600: '#e11d48', c700: '#be123c',
        onPrimary: '#ffffff'
      },
      amber: {
        name: 'Luxury Gold & Amber',
        c50: '#fffbeb', c100: '#fef3c7', c200: '#fde68a', c300: '#fcd34d',
        c400: '#fbbf24', c500: '#f59e0b', c600: '#d97706', c700: '#b45309',
        onPrimary: '#ffffff'
      },
      violet: {
        name: 'Royal Violet Prestige',
        c50: '#f5f3ff', c100: '#ede9fe', c200: '#ddd6fe', c300: '#c4b5fd',
        c400: '#a78bfa', c500: '#8b5cf6', c600: '#7c3aed', c700: '#6d28d9',
        onPrimary: '#ffffff'
      }
    };

    const BRAND_FONTS = {
      inter: { label: 'Inter (Clean Modern SaaS)', family: 'Inter' },
      jakarta: { label: 'Plus Jakarta Sans (Geometric)', family: 'Plus Jakarta Sans' },
      condensed: { label: 'Roboto Condensed (Automotive)', family: 'Roboto Condensed' }
    };

    function getDefaultBranding() {
      return {
        dealershipName: 'Magief Cars',
        tagline: 'Trece Martires Cavite',
        logoUrl: '',
        themeKey: 'emerald',
        customHex: '#0f766e',
        fontKey: 'inter'
      };
    }

    function normalizeHexColor(hex) {
      if (!hex || typeof hex !== 'string') return '#0f766e';
      let clean = hex.trim();
      if (!clean.startsWith('#')) clean = '#' + clean;
      if (/^#[0-9a-fA-F]{3}$/.test(clean)) {
        clean = '#' + clean[1] + clean[1] + clean[2] + clean[2] + clean[3] + clean[3];
      }
      return /^#[0-9a-fA-F]{6}$/.test(clean) ? clean.toLowerCase() : '#0f766e';
    }

    function hexToRgb(hex) {
      const h = normalizeHexColor(hex).slice(1);
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16)
      };
    }

    function mixRgb(rgb1, rgb2, weight) {
      const w = Math.max(0, Math.min(1, weight));
      const r = Math.round(rgb1.r * (1 - w) + rgb2.r * w);
      const g = Math.round(rgb1.g * (1 - w) + rgb2.g * w);
      const b = Math.round(rgb1.b * (1 - w) + rgb2.b * w);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function buildCustomThemeFromHex(hex) {
      const base = hexToRgb(hex);
      const white = { r: 255, g: 255, b: 255 };
      const black = { r: 15, g: 23, b: 42 };
      const luminance = (0.299 * base.r + 0.587 * base.g + 0.114 * base.b) / 255;
      return {
        name: 'Custom Brand Color',
        c50: mixRgb(base, white, 0.92),
        c100: mixRgb(base, white, 0.82),
        c200: mixRgb(base, white, 0.65),
        c300: mixRgb(base, white, 0.45),
        c400: mixRgb(base, white, 0.22),
        c500: mixRgb(base, white, 0.08),
        c600: normalizeHexColor(hex),
        c700: mixRgb(base, black, 0.24),
        onPrimary: luminance > 0.62 ? '#0f172a' : '#ffffff'
      };
    }

    function applyDealershipBranding() {
      const b = (typeof state !== 'undefined' && state && state.branding) ? state.branding : getDefaultBranding();
      const theme = b.themeKey === 'custom'
        ? buildCustomThemeFromHex(b.customHex || '#0f766e')
        : (BRAND_THEMES[b.themeKey] || BRAND_THEMES.emerald);
      const font = BRAND_FONTS[b.fontKey] || BRAND_FONTS.inter;

      const rootEl = document.documentElement;
      rootEl.style.setProperty('--brand-font', `'${font.family}'`);
      rootEl.style.setProperty('--brand-50', theme.c50);
      rootEl.style.setProperty('--brand-100', theme.c100);
      rootEl.style.setProperty('--brand-200', theme.c200);
      rootEl.style.setProperty('--brand-300', theme.c300);
      rootEl.style.setProperty('--brand-400', theme.c400);
      rootEl.style.setProperty('--brand-500', theme.c500);
      rootEl.style.setProperty('--brand-600', theme.c600);
      rootEl.style.setProperty('--brand-700', theme.c700);
      rootEl.style.setProperty('--brand-on-primary', theme.onPrimary || '#ffffff');

      const nameEl = document.getElementById('header-dealership-name');
      const tagEl = document.getElementById('header-dealership-tagline');
      const logoBox = document.getElementById('header-brand-logo-box');

      if (nameEl) nameEl.textContent = b.dealershipName || 'Magief Cars';
      if (tagEl) tagEl.textContent = b.tagline || 'Trece Martires Cavite';
      if (logoBox) {
        if (b.logoUrl) {
          logoBox.innerHTML = `<img src="${b.logoUrl}" alt="${escapeHtml(b.dealershipName)}" class="w-full h-full object-cover" />`;
        } else {
          logoBox.innerHTML = `<i data-lucide="car-front" class="w-5 h-5"></i>`;
        }
      }
      document.title = `${b.dealershipName || 'AutoBook'} — Dealership & Agent Portal`;
    }

    // 9-Point Used Car Screening Checklist (Owner Intake & Agent Sourcing)
    const CHECKLIST_ITEMS = [
      { id: 'orcr_docs', group: 'Legal & LTO Verification', label: 'Original OR/CR On-Hand & Verified', shortLabel: 'Orig OR/CR' },
      { id: 'no_lto_alarm', group: 'Legal & LTO Verification', label: 'Clean LTO / HPG Status (No Alarm / Encumbrance)', shortLabel: 'Clean LTO/HPG' },
      { id: 'open_deed_ids', group: 'Legal & LTO Verification', label: 'Signed Open Deed of Sale + 2 Valid IDs w/ 3 Specimens', shortLabel: 'Deed & IDs' },
      { id: 'not_flooded', group: 'Structural & Mechanical Integrity', label: 'Guaranteed Not Flooded (No Silt / Rust / Waterline)', shortLabel: 'Not Flooded' },
      { id: 'no_major_accident', group: 'Structural & Mechanical Integrity', label: 'No Major Collision / Intact Chassis & Airbags', shortLabel: 'No Accident' },
      { id: 'odo_not_tampered', group: 'Structural & Mechanical Integrity', label: 'Verified Original Odometer (Not Tampered)', shortLabel: 'Orig Odometer' },
      { id: 'cold_ac_engine', group: 'Condition, History & Completeness', label: 'Cold A/C & Healthy Engine / Transmission', shortLabel: 'Cold A/C & Engine' },
      { id: 'fresh_paint_interior', group: 'Condition, History & Completeness', label: 'Fresh Exterior Paint & Clean Interior', shortLabel: 'Fresh Paint & Interior' },
      { id: 'spare_jack_keys', group: 'Condition, History & Completeness', label: 'Complete Spare Tire, Jack & 2 Original Keys', shortLabel: 'Spare, Jack & 2 Keys' }
    ];

    const RECON_CATEGORIES = [
      'Detailing & Buffing',
      'Mechanical & Engine',
      'Tires, Battery & PMS',
      'Body Paint & Dent Repair',
      'A/C & Electrical',
      'LTO / Transfer & Docs'
    ];

    // Default Dealership Users & Roles (Magief Cars — Trece Martires, Cavite)
    const DEFAULT_USERS = {
      owner_rv: { id: 'owner_rv', name: 'Rv Santiago III', role: 'OWNER', label: 'Owner', isFounder: true, phone: '0917-100-0001', active: true, joinedAt: 'Founder' },
      coowner_ryan: { id: 'coowner_ryan', name: 'Ryan Paolo Santiago', role: 'OWNER', label: 'Co-owner', isFounder: false, phone: '0917-100-0002', active: true, joinedAt: 'Co-Founder' },
      admin_rico: { id: 'admin_rico', name: 'Rico Donato', role: 'OWNER', label: 'Admin', isFounder: false, phone: '0917-200-1101', active: true, joinedAt: 'Oct 10' },
      admin_marc: { id: 'admin_marc', name: 'Marc Jamero', role: 'OWNER', label: 'Admin', isFounder: false, phone: '0917-200-1102', active: true, joinedAt: 'Oct 12' },
      agent_jester: { id: 'agent_jester', name: 'Jester Cabiltes', role: 'AGENT', label: 'Agent', isFounder: false, phone: '0917-234-8812', active: true, joinedAt: 'Oct 15' },
      agent_paul: { id: 'agent_paul', name: 'Paul Collante', role: 'AGENT', label: 'Agent', isFounder: false, phone: '0918-902-4410', active: true, joinedAt: 'Oct 20' }
    };

    function getUserRecord(userId) {
      if (typeof state !== 'undefined' && state && state.agents && state.agents[userId]) {
        return state.agents[userId];
      }
      return DEFAULT_USERS[userId] || { id: userId, name: 'Agent', role: 'AGENT', label: 'Agent', active: true };
    }

    function isOwnerRole(user) {
      return Boolean(user && user.role === 'OWNER');
    }

    // Safe HTML & Inline JS-Attribute Escaping Helpers
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsAttr(str) {
      return escapeHtml(
        String(str || '')
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/\r?\n/g, ' ')
      );
    }

    // Date, Time & Currency Helpers
    function formatPHP(amount) {
      if (amount === null || amount === undefined || isNaN(amount)) return '₱0';
      return '₱' + Number(amount).toLocaleString('en-PH', { maximumFractionDigits: 0 });
    }

    function getDateOffsetStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      if (dateStr === today) return `Today (${dateStr})`;
      if (dateStr === tomorrow) return `Tomorrow (${dateStr})`;
      return dateStr;
    }

    function getDaysBetween(startDateStr, endDateStr = getDateOffsetStr(0)) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr + 'T00:00:00');
      const end = new Date(endDateStr + 'T00:00:00');
      const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24));
      return Math.max(0, diffDays);
    }

    function getCarDaysOnLot(car) {
      const end = isCarSold(car) && car.soldAt ? car.soldAt : getDateOffsetStr(0);
      return getDaysBetween(car.listedAt || getDateOffsetStr(-5), end);
    }

    // Compress uploaded image files via HTML5 Canvas so localStorage stays fast & mobile-friendly
    function compressImageFile(file, maxWidth = 900, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        console.warn('State restore fallback:', err);
      }
      return createDefaultState();
    })();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('State save warning:', err);
      }
    }

    function getCurrentUser() {
      return getUserRecord(state.currentUserId) || DEFAULT_USERS.owner_rv;
    }

    // =========================================================================
    // CUSTOMIZABLE CAR STATUS PIPELINE & RECON COST HELPERS
    // =========================================================================

    function getStatusConfig(statusLabel) {
      const pipeline = state.statusPipeline || getDefaultStatusPipeline();
      const found = pipeline.find(s => s.label === statusLabel);
      if (found) return found;
      return {
        id: 'st_fallback',
        label: statusLabel || 'Ready for Release',
        color: 'slate',
        allowBookings: statusLabel === 'Available' || statusLabel === 'Ready for Release' || statusLabel === 'Under Viewing',
        systemRole: 'CUSTOM'
      };
    }

    function getStatusBadgeClasses(statusLabel) {
      const cfg = getStatusConfig(statusLabel);
      const pal = STATUS_COLOR_PALETTES[cfg.color] || STATUS_COLOR_PALETTES.slate;
      return `${pal.badge} border ring-1`;
    }

    function getStatusDotClass(statusLabel) {
      const cfg = getStatusConfig(statusLabel);
      const pal = STATUS_COLOR_PALETTES[cfg.color] || STATUS_COLOR_PALETTES.slate;
      return pal.dot;
    }

    function isCarSold(car) {
      if (!car) return false;
      const cfg = getStatusConfig(car.status);
      return cfg.systemRole === 'SOLD' || String(car.status).toLowerCase() === 'sold';
    }

    function isCarReserved(car) {
      if (!car) return false;
      const cfg = getStatusConfig(car.status);
      return cfg.systemRole === 'RESERVED' || String(car.status).toLowerCase() === 'reserved' || Boolean(car.reservation);
    }

    function isCarBookable(car) {
      if (!car || isCarSold(car) || isCarReserved(car)) return false;
      const cfg = getStatusConfig(car.status);
      return Boolean(cfg.allowBookings);
    }

    function isCarUnderPreparation(car) {
      if (!car) return false;
      const cfg = getStatusConfig(car.status);
      return cfg.systemRole === 'PREP_RECON' || cfg.systemRole === 'PREP_DETAIL';
    }

    function getPrepWorkflowStepIndex(car) {
      if (!car) return 3;
      const cfg = getStatusConfig(car.status);
      if (cfg.systemRole === 'PREP_RECON') return 1;
      if (cfg.systemRole === 'PREP_DETAIL') return 2;
      return 3;
    }

    function getNextPipelineStage(currentLabel) {
      const pipeline = state.statusPipeline || getDefaultStatusPipeline();
      const idx = pipeline.findIndex(s => s.label === currentLabel);
      if (idx === -1 || idx >= pipeline.length - 1) return null;
      return pipeline[idx + 1];
    }

    function getCarReconTotal(car) {
      if (!car || !Array.isArray(car.reconExpenses)) return 0;
      return car.reconExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    }

    function getCarAcquisitionCost(car) {
      if (!car) return 0;
      if (typeof car.acquisitionPrice === 'number' && !isNaN(car.acquisitionPrice)) {
        return car.acquisitionPrice;
      }
      return Math.max(0, (Number(car.basePrice) || 0) - getCarReconTotal(car) - (Number(car.targetMargin) || 0));
    }

    function getCarTargetMargin(car) {
      if (!car) return 0;
      return Math.max(0, Number(car.targetMargin) || 0);
    }

    function recalculateCarBasePrice(car) {
      const acq = getCarAcquisitionCost(car);
      const recon = getCarReconTotal(car);
      const margin = getCarTargetMargin(car);
      car.acquisitionPrice = acq;
      car.targetMargin = margin;
      car.basePrice = acq + recon + margin;
      return car.basePrice;
    }

    function emitLiveEvent(title, message, color = 'emerald') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const palette = {
        emerald: 'border-emerald-500/40 bg-slate-900 text-white',
        indigo:  'border-indigo-500/40 bg-slate-900 text-white',
        amber:   'border-amber-500/40 bg-slate-900 text-white',
        rose:    'border-rose-500/40 bg-slate-900 text-white'
      };
      const dotPalette = {
        emerald: 'bg-emerald-400',
        indigo:  'bg-indigo-400',
        amber:   'bg-amber-400',
        rose:    'bg-rose-400'
      };

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto rounded-2xl border ${palette[color] || palette.emerald} p-3.5 shadow-2xl backdrop-blur-md`;
      toast.innerHTML = `
        <div class="flex items-start gap-2.5">
          <span class="w-2 h-2 rounded-full ${dotPalette[color] || dotPalette.emerald} mt-1.5 shrink-0"></span>
          <div class="min-w-0 flex-1">
            <p class="text-xs font-extrabold tracking-tight">${escapeHtml(title)}</p>
            <p class="text-[11px] text-slate-300 mt-0.5 leading-snug">${escapeHtml(message)}</p>
          </div>
        </div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 4200);
    }

      switcher.innerHTML = activeUsers.map(u => {

                            `).join('')}
                          </select>
                          <button onclick="openCarReconModal('${car.id}')" class="px-2.5 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-[11px] font-bold inline-flex items-center gap-1 shrink-0 transition">
                            <i data-lucide="wrench" class="w-3.5 h-3.5 text-amber-600"></i>
                            <span>Recon (${reconCount})</span>
                          </button>
                        </div>
                      ` : ''}
                    </div>
                  </div>

                  <!-- Card Action Footer -->
                  <div class="p-3.5 bg-slate-50 border-t border-slate-100">
                    ${isCarSold(car) ? `
                      <div class="text-center text-xs font-extrabold text-slate-500 py-1.5">
                        Sold &amp; Released to Buyer
                      </div>
                    ` : priorityLocked ? `
                      <div class="text-center text-[11px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-xl py-2 px-3">
                        Locked under ${escapeHtml(scoutAgent?.name || 'Scout')}'s 48h Attribution Window
                      </div>
                    ` : `
                      <div class="grid grid-cols-3 gap-1.5">
                        <button
                          onclick="openBookViewingModal('${car.id}')"
                          ${!bookable ? 'disabled' : ''}
                          class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                            bookable
                              ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs'
                              : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                          }"
                        >
                          <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                          <span>Book</span>
                        </button>
                        <button
                          onclick="openReserveCarModal('${car.id}')"
                          ${isCarReserved(car) ? 'disabled' : ''}
                          class="px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                            !isCarReserved(car)
                              ? 'bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300'
                              : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                          }"
                        >
                          <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                          <span>Reserve</span>
                        </button>
                        <button
                          onclick="openMarkSoldModal('${car.id}')"
                          class="px-2.5 py-2 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-white transition flex items-center justify-center gap-1"
                        >
                          <i data-lucide="badge-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                          <span>Sold</span>
                        </button>
                      </div>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    // =========================================================================
    // TAB 1B: UNDER PREPARATION (RECONDITIONING / PMS & DETAILING BAY)
    // =========================================================================

    function renderPreparationView(user) {
      if (!isOwnerRole(user)) {
        return renderInventoryView(user);

      const prepCars = state.cars.filter(c => isCarUnderPreparation(c));
      const reconCount = prepCars.filter(c => getStatusConfig(c.status).systemRole === 'PREP_RECON').length;
      const detailingCount = prepCars.filter(c => getStatusConfig(c.status).systemRole === 'PREP_DETAIL').length;
      const totalPrepCapital = prepCars.reduce((sum, c) => sum + (Number(c.basePrice) || 0), 0);

      const prepFilter = state.prepFilter || 'ALL';
      const filteredPrepCars = prepCars.filter(car => {
        if (prepFilter === 'ALL') return true;
        return car.status === prepFilter;

      const prepStages = (state.statusPipeline || getDefaultStatusPipeline())
        .filter(s => ['PREP_RECON', 'PREP_DETAIL'].includes(s.systemRole));

      return `

            <p class="text-2xl font-extrabold text-slate-900 mt-1">${prepCars.length}</p>

          <div class="bg-white p-3.5 rounded-2xl border border-amber-200 shadow-sm">

          <div class="bg-white p-3.5 rounded-2xl border border-sky-200 shadow-sm">

        <!-- Prep Stage Filter Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 mb-6">

            return `
              <button onclick="setPrepFilter('${escapeJsAttr(stLabel)}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${

                  : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'

            <i data-lucide="sparkles" class="w-10 h-10 text-emerald-500 mx-auto mb-3"></i>
            <h3 class="text-base font-bold text-slate-900">All units have been released to Live Inventory!</h3>
            <p class="text-sm text-slate-500 mt-1">When you buy a new car or acquire a lead from Car Sourcing, it will appear here for Reconditioning &amp; Detailing.</p>
          </div>
        ` : `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            ${filteredPrepCars.map(car => {
              const photos = getCarPhotos(car);
              const coverPhoto = photos[0];
              const daysInPrep = getCarDaysOnLot(car);
              const statusBadgeCls = getStatusBadgeClasses(car.status);
              const acqCost = getCarAcquisitionCost(car);
              const reconTotal = getCarReconTotal(car);
              const targetMargin = getCarTargetMargin(car);
              const reconList = Array.isArray(car.reconExpenses) ? car.reconExpenses : [];
              const prepStep = getPrepWorkflowStepIndex(car);
              const nextStage = getNextPipelineStage(car.status);
              const isDetailingStage = getStatusConfig(car.status).systemRole === 'PREP_DETAIL';

              return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                  <div>
                    <!-- Top Vehicle Banner -->
                    <div class="relative h-48 bg-slate-900 overflow-hidden group">
                      <img
                        src="${coverPhoto.url}"
                        alt="${escapeHtml(`${car.year} ${car.make} ${car.model}`)}"
                        onclick="openPhotoGalleryModal('${car.id}', 0)"
                        class="w-full h-full object-cover cursor-pointer group-hover:scale-105 transition duration-300"
                      />
                      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/25 to-slate-950/30 pointer-events-none"></div>

                      <div class="absolute top-3 left-3 flex flex-wrap items-center gap-1.5">
                        <span class="px-2.5 py-1 rounded-full text-[11px] font-bold shadow-sm backdrop-blur-sm ${statusBadgeCls}">
                          ${escapeHtml(car.status)}
                        </span>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-950/80 text-slate-200 border border-white/15">
                          ${daysInPrep}d in prep

                      </div>

                      <div class="absolute top-3 right-3 flex items-center gap-1.5">
                        <button onclick="openEditCarPhotosModal('${car.id}')" class="px-2.5 py-1 rounded-full bg-emerald-600/95 hover:bg-emerald-600 text-white text-[11px] font-bold inline-flex items-center gap-1 border border-emerald-300/30 shadow-sm">

                      </div>

                      <div class="absolute bottom-3 inset-x-4 text-white">

                          <span>${escapeHtml(car.mileage)}</span>
                          <span>•</span>
                          <span>${escapeHtml(car.transmission)}</span>

                          <span>${escapeHtml(car.location)}</span>

                      </div>
                    </div>

                    <div class="p-5 space-y-4">
                      <!-- 4-Step Prep Workflow Bar -->
                      <div class="bg-slate-900 text-white rounded-xl p-3 border border-slate-800">
                        <div class="flex items-center justify-between text-[11px] font-bold mb-2">
                          <span class="text-slate-400 uppercase tracking-wider">Prep Workflow</span>
                          <span class="${isDetailingStage ? 'text-sky-300' : 'text-amber-300'}">
                            ${prepStep === 1 ? 'Step 2/4: Reconditioning / PMS' : 'Step 3/4: Detailing'}
                          </span>
                        </div>
                        <div class="grid grid-cols-4 gap-1.5 mb-2.5">
                          <div class="h-1.5 rounded-full bg-emerald-500" title="1. Acquired"></div>
                          <div class="h-1.5 rounded-full ${prepStep === 1 ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'}" title="2. Reconditioning / PMS"></div>
                          <div class="h-1.5 rounded-full ${prepStep >= 2 ? (prepStep === 2 ? 'bg-sky-400 animate-pulse' : 'bg-emerald-500') : 'bg-slate-700'}" title="3. Detailing"></div>
                          <div class="h-1.5 rounded-full bg-slate-700" title="4. Ready for Release"></div>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                          <select onchange="changeCarPipelineStatus('${car.id}', this.value)" class="bg-slate-800 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none">
                            ${(state.statusPipeline || getDefaultStatusPipeline()).filter(s => !['SOLD', 'RESERVED'].includes(s.systemRole)).map(st => `
                              <option value="${escapeHtml(st.label)}" ${car.status === st.label ? 'selected' : ''}>Stage: ${escapeHtml(st.label)}</option>
                            `).join('')}
                          </select>
                          ${nextStage ? `
                            <button onclick="advanceCarWorkflowStage('${car.id}')" class="px-3 py-1.5 rounded-lg ${isDetailingStage ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-sky-600 hover:bg-sky-500'} text-white text-[11px] font-bold inline-flex items-center gap-1.5 transition shadow-sm">
                              <span>${isDetailingStage ? 'Release to Live Inventory' : `Move to ${escapeHtml(nextStage.label)}`}</span>
                              <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </button>
                          ` : ''}
                        </div>
                      </div>

                      <!-- Base Selling Price Roll-Up Summary -->
                      <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                          <div>
                            <span class="text-[10px] font-bold uppercase text-slate-400 block">Unit Buy-In</span>
                            <span class="font-extrabold text-slate-800">${formatPHP(acqCost)}</span>
                          </div>
                          <div>
                            <span class="text-[10px] font-bold uppercase text-amber-600 block">+ Recon / Detail</span>
                            <span class="font-extrabold text-amber-700">${formatPHP(reconTotal)}</span>
                          </div>
                          <div>
                            <span class="text-[10px] font-bold uppercase text-indigo-600 block">+ Target Margin</span>
                            <span class="font-extrabold text-indigo-700">${formatPHP(targetMargin)}</span>
                          </div>
                          <div class="sm:border-l sm:border-slate-200 sm:pl-2.5">
                            <span class="text-[10px] font-bold uppercase text-emerald-700 block">Base Sell Price</span>
                            <span class="text-base font-extrabold text-emerald-700">${formatPHP(car.basePrice)}</span>
                          </div>
                        </div>
                      </div>

                      <!-- Inline Box: Put Prices Spent for Reconditioning, Detailing & Target Margin -->
                      <div class="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-3">

                            <i data-lucide="receipt" class="w-4 h-4 text-amber-600"></i>
                            <span>Add Reconditioning / Detailing Cost</span>
                          </span>

                            placeholder="Work done (e.g., Detailing, PMS)"
                            class="sm:col-span-4 px-2.5 py-2 bg-white border border-amber-200 rounded-xl text-xs"
                          />
                          <input
                            type="number"
                            name="amount"
                            required
                            min="100"
                            step="100"
                            placeholder="₱ Amount"
                            class="sm:col-span-2 px-2.5 py-2 bg-white border border-amber-200 rounded-xl text-xs font-extrabold text-slate-900"
                          />
                          <button type="submit" class="sm:col-span-2 px-2.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold shadow-sm transition">
                            + Add
                          </button>
                        </form>

                        <!-- Optional Target Profit / Margin Input Box -->
                        <form onsubmit="submitInlineTargetMargin(event, '${car.id}')" class="pt-2 border-t border-amber-200/80 flex flex-wrap items-center justify-between gap-2">
                          <label class="text-[11px] font-bold text-slate-700">
                            Dealership Profit Buffer (+PHP on top of Buy-In + Recon):
                          </label>
                          <div class="flex items-center gap-1.5">
                            <input
                              type="number"
                              name="targetMargin"
                              min="0"
                              step="1000"
                              value="${targetMargin}"
                              class="w-28 px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-extrabold text-slate-900"
                            />
                            <button type="submit" class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold">
                              Set Margin
                            </button>
                          </div>
                        </form>

                        ${reconList.length > 0 ? `
                          <div class="space-y-1.5 pt-1">
                            ${reconList.slice(0, 3).map(item => `
                              <div class="px-2.5 py-1.5 rounded-lg bg-white/90 border border-amber-200/70 flex items-center justify-between gap-2 text-[11px]">
                                <span class="truncate text-slate-700">
                                  <strong class="text-amber-800">${escapeHtml(item.category)}:</strong> ${escapeHtml(item.description)}
                                </span>
                                <div class="flex items-center gap-1.5 shrink-0">
                                  <span class="font-extrabold text-slate-900">+${formatPHP(item.amount)}</span>
                                  <button type="button" onclick="removeReconExpenseInline('${car.id}', '${item.id}')" title="Remove item" class="text-rose-500 hover:text-rose-700">
                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                  </button>
                                </div>
                              </div>
                            `).join('')}
                          </div>

                      </div>
                    </div>
                  </div>

                  <!-- Bottom Action Bar -->
                  <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-2">
                    <button onclick="openCarChecklistModal('${car.id}')" class="text-xs font-bold text-emerald-700 hover:text-emerald-800 inline-flex items-center gap-1">
                      <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                      <span>${getChecklistScore(car.checklist).passed}/9 Screening Checks</span>
                    </button>
                    <button onclick="openCarReconModal('${car.id}')" class="text-xs font-bold text-slate-700 hover:text-slate-950 inline-flex items-center gap-1">
                      <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                      <span>Edit Buy-In / Full Costs</span>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    // =========================================================================
    // TAB 2: CONFLICT-FREE VIEWING CALENDAR
    // =========================================================================

    function renderCalendarView(user) {
      const activeCars = state.cars.filter(c => !isCarSold(c));
      if (!activeCars.some(c => c.id === state.calendarCarId) && activeCars.length > 0) {
        state.calendarCarId = activeCars[0].id;
      }

      const selectedCar = state.cars.find(c => c.id === state.calendarCarId) || activeCars[0];
      const dateOptions = [getDateOffsetStr(0), getDateOffsetStr(1), getDateOffsetStr(2)];

      const dayBookings = selectedCar
        ? state.bookings.filter(b => b.carId === selectedCar.id && b.date === state.calendarDateFilter && b.status === 'CONFIRMED')
        : [];

      const priorityLockedForMe = selectedCar ? hasActivePriorityLock(selectedCar, user) : false;

      return `
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Conflict-Free Viewing Calendar</h1>
            <p class="text-sm text-slate-500 mt-1">
              Atomic slot locking ensures two agents never bring buyers for the same unit at the same hour.
            </p>
          </div>
        </div>

        <!-- Vehicle & Date Selector Card -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm mb-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Select Vehicle</label>
              <select onchange="setCalendarCar(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                ${activeCars.map(c => `
                  <option value="${c.id}" ${selectedCar && c.id === selectedCar.id ? 'selected' : ''}>
                    ${c.year} ${escapeHtml(c.make)} ${escapeHtml(c.model)} — [${escapeHtml(c.status)}]
                  </option>
                `).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Viewing Date</label>
              <div class="flex flex-wrap items-center gap-2">
                ${dateOptions.map(dStr => {
                  const active = state.calendarDateFilter === dStr;
                  return `
                    <button onclick="setCalendarDate('${dStr}')" class="px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                      active
                        ? 'bg-emerald-600 text-white shadow-sm'
                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                    }">
                      ${formatDisplayDate(dStr)}
                    </button>
                  `;
                }).join('')}
                <input
                  type="date"
                  value="${state.calendarDateFilter}"
                  onchange="setCalendarDate(this.value)"
                  class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"
                />
              </div>
            </div>
          </div>

          ${selectedCar ? `
            <div class="mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-full font-bold ${getStatusBadgeClasses(selectedCar.status)}">
                  ${escapeHtml(selectedCar.status)}
                </span>
                <span class="text-slate-600 font-medium">${escapeHtml(selectedCar.location)}</span>
              </div>
              <span class="font-bold text-slate-900">Floor Price: ${formatPHP(selectedCar.basePrice)}</span>
            </div>
          ` : ''}
        </div>

        <!-- Time Slot Grid -->
        ${!selectedCar ? `
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">
            No active vehicles available for scheduling.
          </div>
        ` : isCarReserved(selectedCar) ? `
          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center">
            <i data-lucide="lock" class="w-8 h-8 text-rose-600 mx-auto mb-2"></i>
            <h3 class="text-base font-extrabold text-rose-900">Viewing Slots Locked — Vehicle Reserved</h3>
            <p class="text-xs text-rose-700 mt-1 max-w-md mx-auto">
              ${escapeHtml(getUserRecord(selectedCar.reservation?.agentId)?.name || 'An agent')} placed a verified buyer deposit on this unit. New viewing schedules are paused unless the hold is released.
            </p>
          </div>
        ` : !isCarBookable(selectedCar) ? `
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center">
            <i data-lucide="pause-circle" class="w-8 h-8 text-amber-600 mx-auto mb-2"></i>
            <h3 class="text-base font-extrabold text-amber-900">Viewing Slots Paused — ${escapeHtml(selectedCar.status)}</h3>
            <p class="text-xs text-amber-800 mt-1 max-w-md mx-auto">
              This unit is currently in <strong>${escapeHtml(selectedCar.status)}</strong>. Once moved to <strong>Ready for Release</strong>, agents can book buyer viewing slots here.
            </p>
          </div>

        ? state.sales

      const approvedSales = state.sales.filter(s => s.status === 'APPROVED');
      const totalDealershipNet = approvedSales.reduce((acc, s) => acc + s.dealershipNet, 0);
      const totalAgentPayouts = approvedSales.reduce((acc, s) => acc + s.agentPayout, 0);
      const activeInventoryCapital = state.cars
        .filter(c => !isCarSold(c))
        .reduce((acc, c) => acc + (Number(c.basePrice) || 0), 0);

      const soldCars = state.cars.filter(c => isCarSold(c));
      const avgDaysToSell = soldCars.length > 0

          const totalEarnings = closedDeals.reduce((sum, s) => sum + s.agentPayout, 0);
          return {
            agent,
            closedCount: closedDeals.length,
            pendingCount: pendingDeals.length,

              <div class="divide-y divide-slate-100">

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    }

      const root = document.getElementById('modal-root');
      if (!root) return;

      if (modalType === 'book-viewing') {
        const car = state.cars.find(c => c.id === payload.carId);
        if (!car) return;
        const defaultDate = payload.date || getDateOffsetStr(0);
        const defaultSlot = payload.slot || TIME_SLOTS[0];

        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-extrabold text-slate-900">Book Buyer Viewing Slot</h3>
                <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>

    // Conflict-Free Atomic Slot Booking
    function submitBookViewing(event, carId) {
      event.preventDefault();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      const form = event.target;
      const date = form.date.value;
      const slot = form.slot.value;
      const buyerName = form.buyerName.value.trim();
      const buyerPhone = form.buyerPhone.value.trim();
      const notes = form.notes.value.trim();

      if (!isCarBookable(car)) {
        emitLiveEvent('Booking Blocked', `${car.year} ${car.make} ${car.model} is currently in "${car.status}" and cannot be booked yet.`, 'rose');
        closeModal();
        return;
      }

      if (hasActivePriorityLock(car, user)) {
        emitLiveEvent('48h Scout Priority Lock', 'This unit is protected under the sourcing agent’s 48-hour attribution lock.', 'indigo');
        closeModal();
        return;
      }

      const conflict = state.bookings.find(
        b => b.carId === car.id && b.date === date && b.slot === slot && b.status === 'CONFIRMED'
      );
      if (conflict) {
        const holder = getUserRecord(conflict.agentId);
        emitLiveEvent('Slot Conflict Prevented', `${slot} on ${date} is already locked by ${holder?.name || 'another agent'}.`, 'rose');
        return;
      }

      state.bookings.push({
        id: 'bk_' + Date.now(),
        carId: car.id,
        agentId: user.id,
        date,
        slot,
        buyerName,
        buyerPhone,
        notes,
        status: 'CONFIRMED',
        createdAt: 'Just now'
      });

      const readyStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'OPEN');
      const viewingStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'VIEWING');
      if (readyStage && viewingStage && car.status === readyStage.label) {
        car.status = viewingStage.label;
      }

      state.calendarCarId = car.id;
      state.calendarDateFilter = date;
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Viewing Slot Locked',
        `${user.name} locked ${car.year} ${car.make} ${car.model} on ${date} at ${slot}.`,
        'emerald'
      );
    }

    function cancelBooking(bookingId) {
      const idx = state.bookings.findIndex(b => b.id === bookingId);
      if (idx === -1) return;
      const bk = state.bookings[idx];
      const car = state.cars.find(c => c.id === bk.carId);
      state.bookings.splice(idx, 1);

      if (car && !isCarReserved(car) && !isCarSold(car)) {
        const remaining = state.bookings.filter(b => b.carId === car.id && b.status === 'CONFIRMED');
        const readyStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'OPEN');
        const viewingStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'VIEWING');
        if (remaining.length === 0 && readyStage && viewingStage && car.status === viewingStage.label) {
          car.status = readyStage.label;
        }
      }

      saveState();
      renderApp();
      emitLiveEvent('Viewing Slot Released', `${bk.slot} (${bk.date}) is now open again for all agents.`, 'amber');
    }

    // Mark Sold & Dual Payout Calculation (Patong Markup vs % Commission)
    function toggleSaleModelInputs(basePrice, commRate) {
      const model = document.getElementById('sale-payout-model')?.value || 'MARKUP';
      const priceInput = document.getElementById('sale-final-price');
      if (priceInput && model === 'COMMISSION') {
        priceInput.value = basePrice;
      }
      recalcSalePreview(basePrice, commRate);
    }

    function recalcSalePreview(basePrice, commRate) {
      const model = document.getElementById('sale-payout-model')?.value || 'MARKUP';
      const finalPrice = Number(document.getElementById('sale-final-price')?.value) || basePrice;
      const preview = document.getElementById('sale-payout-preview');
      if (!preview) return;

      if (model === 'MARKUP') {
        const markup = Math.max(0, finalPrice - basePrice);
        preview.innerHTML = `Estimated Agent Patong Payout: <strong>${formatPHP(markup)}</strong> • Dealership Net: <strong>${formatPHP(basePrice)}</strong>`;
      } else {
        const comm = Math.round(finalPrice * (commRate / 100));
        preview.innerHTML = `Estimated ${commRate.toFixed(1)}% Commission Payout: <strong>${formatPHP(comm)}</strong> • Dealership Net: <strong>${formatPHP(finalPrice - comm)}</strong>`;
      }
    }

    function submitMarkSold(event, carId) {
      event.preventDefault();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      const form = event.target;
      const agentId = form.agentId.value;
      const buyerName = form.buyerName.value.trim();
      const payoutModel = form.payoutModel.value;
      const reportedSalePrice = Math.max(car.basePrice, Number(form.reportedSalePrice.value) || car.basePrice);

      let agentPayout = 0;
      let dealershipNet = car.basePrice;
      let commissionRateSnapshot = null;

      if (payoutModel === 'MARKUP') {
        agentPayout = Math.max(0, reportedSalePrice - car.basePrice);
        dealershipNet = car.basePrice;
      } else {
        commissionRateSnapshot = state.commissionRate;
        agentPayout = Math.round(reportedSalePrice * (state.commissionRate / 100));
        dealershipNet = reportedSalePrice - agentPayout;
      }

      const soldStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'SOLD');
      car.status = soldStage ? soldStage.label : 'Sold';
      car.soldAt = getDateOffsetStr(0);
      car.reservation = null;

      state.sales.unshift({
        id: 'sale_' + Date.now(),
        carId: car.id,
        carTitle: `${car.year} ${car.make} ${car.model}`,
        agentId,
        buyerName,
        payoutModel,
        basePriceSnapshot: car.basePrice,
        reportedSalePrice,
        commissionRateSnapshot,
        agentPayout,
        dealershipNet,
        status: 'PENDING',
        submittedAt: 'Just now'
      });

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Deal Closed — Pending Owner Approval',
        `${car.year} ${car.make} ${car.model} marked Sold by ${getUserRecord(agentId)?.name || 'Agent'}. Payout: ${formatPHP(agentPayout)}.`,
        'emerald'
      );
    }

    function exportSalesLedgerCSV() {
      const headers = ['Sale ID', 'Vehicle', 'Agent', 'Buyer', 'Model', 'Base Price', 'Buyer Price', 'Agent Payout', 'Dealership Net', 'Status', 'Date'];
      const rows = state.sales.map(s => [
        s.id,
        `"${s.carTitle}"`,
        `"${getUserRecord(s.agentId)?.name || s.agentId}"`,
        `"${s.buyerName}"`,
        s.payoutModel,
        s.basePriceSnapshot,
        s.reportedSalePrice,
        s.agentPayout,
        s.dealershipNet,
        s.status,
        `"${s.submittedAt}"`
      ]);
      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `AutoBook_Sales_Ledger_${getDateOffsetStr(0)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      emitLiveEvent('CSV Ledger Exported', 'Sales and commission report downloaded.', 'emerald');
    }

    async function handleMultiPhotoSelect(event, gridElementId, globalDraftKey) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      if (!Array.isArray(window[globalDraftKey])) window[globalDraftKey] = [];

      for (const file of files) {
        try {
          const dataUrl = await compressImageFile(file);
          const cleanLabel = file.name.replace(/\.[^/.]+$/, '').slice(0, 28) || 'Vehicle Photo';
          window[globalDraftKey].push({ label: cleanLabel, url: dataUrl });
        } catch (err) {
          console.warn('Photo compression skipped:', err);
        }
      }

      const grid = document.getElementById(gridElementId);
      if (grid) {
        grid.innerHTML = window[globalDraftKey].map((p, idx) => `
          <div class="relative rounded-lg overflow-hidden border border-slate-200 bg-white">
            <img src="${p.url}" alt="${escapeHtml(p.label)}" class="w-full h-16 object-cover" />
            <span class="block text-[10px] font-semibold truncate px-1.5 py-0.5 text-slate-700">${escapeHtml(p.label)}</span>
          </div>
        `).join('');
      }
      emitLiveEvent('Photos Attached', `${files.length} photo(s) compressed and ready.`, 'emerald');
    }

    async function appendCarPhotos(carId, event) {
      const car = state.cars.find(c => c.id === carId);
      const files = Array.from(event.target.files || []);
      if (!car || !files.length) return;
      if (!Array.isArray(car.photos)) car.photos = [];

      for (const file of files) {
        try {
          const dataUrl = await compressImageFile(file);
          const label = file.name.replace(/\.[^/.]+$/, '').slice(0, 28) || `Angle ${car.photos.length + 1}`;
          car.photos.push({ label, url: dataUrl });
        } catch (err) {
          console.warn('Append photo failed:', err);
        }
      }
      saveState();
      openEditCarPhotosModal(carId);
      renderApp();
      emitLiveEvent('Vehicle Photos Added', `Added ${files.length} new photo(s) to ${car.year} ${car.make} ${car.model}.`, 'emerald');
    }

    function changeCarPipelineStatus(carId, newStatusLabel) {
      const currentUser = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car || !isOwnerRole(currentUser) || isCarSold(car)) return;

      const prevStatus = car.status;
      car.status = newStatusLabel;
      const cfg = getStatusConfig(newStatusLabel);
      if (cfg.systemRole !== 'RESERVED' && !isCarReserved(car)) {
        car.reservation = null;
      }

      saveState();
      renderApp();
      emitLiveEvent(
        'Workflow Stage Updated',
        `${car.year} ${car.make} ${car.model}: ${prevStatus} → ${newStatusLabel}.`,
        'indigo'
      );
    }

    function advanceCarWorkflowStage(carId, reopenModal = false) {
      const currentUser = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car || !isOwnerRole(currentUser) || isCarSold(car)) return;

      const nextStage = getNextPipelineStage(car.status);
      if (!nextStage) return;

      const prevStatus = car.status;
      car.status = nextStage.label;

      if (!isCarUnderPreparation(car) && state.activeTab === 'preparation') {
        state.activeTab = 'inventory';
      }

      saveState();
      if (reopenModal) {
        openCarReconModal(carId);
      }
      renderApp();
      emitLiveEvent(
        isCarUnderPreparation(car) ? 'Prep Stage Advanced' : 'Unit Released to Live Inventory!',
        `${car.year} ${car.make} ${car.model} moved from "${prevStatus}" to "${nextStage.label}" (Base Price: ${formatPHP(car.basePrice)}).`,
        'emerald'
      );
    }

      emitLiveEvent(
        'Recon Expense Removed',
        `Recalculated Base Floor Price for ${car.year} ${car.make} ${car.model} to ${formatPHP(car.basePrice)}.`,
        'indigo'
      );
    }

    // Add New Vehicle to Lot (Owner Intake)
    function submitAddCar(event) {
      event.preventDefault();
      const currentUser = getCurrentUser();
      const form = event.target;
      const year = Number(form.year.value) || 2022;
      const make = form.make.value.trim();
      const model = form.model.value.trim();
      const category = form.category.value;
      const acquisitionPrice = Math.max(50000, Number(form.acquisitionPrice.value) || 850000);
      const initialReconCost = Math.max(0, Number(form.initialReconCost?.value) || 0);
      const initialStatus = form.status ? form.status.value : 'Reconditioning / PMS';
      const mileage = form.mileage.value.trim();
      const transmission = form.transmission.value.trim();
      const location = form.location.value.trim();

      const checklist = {};
      CHECKLIST_ITEMS.forEach(item => {
        checklist[item.id] = Boolean(form[`chk_${item.id}`]?.checked);
      });

      const uploadedPhotos = Array.isArray(window.__draftCarPhotos) && window.__draftCarPhotos.length > 0
        ? window.__draftCarPhotos.slice()
        : [
            {
              label: 'Front 3/4 Exterior',
              url: makeCarSamplePhoto(`${year} ${make} ${model}`, `${mileage} • ${transmission} • Verified Intake`, '#0f172a', '#10b981', 'NEW LOT UNIT')
            }
          ];

      const reconExpenses = initialReconCost > 0 ? [{
        id: 'rec_' + Date.now(),
        category: 'Detailing & Buffing',
        description: 'Initial Intake Reconditioning & Detailing',
        amount: initialReconCost,
        date: getDateOffsetStr(0),
        addedBy: currentUser.name
      }] : [];

      const basePrice = acquisitionPrice + initialReconCost;

      const newCar = {
        id: 'car_' + Date.now(),
        make,
        model,
        year,
        category,
        mileage,
        transmission,
        fuel: 'Gasoline / Diesel',
        plateEnding: 'Verified OR/CR',
        color: 'Showroom Finish',
        acquisitionPrice,
        targetMargin: 0,
        reconExpenses,
        basePrice,
        status: initialStatus,
        location,
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        photos: uploadedPhotos,
        checklist,
        sourcedByAgentId: null,
        priorityLockUntil: null,
        reservation: null
      };

      state.cars.unshift(newCar);
      state.activeTab = isCarUnderPreparation(newCar) ? 'preparation' : 'inventory';
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('New Vehicle Added', `${newCar.year} ${newCar.make} ${newCar.model} added under "${initialStatus}" (${formatPHP(basePrice)}).`, 'emerald');
    }

    // Submit & Acquire Sourced Car Lead (+48h Attribution Lock)
    function submitNewLead(event) {
      event.preventDefault();
      const user = getCurrentUser();
      const form = event.target;

      const makeModel = form.makeModel.value.trim();
      const askingPrice = Number(form.askingPrice.value) || 700000;
      const mileage = form.mileage.value.trim();
      const plateNo = form.plateNo.value.trim();
      const sellerName = form.sellerName.value.trim();
      const sellerPhone = form.sellerPhone.value.trim();
      const location = form.location.value.trim();

      const checklist = {};
      CHECKLIST_ITEMS.forEach(item => {
        checklist[item.id] = Boolean(form[`chk_${item.id}`]?.checked);
      });

      const uploadedPhotos = Array.isArray(window.__draftLeadPhotos) && window.__draftLeadPhotos.length > 0
        ? window.__draftLeadPhotos.slice()
        : [];

      state.leads.unshift({
        id: 'lead_' + Date.now(),
        agentId: user.id,
        makeModel,
        plateNo,
        mileage,
        askingPrice,
        sellerName,
        sellerPhone,
        location,
        notes: `Direct seller lead submitted by ${user.name}.`,
        photos: uploadedPhotos,
        checklist,
        status: 'PENDING',
        submittedAt: 'Just now'
      });

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Sourced Car Lead Submitted', `${makeModel} sent to Dealership Owner for inspection.`, 'indigo');
    }

    function acquireLeadIntoInventory(leadId) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;

      lead.status = 'ACQUIRED';
      const parts = lead.makeModel.split(' ');
      const year = parseInt(parts[0], 10) || 2021;
      const make = parts[1] || 'Verified';
      const model = parts.slice(2).join(' ') || lead.makeModel;

      const leadPhotos = Array.isArray(lead.photos) && lead.photos.length > 0
        ? lead.photos.slice()
        : [{ label: 'Sourced Unit Exterior', url: makeCarSamplePhoto(lead.makeModel, `${lead.mileage} • ${lead.location}`, '#1e1b4b', '#818cf8', 'SCOUT ACQUIRED') }];

      const reconStageObj = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'PREP_RECON');
      const reconStartStage = reconStageObj ? reconStageObj.label : 'Reconditioning / PMS';

      const newCar = {
        id: 'car_' + Date.now(),
        make,
        model,
        year,
        category: 'SUV / Pickup',
        mileage: lead.mileage,
        transmission: 'Automatic',
        fuel: 'Diesel / Gas',
        plateEnding: lead.plateNo,
        color: 'Sourced Unit',
        acquisitionPrice: lead.askingPrice,
        targetMargin: 0,
        reconExpenses: [],
        basePrice: lead.askingPrice,
        status: reconStartStage,
        location: `Prep Bay • ${lead.location}`,
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        photos: leadPhotos,
        checklist: lead.checklist || {},
        sourcedByAgentId: lead.agentId,
        priorityLockUntil: Date.now() + 48 * 60 * 60 * 1000,
        reservation: null
      };

      state.cars.unshift(newCar);
      state.activeTab = 'preparation';
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Lead Acquired → Under Preparation',
        `${lead.makeModel} added to Under Preparation (${reconStartStage}) with a 48h Priority Lock for ${getUserRecord(lead.agentId)?.name || 'Scout'}.`,
        'emerald'
      );
    }

    // =========================================================================
    // WHITE-LABEL BRANDING, STATUS PIPELINE & TEAM / INVITE MANAGEMENT
    // =========================================================================

    async function handleBrandLogoUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const dataUrl = await compressImageFile(file, 320, 0.85);
        if (!state.branding) state.branding = getDefaultBranding();
        state.branding.logoUrl = dataUrl;
        saveState();
        applyDealershipBranding();
        openSettingsModal('branding');
        emitLiveEvent('Company Logo Updated', 'Your dealership emblem is now live in the portal header.', 'emerald');
      } catch (err) {
        console.warn('Logo upload error:', err);
      }
    }

    function removeBrandLogo() {
      if (!state.branding) state.branding = getDefaultBranding();
      state.branding.logoUrl = '';
      saveState();
      applyDealershipBranding();
      openSettingsModal('branding');
      emitLiveEvent('Logo Removed', 'Reverted to default AutoBook vehicle emblem.', 'amber');
    }

    function syncCustomColorInputs(rawVal) {
      const normalized = normalizeHexColor(rawVal);
      const picker = document.getElementById('brand-custom-color-picker');
      const hexInput = document.getElementById('brand-custom-hex-input');
      const dot = document.getElementById('custom-theme-dot');
      const radio = document.getElementById('theme-radio-custom');
      if (picker && picker.value !== normalized) picker.value = normalized;
      if (hexInput && document.activeElement !== hexInput) hexInput.value = normalized;
      if (dot) dot.style.backgroundColor = normalized;
      if (radio) radio.checked = true;
    }

    function submitDealershipBranding(event) {
      event.preventDefault();
      const form = event.target;
      const dealershipName = form.dealershipName.value.trim() || 'Magief Cars';
      const tagline = form.tagline.value.trim() || 'Trece Martires Cavite';
      const themeKey = form.themeKey.value || 'emerald';
      const customHex = normalizeHexColor(form.customHex?.value || '#0f766e');
      const fontKey = form.fontKey.value || 'inter';

      state.branding = {
        ...(state.branding || getDefaultBranding()),
        dealershipName,
        tagline,
        themeKey,
        customHex,
        fontKey
      };
      saveState();
      applyDealershipBranding();
      closeModal();
      renderApp();
      emitLiveEvent('Dealership Brand Applied', `${dealershipName} theme and identity updated across the portal.`, 'emerald');
    }

    function resetDealershipBranding() {
      state.branding = getDefaultBranding();
      saveState();
      applyDealershipBranding();
      openSettingsModal('branding');
      renderApp();
      emitLiveEvent('Brand Reset', 'Restored default Magief Cars theme.', 'indigo');
    }

    function submitAddPipelineStage(event) {
      event.preventDefault();
      const form = event.target;
      const label = form.label.value.trim();
      const color = form.color.value || 'indigo';
      const allowBookings = Boolean(form.allowBookings?.checked);
      if (!label) return;

      if (!Array.isArray(state.statusPipeline)) state.statusPipeline = getDefaultStatusPipeline();
      if (state.statusPipeline.some(s => s.label.toLowerCase() === label.toLowerCase())) {
        emitLiveEvent('Duplicate Stage', `A status stage named "${label}" already exists.`, 'rose');
        return;
      }

      const newStage = {
        id: 'st_' + Date.now(),
        label,
        color,
        allowBookings,
        systemRole: 'CUSTOM'
      };

      const reservedIdx = state.statusPipeline.findIndex(s => s.systemRole === 'RESERVED');
      if (reservedIdx !== -1) {
        state.statusPipeline.splice(reservedIdx, 0, newStage);
      } else {
        state.statusPipeline.push(newStage);
      }

      saveState();
      openSettingsModal('pipeline');
      renderApp();
      emitLiveEvent('Status Stage Added', `"${label}" added to your dealership vehicle pipeline.`, 'emerald');
    }

    function renamePipelineStage(stageId, rawLabel) {
      const newLabel = rawLabel.trim();
      if (!newLabel || !Array.isArray(state.statusPipeline)) return;
      const stage = state.statusPipeline.find(s => s.id === stageId);
      if (!stage || stage.label === newLabel) return;

      const oldLabel = stage.label;
      stage.label = newLabel;
      state.cars.forEach(car => {
        if (car.status === oldLabel) car.status = newLabel;
      });
      if (state.inventoryFilter === oldLabel) state.inventoryFilter = newLabel;
      if (state.prepFilter === oldLabel) state.prepFilter = newLabel;

      saveState();
      openSettingsModal('pipeline');
      renderApp();
      emitLiveEvent('Stage Renamed', `Updated "${oldLabel}" → "${newLabel}".`, 'indigo');
    }

    function updatePipelineStageColor(stageId, newColor) {
      const stage = (state.statusPipeline || []).find(s => s.id === stageId);
      if (!stage) return;
      stage.color = newColor;
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function togglePipelineStageBookable(stageId) {
      const stage = (state.statusPipeline || []).find(s => s.id === stageId);
      if (!stage || stage.systemRole === 'SOLD' || stage.systemRole === 'RESERVED') return;
      stage.allowBookings = !stage.allowBookings;
      saveState();
      openSettingsModal('pipeline');
      renderApp();
      emitLiveEvent(
        stage.allowBookings ? 'Viewing Bookings Enabled' : 'Viewing Bookings Paused',
        `Vehicles in "${stage.label}" now have viewing bookings ${stage.allowBookings ? 'OPEN' : 'LOCKED'}.`,
        stage.allowBookings ? 'emerald' : 'amber'
      );
    }

    function movePipelineStage(stageId, direction) {
      if (!Array.isArray(state.statusPipeline)) return;
      const idx = state.statusPipeline.findIndex(s => s.id === stageId);
      const targetIdx = idx + direction;
      if (idx === -1 || targetIdx < 0 || targetIdx >= state.statusPipeline.length) return;
      const [moved] = state.statusPipeline.splice(idx, 1);
      state.statusPipeline.splice(targetIdx, 0, moved);
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function deletePipelineStage(stageId) {
      if (!Array.isArray(state.statusPipeline)) return;
      const idx = state.statusPipeline.findIndex(s => s.id === stageId);
      if (idx === -1) return;
      const removed = state.statusPipeline[idx];
      if (removed.systemRole === 'SOLD' || removed.systemRole === 'RESERVED') return;

      const fallbackStage = state.statusPipeline.find(s => s.id !== stageId && s.allowBookings) || state.statusPipeline[0];
      state.cars.forEach(car => {
        if (car.status === removed.label && fallbackStage) {
          car.status = fallbackStage.label;
        }
      });
      if (state.inventoryFilter === removed.label) state.inventoryFilter = 'ALL';
      if (state.prepFilter === removed.label) state.prepFilter = 'ALL';

      state.statusPipeline.splice(idx, 1);
      saveState();
      openSettingsModal('pipeline');
      renderApp();
      emitLiveEvent('Status Stage Removed', `Deleted "${removed.label}" from pipeline.`, 'amber');
    }

    function resetStatusPipelineDefault() {
      const oldSold = (state.statusPipeline || []).find(s => s.systemRole === 'SOLD')?.label || 'Sold';
      const oldReserved = (state.statusPipeline || []).find(s => s.systemRole === 'RESERVED')?.label || 'Reserved';
      state.statusPipeline = getDefaultStatusPipeline();
      state.cars.forEach(car => {
        if (car.status === oldSold) car.status = 'Sold';
        else if (car.status === oldReserved || car.reservation) car.status = 'Reserved';
        else if (!state.statusPipeline.some(s => s.label === car.status)) car.status = 'Ready for Release';
      });
      state.inventoryFilter = 'ALL';
      state.prepFilter = 'ALL';
      saveState();
      openSettingsModal('pipeline');
      renderApp();
      emitLiveEvent('Pipeline Restored', 'Restored default 6-stage dealership workflow.', 'indigo');
    }

    function submitGenerateInvite(event) {
      event.preventDefault();
      const note = event.target.note.value.trim();
      if (!note) return;
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'AB-';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];

      state.invites.unshift({
        token: code,
        note,
        status: 'ACTIVE',
        createdAt: 'Just now',
        usedByName: null
      });
      saveState();
      openSettingsModal('team');
      emitLiveEvent('Invite Token Created', `Single-use token ${code} generated for ${note}.`, 'indigo');
    }

    function copyInviteLink(token) {
      const baseUrl = window.location.href.split('?')[0];
      const inviteUrl = `${baseUrl}?invite=${token}`;
      const tempInput = document.createElement('input');
      tempInput.value = inviteUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      emitLiveEvent('Invite URL Copied', `Copied ${inviteUrl} to clipboard.`, 'emerald');
    }

    function submitAcceptInviteForm(event, token) {
      event.preventDefault();
      const invite = state.invites.find(i => i.token === token && i.status === 'ACTIVE');
      if (!invite) {
        closeModal();
        emitLiveEvent('Invite Expired', 'This single-use link was already redeemed.', 'rose');
        return;
      }

      const form = event.target;
      const agentName = form.agentName.value.trim();
      const agentPhone = form.agentPhone.value.trim();
      const newAgentId = 'agent_' + Date.now();

      state.agents[newAgentId] = {
        id: newAgentId,
        name: agentName,
        role: 'AGENT',
        label: 'Agent',
        phone: agentPhone,
        active: true,
        joinedAt: 'Just now'
      };

      invite.status = 'USED';
      invite.usedByName = agentName;
      state.currentUserId = newAgentId;

      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Welcome to the Dealership!', `${agentName} joined as a verified Partner Agent.`, 'emerald');
    }

    function setTeamMemberRole(memberId, targetTier) {
      const member = state.agents[memberId];
      if (!member || member.isFounder || member.id === 'owner_rv') return;

      if (targetTier === 'COOWNER') {
        member.role = 'OWNER';
        member.label = 'Co-owner';
        saveState();
        openSettingsModal('team');
        renderApp();
        emitLiveEvent('Promoted to Co-Owner', `${member.name} now has Co-Owner privileges across inventory, pipeline, and team management.`, 'amber');
      } else if (targetTier === 'ADMIN') {
        member.role = 'OWNER';
        member.label = 'Admin';
        saveState();
        openSettingsModal('team');
        renderApp();
        emitLiveEvent('Role Updated to Admin', `${member.name} is set as a Dealership Admin.`, 'indigo');
      } else {
        member.role = 'AGENT';
        member.label = 'Agent';
        saveState();
        openSettingsModal('team');
        renderApp();
        emitLiveEvent('Role Changed to Agent', `${member.name} has been moved to Partner Agent permissions.`, 'amber');
      }
    }

    function toggleAgentActiveStatus(agentId) {
      const agent = state.agents[agentId];
      if (!agent || agent.isFounder || agent.id === 'owner_rv') return;
      agent.active = agent.active === false ? true : false;

      if (agent.active === false) {
        state.bookings = state.bookings.filter(b => b.agentId !== agentId);
        if (state.currentUserId === agentId) {
          state.currentUserId = 'owner_rv';
        }
        emitLiveEvent('Team Member Deactivated', `${agent.name}'s access was revoked and future viewing slots were released.`, 'rose');
      } else {
        emitLiveEvent('Team Member Reactivated', `${agent.name} can now log in and book viewing slots again.`, 'emerald');
      }

      saveState();
      openSettingsModal('team');
      renderApp();
    }

    function confirmResetDemoState() {
      localStorage.removeItem(STORAGE_KEY);
      state = createDefaultState();
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Workspace Reset', 'Magief Cars inventory, calendar & ledger restored to initial state.', 'indigo');
    }

    // =========================================================================
    // MAIN APPLICATION RENDERER & INITIALIZATION
    // =========================================================================

    function renderApp() {
      applyDealershipBranding();
      renderRoleSwitcher();
      const user = getCurrentUser();
      const ownerAccess = isOwnerRole(user);
      updateNavigationBadges();

      // Hide "Under Prep" tab from Agents; keep it exclusive to Owner / Co-owner / Admin
      document.querySelectorAll('.prep-tab-only').forEach(el => {
        if (ownerAccess) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });

      const mobileNav = document.getElementById('mobile-bottom-nav');
      if (mobileNav) {
        mobileNav.className = ownerAccess
          ? 'md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-950 text-white border-t border-slate-800 px-1.5 py-1.5 grid grid-cols-5 gap-1'
          : 'md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-950 text-white border-t border-slate-800 px-2 py-1.5 grid grid-cols-4 gap-1';
      }

      if (!ownerAccess && state.activeTab === 'preparation') {
        state.activeTab = 'inventory';
      }

      // Update Desktop, Sub-Nav & Mobile Navigation Active States
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const isPrepOnly = btn.classList.contains('prep-tab-only');
        const hiddenCls = (!ownerAccess && isPrepOnly) ? ' hidden' : '';
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = isActive
          ? `nav-tab-btn${isPrepOnly ? ' prep-tab-only' : ''}${hiddenCls} px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow-sm whitespace-nowrap`
          : `nav-tab-btn${isPrepOnly ? ' prep-tab-only' : ''}${hiddenCls} px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 text-slate-300 hover:text-white hover:bg-slate-800 whitespace-nowrap`;
      });

      document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
        const isPrepOnly = btn.classList.contains('prep-tab-only');
        const hiddenCls = (!ownerAccess && isPrepOnly) ? ' hidden' : '';
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = isActive
          ? `mobile-tab-btn${isPrepOnly ? ' prep-tab-only' : ''}${hiddenCls} relative flex flex-col items-center justify-center py-1.5 rounded-xl text-[10px] font-bold bg-emerald-600 text-white`
          : `mobile-tab-btn${isPrepOnly ? ' prep-tab-only' : ''}${hiddenCls} relative flex flex-col items-center justify-center py-1.5 rounded-xl text-[10px] font-semibold text-slate-400 hover:text-white`;
      });

      const appRoot = document.getElementById('app-root');
      if (!appRoot) return;

      if (state.activeTab === 'inventory') {
        appRoot.innerHTML = renderInventoryView(user);
      } else if (state.activeTab === 'preparation') {
        appRoot.innerHTML = renderPreparationView(user);
      } else if (state.activeTab === 'calendar') {
        appRoot.innerHTML = renderCalendarView(user);
      } else if (state.activeTab === 'sales') {
        appRoot.innerHTML = renderSalesView(user);
      } else if (state.activeTab === 'sourcing') {
        appRoot.innerHTML = renderSourcingView(user);
      }

      if (window.lucide) lucide.createIcons();
    }

    // Wire Navigation & Role Switcher Listeners
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      const roleSwitcher = document.getElementById('role-switcher');
      if (roleSwitcher) {
        roleSwitcher.addEventListener('change', (e) => {
          state.currentUserId = e.target.value;
          saveState();
          renderApp();
          const u = getCurrentUser();
          emitLiveEvent('Role Switched', `Now viewing portal as ${u.name} (${u.label}).`, 'indigo');
        });
      }

      renderApp();

      // Check URL for single-use invite token (?invite=AB-XXXXXX)
      const urlParams = new URLSearchParams(window.location.search);
      const inviteToken = urlParams.get('invite');
      if (inviteToken) {
        openModal('accept-invite-modal', { token: inviteToken.trim().toUpperCase() });
      }
    });
  </script>
</body>
