<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magief Cars — AutoBook v2.0 Dealership &amp; Partner Agent Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-50: #ecfdf5;
      --brand-100: #d1fae5;
      --brand-200: #a7f3d0;
      --brand-400: #34d399;
      --brand-500: #10b981;
      --brand-600: #059669;
      --brand-700: #047857;
      --brand-contrast: #ffffff;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    .bg-emerald-600 { background-color: var(--brand-600) !important; }
    .hover\:bg-emerald-700:hover { background-color: var(--brand-700) !important; }
    .bg-emerald-500 { background-color: var(--brand-500) !important; }
    .bg-emerald-50 { background-color: var(--brand-50) !important; }
    .bg-emerald-100 { background-color: var(--brand-100) !important; }
    .text-emerald-700 { color: var(--brand-700) !important; }
    .text-emerald-600 { color: var(--brand-600) !important; }
    .text-emerald-500 { color: var(--brand-500) !important; }
    .text-emerald-400 { color: var(--brand-400) !important; }
    .border-emerald-200 { border-color: var(--brand-200) !important; }
    .border-emerald-500 { border-color: var(--brand-500) !important; }
    .bg-emerald-600.text-white { color: var(--brand-contrast) !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.9; }
      70% { transform: scale(1.65); opacity: 0; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .live-pulse::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background-color: var(--brand-500);
      animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes slideInToast {
      from { transform: translateY(14px) scale(0.97); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .toast-enter {
      animation: slideInToast 0.24s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- GLOBAL RUNTIME ERROR BANNER (NEVER FAILS SILENTLY) -->

  <!-- 1. TWO-ROW ANTI-OVERLAP GLOBAL HEADER -->

              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>

  <!-- TOAST NOTIFICATION STACK -->

  <!-- MODAL ROOT -->

  <script>
    // =========================================================================
    // 0. GLOBAL ERROR HANDLER
    // =========================================================================
    window.onerror = function (message, source, lineno) {
      const banner = document.getElementById('global-error-banner');
      const text = document.getElementById('global-error-text');
      if (banner && text) {
        text.textContent = `UI Error (line ${lineno}): ${message}`;
        banner.classList.remove('hidden');
      }
      return false;
    };

    // =========================================================================
    // 1. CONSTANTS, ROSTER & RBAC HELPERS
    // =========================================================================
    const STORAGE_KEY = 'autobook_v2_3_magief_cars_fixed_finders_fee';

    const DEFAULT_BRANDING = {
      dealershipName: 'Magief Cars',
      tagline: 'Trece Martires Cavite',
      accentColor: '#059669'
    };

    const RECON_CATEGORIES = [
      'Mechanical / PMS',
      'Detailing',
      'Paint & Body',
      'Tires & Battery',
      'LTO / Docs'
    ];

    const TIME_SLOTS = ['10:00 AM', '1:30 PM', '4:00 PM'];

    const CHECKLIST_ITEMS = [
      { id: 'orcr_docs', group: 'Legal & LTO', label: 'Original OR / CR On-Hand & Verified' },
      { id: 'no_lto_alarm', group: 'Legal & LTO', label: 'Clean LTO / HPG Verification (No Alarm)' },
      { id: 'open_deed_ids', group: 'Legal & LTO', label: 'Open Deed of Sale + 2 Valid Owner IDs' },
      { id: 'not_flooded', group: 'Condition', label: '100% Flood-Free Guaranteed (No Silt / Rust)' },
      { id: 'no_major_accident', group: 'Condition', label: 'No Major Collision / Chassis & Airbags Intact' },
      { id: 'odo_not_tampered', group: 'Condition', label: 'Verified Original Odometer Reading' },
      { id: 'cold_ac_engine', group: 'Condition', label: 'Cold Dual/Single A/C & Healthy Engine/Trans' },
      { id: 'fresh_paint_interior', group: 'Condition', label: 'Fresh Exterior Paint & Detailed Cabin' },
      { id: 'spare_jack_keys', group: 'Condition', label: 'Complete Spare Tire, Jack & 2 Keys' }
    ];

    const DEFAULT_USERS = {
      owner_rv: { id: 'owner_rv', name: 'Rv Santiago III', tier: 'OWNER', label: 'Owner', phone: '0917-100-0001', active: true, isFounder: true },
      coowner_ryan: { id: 'coowner_ryan', name: 'Ryan Paolo Santiago', tier: 'CO_OWNER', label: 'Co-owner', phone: '0917-100-0002', active: true },
      admin_rico: { id: 'admin_rico', name: 'Rico Donato', tier: 'ADMIN', label: 'Admin', phone: '0917-210-3301', active: true },
      admin_marc: { id: 'admin_marc', name: 'Marc Jamero', tier: 'ADMIN', label: 'Admin', phone: '0917-210-3302', active: true },
      agent_jester: { id: 'agent_jester', name: 'Jester Cabiltes', tier: 'AGENT', label: 'Agent', phone: '0918-440-8812', active: true },
      agent_paul: { id: 'agent_paul', name: 'Paul Collante', tier: 'AGENT', label: 'Agent', phone: '0918-440-8819', active: true }
    };

    function getDefaultSourcingIncentiveConfig() {
      return {
        enabled: true,
        mode: 'TIERED',
        flatAmount: 5000,
        tier1Max: 650000,    // Under ₱650k -> ₱3,000
        tier1Amount: 3000,
        tier2Max: 1200000,   // ₱650k - ₱1.19M -> ₱6,000
        tier2Amount: 6000,
        tier3Amount: 10000   // ₱1.2M+ -> ₱10,000
      };
    }

    function getDefaultStatusPipeline() {
      return [
        { id: 'st_intake', label: 'Get the Car (Intake)', phase: 'PREP', badgeClass: 'bg-purple-100 text-purple-900 border-purple-300' },
        { id: 'st_recon', label: 'Reconditioning / PMS', phase: 'PREP', badgeClass: 'bg-amber-100 text-amber-900 border-amber-300' },
        { id: 'st_detailing', label: 'Detailing', phase: 'PREP', badgeClass: 'bg-sky-100 text-sky-900 border-sky-300' },
        { id: 'st_ready', label: 'Ready for Release', phase: 'SHOWROOM', badgeClass: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
        { id: 'st_viewing', label: 'Under Viewing', phase: 'SHOWROOM', badgeClass: 'bg-indigo-100 text-indigo-900 border-indigo-300' },
        { id: 'st_reserved', label: 'Reserved', phase: 'SHOWROOM', badgeClass: 'bg-rose-100 text-rose-900 border-rose-300' },
        { id: 'st_sold', label: 'Sold', phase: 'SHOWROOM', badgeClass: 'bg-slate-200 text-slate-800 border-slate-300' }
      ];
    }

    function isLeadership(user) {
      return Boolean(user && (user.tier === 'OWNER' || user.tier === 'CO_OWNER' || user.tier === 'ADMIN'));
    }

    function isExecutiveOwner(user) {
      return Boolean(user && (user.tier === 'OWNER' || user.tier === 'CO_OWNER'));
    }

    function isFounderOwner(user) {
      return Boolean(user && user.tier === 'OWNER');
    }

    function getUserRecord(userId) {
      if (typeof state !== 'undefined' && state && state.agents && state.agents[userId]) {
        return state.agents[userId];
      }
      return DEFAULT_USERS[userId] || { id: userId, name: 'Partner Agent', tier: 'AGENT', label: 'Agent', active: true };
    }

    function getCurrentUser() {
      return getUserRecord(state.currentUserId) || DEFAULT_USERS.owner_rv;
    }

    function getDateOffsetStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatDisplayDate(isoDate) {
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      if (isoDate === today) return 'Today';
      if (isoDate === tomorrow) return 'Tomorrow';
      const d = new Date(isoDate + 'T00:00:00');
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    function formatPHP(amount) {
      const num = Math.round(Number(amount) || 0);
      const sign = num < 0 ? '-' : '';
      return sign + '₱' + Math.abs(num).toLocaleString('en-PH');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsAttr(str) {
      return String(str ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;');
    }

    function normalizeHexColor(hex) {
      if (!hex) return '#059669';
      let clean = String(hex).trim();
      if (!clean.startsWith('#')) clean = '#' + clean;
      if (/^#[0-9A-Fa-f]{3}$/.test(clean)) {
        clean = '#' + clean[1] + clean[1] + clean[2] + clean[2] + clean[3] + clean[3];
      }
      return /^#[0-9A-Fa-f]{6}$/.test(clean) ? clean.toLowerCase() : '#059669';
    }

    function applyBrandingToDocument(brandingInput) {
      const branding = { ...DEFAULT_BRANDING, ...(brandingInput || {}) };
      const hex = normalizeHexColor(branding.accentColor);
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const mixWhite = w => `rgb(${Math.round(r * (1 - w) + 255 * w)}, ${Math.round(g * (1 - w) + 255 * w)}, ${Math.round(b * (1 - w) + 255 * w)})`;
      const darken = f => `rgb(${Math.max(0, Math.round(r * (1 - f)))}, ${Math.max(0, Math.round(g * (1 - f)))}, ${Math.max(0, Math.round(b * (1 - f)))})`;
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

      const root = document.documentElement;
      root.style.setProperty('--brand-50', mixWhite(0.92));
      root.style.setProperty('--brand-100', mixWhite(0.82));
      root.style.setProperty('--brand-200', mixWhite(0.65));
      root.style.setProperty('--brand-400', mixWhite(0.22));
      root.style.setProperty('--brand-500', mixWhite(0.08));
      root.style.setProperty('--brand-600', hex);
      root.style.setProperty('--brand-700', darken(0.2));
      root.style.setProperty('--brand-contrast', luminance > 0.62 ? '#0f172a' : '#ffffff');

      const titleEl = document.getElementById('brand-title-text');
      const taglineEl = document.getElementById('brand-tagline-text');
      if (titleEl) titleEl.textContent = branding.dealershipName || DEFAULT_BRANDING.dealershipName;
      if (taglineEl) taglineEl.textContent = branding.tagline || DEFAULT_BRANDING.tagline;
      document.title = `${branding.dealershipName || DEFAULT_BRANDING.dealershipName} — AutoBook v2.0`;
    }

    function makeCarSamplePhoto(title, bgHex, accentHex, angleBadge) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bgHex}"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
        </defs>
        <rect width="800" height="460" fill="url(#bg)"/>
        <circle cx="670" cy="95" r="150" fill="${accentHex}" opacity="0.16"/>
        <g transform="translate(175, 155)" fill="none" stroke="${accentHex}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M40 120 L85 52 C96 36 114 28 134 28 L305 28 C326 28 345 37 356 54 L405 120 L435 128 C448 132 456 143 456 156 L456 188 C456 198 448 206 438 206 L406 206"/>
          <path d="M126 206 L318 206"/>
          <path d="M40 120 L18 130 C8 135 2 145 2 156 L2 188 C2 198 10 206 20 206 L48 206"/>
          <circle cx="88" cy="206" r="38" fill="#0f172a"/>
          <circle cx="88" cy="206" r="17"/>
          <circle cx="364" cy="206" r="38" fill="#0f172a"/>
          <circle cx="364" cy="206" r="17"/>
          <path d="M110 112 L138 56 L220 56 L220 112 Z" opacity="0.75"/>
          <path d="M240 56 L316 56 L348 112 L240 112 Z" opacity="0.75"/>
        </g>
        <rect x="34" y="32" rx="10" width="210" height="32" fill="#0f172a" opacity="0.78"/>
        <text x="50" y="53" fill="${accentHex}" font-family="Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="1">${angleBadge}</text>
        <text x="34" y="408" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="800">${title}</text>
        <text x="34" y="434" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="600">Magief Cars • Trece Martires Cavite</text>
      </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function generateCanvasReceiptPNG(channel, refNo, amount, buyerName) {
      const canvas = document.createElement('canvas');
      canvas.width = 520;
      canvas.height = 680;
      const ctx = canvas.getContext('2d');
      const accent = channel === 'Maya' ? '#16a34a' : channel === 'InstaPay / Bank' ? '#2563eb' : '#0284c7';

      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, 520, 680);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(32, 28, 456, 624, 22);
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.roundRect(32, 28, 456, 106, [22, 22, 0, 0]);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 22px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${channel} Transfer E-Receipt`, 260, 74);

      ctx.fillStyle = '#e0f2fe';
      ctx.font = '600 13px Inter, sans-serif';
      ctx.fillText('Confirmed Incoming Transfer • Magief Cars', 260, 102);

      ctx.fillStyle = '#dcfce7';
      ctx.beginPath();
      ctx.arc(260, 182, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(248, 182);
      ctx.lineTo(256, 191);
      ctx.lineTo(274, 173);
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '700 12px Inter, sans-serif';
      ctx.fillText('TOTAL AMOUNT SENT', 260, 236);

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 32px Inter, sans-serif';
      ctx.fillText(`PHP ${Number(amount || 0).toLocaleString('en-PH')}`, 260, 276);

      ctx.strokeStyle = '#e2e8f0';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(64, 312);
      ctx.lineTo(456, 312);
      ctx.stroke();
      ctx.setLineDash([]);

      const rows = [
        ['Reference Number', refNo || '9018472615394', true],
        ['Recipient Account', 'Magief Cars Official Wallet', false],
        ['Sender / Buyer', buyerName || 'Verified Buyer', false],
        ['Payment Channel', channel || 'GCash', false],
        ['Timestamp', new Date().toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }), false]
      ];

      rows.forEach(([label, val, isMono], idx) => {
        const y = 354 + idx * 42;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#64748b';
        ctx.font = '600 13px Inter, sans-serif';
        ctx.fillText(label, 64, y);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#0f172a';
        ctx.font = isMono ? '800 14px monospace' : '700 13px Inter, sans-serif';
        ctx.fillText(String(val), 456, y);
      });

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(64, 560, 392, 62, 12);
      ctx.fill();
      ctx.strokeStyle = '#e2e8f0';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#475569';
      ctx.font = '700 12px Inter, sans-serif';
      ctx.fillText('AutoBook Duplicate Reference Guard Verified', 260, 586);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 11px Inter, sans-serif';
      ctx.fillText('Trece Martires Cavite • Dealership Audit Trail', 260, 606);

      return canvas.toDataURL('image/png');
    }

    // =========================================================================
    // 2. PRE-LOADED DEMO STATE FOR MAGIEF CARS
    // =========================================================================

    let state = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const defaults = createDefaultState();
          return {
            ...defaults,
            ...parsed,
            branding: { ...DEFAULT_BRANDING, ...(parsed.branding || {}) },
            sourcingIncentive: { ...getDefaultSourcingIncentiveConfig(), ...(parsed.sourcingIncentive || {}) },
            agents: parsed.agents || defaults.agents,
            statusPipeline: Array.isArray(parsed.statusPipeline) && parsed.statusPipeline.length
              ? parsed.statusPipeline
              : defaults.statusPipeline
          };
        }
      } catch (err) {
        console.warn('Resetting state to defaults:', err);
      }
      return createDefaultState();
    })();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('LocalStorage save warning:', err);
      }
    }

    // =========================================================================
    // 3. DOMAIN HELPERS (FIXED ₱3,000 - ₱10,000 FINDER'S FEE & PRICING)
    // =========================================================================
    function clampFindersAmount(amount) {
      const n = Number(amount);
      if (Number.isNaN(n)) return 3000;
      const clamped = Math.min(10000, Math.max(3000, n));
      return Math.round(clamped / 500) * 500; // ₱500 steps between ₱3,000 and ₱10,000
    }

    function getAutoTieredFindersAmount(carPrice) {
      const cfg = { ...getDefaultSourcingIncentiveConfig(), ...(state.sourcingIncentive || {}) };
      if (!cfg.enabled) return 0;
      if (cfg.mode === 'FLAT') {
        return clampFindersAmount(cfg.flatAmount);
      }
      const price = Math.max(0, Number(carPrice) || 0);
      if (price < (Number(cfg.tier1Max) || 650000)) {
        return clampFindersAmount(cfg.tier1Amount);
      }
      if (price < (Number(cfg.tier2Max) || 1200000)) {
        return clampFindersAmount(cfg.tier2Amount);
      }
      return clampFindersAmount(cfg.tier3Amount);
    }

    function getPriceTierLabel(carPrice) {
      const cfg = { ...getDefaultSourcingIncentiveConfig(), ...(state.sourcingIncentive || {}) };
      if (!cfg.enabled) return 'Disabled';
      if (cfg.mode === 'FLAT') return 'Flat Fixed Fee';
      const price = Math.max(0, Number(carPrice) || 0);
      if (price < (Number(cfg.tier1Max) || 650000)) return 'Tier 1 (<₱650k)';
      if (price < (Number(cfg.tier2Max) || 1200000)) return 'Tier 2 (₱650k–₱1.19M)';
      return 'Tier 3 (₱1.2M+)';
    }

    function getCarFindersFeeAmount(car) {
      if (!car || !car.sourcedByAgentId) return 0;
      if (!state.sourcingIncentive?.enabled) return 0;
      if (car.finderFeeAmount != null && !Number.isNaN(Number(car.finderFeeAmount)) && Number(car.finderFeeAmount) > 0) {
        return clampFindersAmount(car.finderFeeAmount);
      }
      return getAutoTieredFindersAmount(car.basePrice);
    }

    function getSourcingRuleLabel() {
      const cfg = { ...getDefaultSourcingIncentiveConfig(), ...(state.sourcingIncentive || {}) };
      if (!cfg.enabled) return 'OFF';
      if (cfg.mode === 'FLAT') {
        return `${formatPHP(clampFindersAmount(cfg.flatAmount))} Flat (₱3k–₱10k)`;
      }
      return `${formatPHP(clampFindersAmount(cfg.tier1Amount))} – ${formatPHP(clampFindersAmount(cfg.tier3Amount))} Fixed Tiers`;
    }

    function getStageMeta(statusLabel) {
      const pipeline = state.statusPipeline || getDefaultStatusPipeline();
      const found = pipeline.find(s => s.label.toLowerCase() === String(statusLabel || '').toLowerCase());
      if (found) return found;
      const lower = String(statusLabel || '').toLowerCase();
      if (lower.includes('intake') || lower.includes('recon') || lower.includes('pms') || lower.includes('detail')) {
        return { label: statusLabel, phase: 'PREP', badgeClass: 'bg-amber-100 text-amber-900 border-amber-300' };
      }
      return { label: statusLabel, phase: 'SHOWROOM', badgeClass: 'bg-emerald-100 text-emerald-900 border-emerald-300' };
    }

    function isCarInPreparation(car) {
      if (!car) return false;
      return getStageMeta(car.status).phase === 'PREP';
    }

    function isCarSold(car) {
      return Boolean(car && String(car.status || '').toLowerCase() === 'sold');
    }

    function isCarFundsClearedReserved(car) {
      if (!car || isCarSold(car)) return false;
      if (car.reservation) return car.reservation.paymentVerified === true;
      return String(car.status || '').toLowerCase() === 'reserved';
    }

    function isCarBookable(car) {
      if (!car || isCarSold(car) || isCarInPreparation(car) || isCarFundsClearedReserved(car)) return false;
      return true;
    }

    function getCarReconTotal(car) {
      if (!car || !Array.isArray(car.reconExpenses)) return 0;
      return car.reconExpenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    }

    function getCarTotalInvested(car) {
      return (Number(car?.acquisitionPrice) || 0) + getCarReconTotal(car);
    }

    function recalculateCarBasePrice(car) {
      if (!car) return 0;
      const buyIn = Math.max(0, Number(car.acquisitionPrice) || 0);
      const recon = getCarReconTotal(car);
      const buffer = Math.max(0, Number(car.targetMargin) || 0);
      car.acquisitionPrice = buyIn;
      car.targetMargin = buffer;
      car.basePrice = buyIn + recon + buffer;
      if (car.sourcedByAgentId && car.finderFeeAutoScaled !== false) {
        car.finderFeeAmount = getAutoTieredFindersAmount(car.basePrice);
      }
      return car.basePrice;
    }

    function getCarPhotos(car) {
      if (car && Array.isArray(car.photos) && car.photos.length > 0) return car.photos;
      return [{
        label: 'Showroom View',
        url: makeCarSamplePhoto(`${car?.year || ''} ${car?.make || ''} ${car?.model || ''}`.trim(), '#065f46', '#34d399', 'SHOWROOM UNIT')
      }];
    }

    function getChecklistScore(checklist = {}) {
      const passed = CHECKLIST_ITEMS.filter(item => Boolean(checklist[item.id])).length;
      return { passed, total: CHECKLIST_ITEMS.length };
    }

    function hasActivePriorityLock(car, user) {
      if (!car || !car.sourcedByAgentId || !car.priorityLockUntil) return false;
      if (Date.now() > car.priorityLockUntil) return false;
      if (!user || isLeadership(user)) return false;
      return car.sourcedByAgentId !== user.id;
    }

    function canUserMarkCarSold(car, user) {
      if (!car || !user || isCarSold(car)) return false;
      if (isLeadership(user)) return true;
      if (car.reservation) {
        return car.reservation.agentId === user.id;
      }
      return state.bookings.some(b => b.carId === car.id && b.agentId === user.id && b.status === 'CONFIRMED');
    }

    function normalizePaymentRef(ref) {
      return String(ref || '').trim().toUpperCase().replace(/\s+/g, '');
    }

    function findDuplicatePaymentReference(refNumber, excludeCarId = null) {
      const normalized = normalizePaymentRef(refNumber);
      if (!normalized || normalized === 'CASH') return null;

      for (const car of state.cars) {
        if (excludeCarId && car.id === excludeCarId) continue;
        if (car.reservation && normalizePaymentRef(car.reservation.referenceNo) === normalized) {
          return {
            source: 'Active Reservation',
            unit: `${car.year} ${car.make} ${car.model}`,
            agent: getUserRecord(car.reservation.agentId).name
          };
        }
      }

      for (const sale of state.sales) {
        if (normalizePaymentRef(sale.referenceNo) === normalized) {
          return {
            source: 'Closed Sale Ledger',
            unit: sale.carTitle,
            agent: getUserRecord(sale.agentId).name
          };
        }
      }
      return null;
    }

    function checkLiveReferenceDuplicate(inputEl, feedbackId, excludeCarId = null) {
      const feedbackEl = document.getElementById(feedbackId);
      if (!feedbackEl) return;
      const normalized = normalizePaymentRef(inputEl.value);
      if (!normalized) {
        feedbackEl.className = 'hidden';
        feedbackEl.innerHTML = '';
        return;
      }
      const dup = findDuplicatePaymentReference(normalized, excludeCarId);
      if (dup) {
        feedbackEl.className = 'mt-1.5 text-[11px] font-bold text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5';
        feedbackEl.innerHTML = `<i data-lucide="alert-octagon" class="w-3.5 h-3.5 shrink-0"></i><span>Duplicate Ref #! Already used on <strong>${escapeHtml(dup.unit)}</strong> (${escapeHtml(dup.source)} by ${escapeHtml(dup.agent)}).</span>`;
      } else {
        feedbackEl.className = 'mt-1.5 text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-2.5 py-1.5 flex items-center gap-1.5';
        feedbackEl.innerHTML = `<i data-lucide="check-circle-2" class="w-3.5 h-3.5 shrink-0"></i><span>Unique Reference # verified across all dealership records.</span>`;
      }
      if (window.lucide) lucide.createIcons();
    }

    function emitLiveEvent(title, message, tone = 'emerald') {
      const ticker = document.getElementById('live-feed-ticker');
      if (ticker) ticker.textContent = `${title}: ${message}`;

      const container = document.getElementById('toast-container');
      if (!container) return;

      const borderMap = {
        emerald: 'border-emerald-500/60',
        amber: 'border-amber-500/60',
        rose: 'border-rose-500/60',
        indigo: 'border-indigo-500/60'
      };
      const iconMap = {
        emerald: 'radio',
        amber: 'alert-triangle',
        rose: 'lock',
        indigo: 'sparkles'
      };

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto rounded-2xl bg-slate-900 border ${borderMap[tone] || borderMap.emerald} text-white px-4 py-3 shadow-2xl flex items-start gap-3`;
      toast.innerHTML = `
        <div class="mt-0.5 text-emerald-400 shrink-0">
          <i data-lucide="${iconMap[tone] || 'radio'}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-extrabold uppercase tracking-wide text-emerald-400">${escapeHtml(title)}</p>
          <p class="text-xs text-slate-200 mt-0.5 leading-relaxed">${escapeHtml(message)}</p>
        </div>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.24s ease';
        setTimeout(() => toast.remove(), 250);
      }, 4400);
    }

                                cleared ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-amber-200 text-amber-950 border border-amber-400'
                              }">
                                ${cleared ? 'Funds Cleared (Verified)' : 'Pending Proof (Open)'}
                              </span>
                            </div>
                            ${canSeeBuyer && !isCarSold(car) ? `
                              <button type="button" onclick="releaseReservation('${car.id}')" class="text-[11px] font-bold underline ${cleared ? 'text-rose-700' : 'text-amber-900'} shrink-0">Release</button>
                            ` : ''}
                          </div>

                          ${canSeeBuyer ? `
                            <p class="text-[11px] ${cleared ? 'text-rose-900' : 'text-amber-950'}">
                              Buyer: <strong>${escapeHtml(car.reservation.buyerName)}</strong> &bull; Deposit: <strong>${formatPHP(car.reservation.depositAmount)}</strong>
                            </p>
                            <p class="text-[11px] font-bold text-slate-800 flex items-center gap-1">
                              <i data-lucide="phone" class="w-3 h-3"></i>
                              <span>${escapeHtml(car.reservation.buyerPhone)}</span>
                            </p>
                            <div class="flex flex-wrap items-center justify-between gap-2 text-[11px]">
                              <span class="font-mono font-bold text-slate-800 bg-white/85 px-2 py-0.5 rounded border border-slate-200">
                                ${escapeHtml(car.reservation.paymentChannel)} &bull; Ref #${escapeHtml(car.reservation.referenceNo)}
                              </span>
                              ${car.reservation.receiptProof ? `
                                <button type="button" onclick="openReceiptLightboxModal('reservation', '${car.id}')" class="font-extrabold text-indigo-700 hover:underline flex items-center gap-1">
                                  <i data-lucide="file-image" class="w-3 h-3"></i>
                                  <span>View Receipt</span>
                                </button>
                              ` : ''}
                            </div>
                          ` : `
                            <p class="text-[11px] ${cleared ? 'text-rose-800' : 'text-amber-900'} flex items-center gap-1">
                              <i data-lucide="eye-off" class="w-3 h-3 shrink-0"></i>
                              <span>${cleared ? 'Unit locked by verified deposit • Buyer phone & details private' : 'Deposit proof awaiting leadership verification • Viewings remain open'}</span>
                            </p>
                          `}

                          ${leadership && !isCarSold(car) ? `
                            <div class="pt-1.5 border-t ${cleared ? 'border-rose-200' : 'border-amber-200'} flex items-center justify-between gap-2">
                              <span class="text-[10px] font-bold text-slate-600">
                                ${cleared ? `Verified by ${escapeHtml(car.reservation.verifiedBy || 'Leadership')}` : 'Verify receipt to lock competing holds:'}
                              </span>
                              <button
                                type="button"
                                onclick="toggleReservationPaymentVerification('${car.id}')"
                                class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition flex items-center gap-1 ${
                                  cleared ? 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100' : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                }"
                              >
                                <i data-lucide="${cleared ? 'rotate-ccw' : 'shield-check'}" class="w-3 h-3"></i>
                                <span>${cleared ? 'Revert Pending' : 'Verify: Funds Cleared'}</span>
                              </button>
                            </div>
                          ` : ''}
                        </div>
                      `;
                    })() : ''}

                    <!-- Today's Viewings Strip -->
                    ${!isCarSold(car) && todayBookings.length > 0 ? `
                      <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-[11px]">
                        <div class="flex items-center justify-between mb-1">
                          <span class="font-bold text-slate-700">Today's Viewings (${todayBookings.length})</span>
                          <button type="button" onclick="openCalendarForCar('${car.id}')" class="text-emerald-700 font-bold hover:underline">Calendar &rarr;</button>
                        </div>
                        <div class="flex flex-wrap gap-1">
                          ${todayBookings.map(bk => {
                            const holder = getUserRecord(bk.agentId);
                            return `
                              <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700 font-semibold">
                                ${bk.slot} &bull; ${bk.agentId === user.id ? 'You' : escapeHtml(holder.name.split(' ')[0])}
                              </span>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>

                  <!-- Card Footer Actions -->
                  ${isCarSold(car) ? (() => {
                    const saleRecord = state.sales.find(s => s.carId === car.id);
                    const closer = getUserRecord(car.soldByAgentId || saleRecord?.agentId);
                    const fixedFee = saleRecord?.sourcingBonus ?? scoutBonus;
                    return `
                      <div class="p-3 rounded-xl bg-slate-900 text-white text-xs space-y-1">
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-extrabold text-emerald-400 flex items-center gap-1.5">
                            <i data-lucide="badge-check" class="w-4 h-4 shrink-0"></i>
                            <span>Sold by ${escapeHtml(closer.name)}</span>
                          </span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                            ${escapeHtml(car.soldAt || saleRecord?.date || 'Closed')}
                          </span>
                        </div>
                        ${scoutAgent ? `
                          <p class="text-[11px] text-indigo-300 font-semibold">
                            Sourced by ${escapeHtml(scoutAgent.name)} ${fixedFee > 0 ? `(+${formatPHP(fixedFee)} Fixed Finder's Fee)` : ''}
                          </p>
                        ` : ''}
                      </div>
                    `;
                  })() : priorityLockedForMe ? `
                    <div class="text-center text-[11px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-xl py-2 px-3">
                      48h Scout Priority Window &bull; Reserved for ${escapeHtml(scoutAgent?.name || 'Scouting Agent')}
                    </div>
                  ` : (() => {
                    const canSold = canUserMarkCarSold(car, user);
                    return `
                      <div>
                        <div class="grid grid-cols-3 gap-1.5">
                          <button
                            type="button"
                            onclick="openBookViewingModal('${car.id}')"
                            ${!bookable ? 'disabled' : ''}
                            class="px-2 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                              bookable ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-2xs' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            }"
                          >
                            <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                            <span>Book</span>
                          </button>
                          <button
                            type="button"
                            onclick="openReserveCarModal('${car.id}')"
                            ${reserveDisabled ? 'disabled' : ''}
                            class="px-2 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                              !reserveDisabled ? 'bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            }"
                          >
                            <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                            <span>Reserve</span>
                          </button>
                          <button
                            type="button"
                            onclick="openMarkSoldModal('${car.id}')"
                            ${!canSold ? 'disabled' : ''}
                            class="px-2 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${
                              canSold ? 'bg-slate-900 hover:bg-slate-800 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                            }"
                          >
                            <i data-lucide="${canSold ? 'badge-check' : 'lock'}" class="w-3.5 h-3.5 ${canSold ? 'text-emerald-400' : 'text-slate-400'}"></i>
                            <span>Sold</span>
                          </button>
                        </div>
                        ${!canSold && !leadership ? `
                          <p class="text-[10px] text-slate-500 text-center mt-1.5">
                            Book a viewing or place a deposit under your name to unlock Sold
                          </p>
                        ` : ''}
                      </div>
                    `;
                  })()}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 6. VIEW 2: UNDER PREP (OWNER / CO-OWNER / ADMIN)
    // =========================================================================
    function renderUnderPrepView() {
      const user = getCurrentUser();
      if (!isLeadership(user)) {
        state.activeTab = 'inventory';
        return renderInventoryView();
      }

      const prepCars = state.cars.filter(c => isCarInPreparation(c));
      const intakeCars = prepCars.filter(c => c.status === 'Get the Car (Intake)');
      const reconCars = prepCars.filter(c => c.status === 'Reconditioning / PMS');
      const detailCars = prepCars.filter(c => c.status === 'Detailing');

      const totalBuyIn = prepCars.reduce((s, c) => s + (Number(c.acquisitionPrice) || 0), 0);
      const totalRecon = prepCars.reduce((s, c) => s + getCarReconTotal(c), 0);
      const totalTargetFloor = prepCars.reduce((s, c) => s + (Number(c.basePrice) || 0), 0);

      const filteredPrep = prepCars.filter(c => {
        if (state.prepFilter === 'INTAKE') return c.status === 'Get the Car (Intake)';
        if (state.prepFilter === 'RECON') return c.status === 'Reconditioning / PMS';
        if (state.prepFilter === 'DETAILING') return c.status === 'Detailing';
        return true;
      });

      const prepFlow = ['Get the Car (Intake)', 'Reconditioning / PMS', 'Detailing'];

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[11px] font-extrabold mb-1">
              <i data-lucide="shield-alert" class="w-3 h-3"></i> Leadership Bay (Owner / Co-owner / Admin Only)
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">Under Preparation — Intake, Reconditioning &amp; Detailing</h2>
            <p class="text-xs text-slate-500">Log Buy-In Cost, Recon/PMS expenses, Profit Buffer, and adjust the fixed ₱3,000–₱10,000 Finder’s Fee before releasing to Live Inventory.</p>
          </div>
          <button
            type="button"
            onclick="openAddCarModal()"
            class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs transition"
          >
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>+ New Vehicle Intake</span>
          </button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Units In Prep</span>
            <p class="text-2xl font-black text-slate-900 mt-1">${prepCars.length}</p>
            <p class="text-[11px] text-amber-700 font-semibold mt-0.5">${intakeCars.length} Intake &bull; ${reconCars.length} Recon &bull; ${detailCars.length} Detail</p>
          </div>
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Unit Buy-In</span>
            <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(totalBuyIn)}</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Acquisition capital</p>
          </div>
          <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Recon &amp; Detailing Spend</span>
            <p class="text-2xl font-black text-amber-700 mt-1">${formatPHP(totalRecon)}</p>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Rolled into Base Floor Price</p>
          </div>
          <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-2xs">
            <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">Projected Showroom Value</span>
            <p class="text-2xl font-black mt-1">${formatPHP(totalTargetFloor)}</p>
            <p class="text-[11px] text-slate-300 font-medium mt-0.5">Ready upon release</p>
          </div>
        </div>

        <div class="flex items-center gap-2 mb-5 overflow-x-auto pb-1">
          ${[
            { id: 'ALL', label: `All In Prep (${prepCars.length})` },
            { id: 'INTAKE', label: `1. Get the Car (Intake) (${intakeCars.length})` },
            { id: 'RECON', label: `2. Reconditioning / PMS (${reconCars.length})` },
            { id: 'DETAILING', label: `3. Detailing (${detailCars.length})` }
          ].map(pill => `
            <button
              type="button"
              onclick="setPrepFilter('${pill.id}')"
              class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                state.prepFilter === pill.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
              }"
            >
              ${pill.label}
            </button>
          `).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          ${filteredPrep.map(car => {
            const photos = getCarPhotos(car);
            const stageMeta = getStageMeta(car.status);
            const reconTotal = getCarReconTotal(car);
            const totalInvested = getCarTotalInvested(car);
            const scoutAgent = car.sourcedByAgentId ? getUserRecord(car.sourcedByAgentId) : null;
            const scoutBonus = scoutAgent ? getCarFindersFeeAmount(car) : 0;

            const estProfitPatong = car.basePrice - totalInvested - scoutBonus;
            const estProfitComm = Math.round(car.basePrice * (1 - state.commissionRate / 100)) - totalInvested - scoutBonus;

            const idx = prepFlow.indexOf(car.status);
            const nextStageLabel = idx >= 0 && idx < prepFlow.length - 1 ? prepFlow[idx + 1] : 'Ready for Release';

            return `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden flex flex-col">
                <div class="relative h-40 bg-slate-900 overflow-hidden">
                  <img src="${photos[0].url}" alt="${escapeHtml(car.model)}" class="w-full h-full object-cover" />
                  <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/20 to-transparent"></div>
                  <div class="absolute top-2.5 left-2.5 flex flex-wrap items-center gap-1.5">
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold border ${stageMeta.badgeClass}">
                      ${escapeHtml(car.status)}
                    </span>
                    ${scoutAgent ? `
                      <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-indigo-600 text-white">
                        Sourced: ${escapeHtml(scoutAgent.name)} (${formatPHP(scoutBonus)})
                      </span>
                    ` : ''}
                  </div>
                  <div class="absolute bottom-2.5 left-3 right-3 flex items-end justify-between gap-2">
                    <div>
                      <p class="text-[11px] font-bold uppercase tracking-wider text-amber-300">${car.year} &bull; ${escapeHtml(car.plateNo)} &bull; ${escapeHtml(car.mileage)}</p>
                      <h3 class="text-base font-extrabold text-white">${escapeHtml(car.make)} ${escapeHtml(car.model)}</h3>
                    </div>
                    <button
                      type="button"
                      onclick="advanceCarPrepStage('${car.id}')"
                      class="px-3 py-1.5 rounded-xl text-xs font-extrabold shadow-sm transition flex items-center gap-1 ${
                        nextStageLabel === 'Ready for Release'
                          ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                          : 'bg-amber-400 hover:bg-amber-300 text-slate-950'
                      }"
                    >
                      <span>${nextStageLabel === 'Ready for Release' ? 'Release to Showroom' : `Advance: ${nextStageLabel}`}</span>
                      <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>

                <div class="p-4 sm:p-5 space-y-3.5 bg-slate-50/70 flex-1">
                  <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                      <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Unit Buy-In (₱)</label>
                      <input
                        type="number"
                        min="0"
                        step="1000"
                        value="${car.acquisitionPrice}"
                        onchange="updateCarBuyInInline('${car.id}', this.value)"
                        class="w-full text-xs font-extrabold text-slate-900 border border-slate-200 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                    <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                      <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Profit Buffer (₱)</label>
                      <input
                        type="number"
                        min="0"
                        step="1000"
                        value="${car.targetMargin}"
                        onchange="updateCarMarginInline('${car.id}', this.value)"
                        class="w-full text-xs font-extrabold text-slate-900 border border-slate-200 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                    <div class="bg-slate-900 text-white p-2.5 rounded-xl flex flex-col justify-between">
                      <span class="text-[10px] font-bold text-emerald-400 uppercase block">Base Floor Price</span>
                      <span class="text-sm font-black">${formatPHP(car.basePrice)}</span>
                    </div>
                  </div>

                  ${scoutAgent && state.sourcingIncentive?.enabled ? `
                    <div class="p-3 rounded-xl bg-indigo-50 border border-indigo-200 space-y-1.5">
                      <div class="flex items-center justify-between text-xs">
                        <div>
                          <span class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-700 block">
                            Fixed Sourced Car Finder’s Fee (${escapeHtml(getPriceTierLabel(car.basePrice))})
                          </span>
                          <span class="font-bold text-indigo-950">${escapeHtml(scoutAgent.name)}</span>
                        </div>
                        <div class="text-right">
                          <span class="text-sm font-black text-indigo-700">${formatPHP(scoutBonus)}</span>
                          ${car.finderFeeAutoScaled === false ? `
                            <button type="button" onclick="resetCarFindersAutoScale('${car.id}')" class="block ml-auto text-[10px] font-bold text-indigo-600 underline">
                              Reset Auto-Tier
                            </button>
                          ` : ''}
                        </div>
                      </div>
                      <div class="flex items-center gap-2.5">
                        <span class="text-[10px] font-extrabold text-indigo-700">₱3,000</span>
                        <input
                          type="range"
                          min="3000"
                          max="10000"
                          step="500"
                          value="${scoutBonus}"
                          onchange="updateCarFindersAmount('${car.id}', this.value)"
                          class="flex-1 accent-indigo-600 cursor-pointer h-1.5"
                        />
                        <span class="text-[10px] font-extrabold text-indigo-700">₱10,000</span>
                      </div>
                    </div>
                  ` : ''}

                  <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div>
                      <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-800 block">
                        Est. Net Profit (Patong Deal)
                      </span>
                      <span class="text-base font-black ${estProfitPatong >= 0 ? 'text-emerald-700' : 'text-rose-600'}">
                        ${formatPHP(estProfitPatong)}
                      </span>
                      ${scoutAgent && scoutBonus > 0 ? `
                        <span class="block text-[10px] font-bold text-indigo-700">
                          Includes -${formatPHP(scoutBonus)} Fixed Finder's Fee (${escapeHtml(scoutAgent.name)})
                        </span>
                      ` : ''}
                    </div>
                    <div class="text-right">
                      <span class="text-[10px] font-bold text-slate-600 block">If sold @ ${Number(state.commissionRate).toFixed(1)}% Comm</span>
                      <span class="text-xs font-extrabold ${estProfitComm >= 0 ? 'text-slate-900' : 'text-rose-600'}">
                        ${formatPHP(estProfitComm)} net
                      </span>
                    </div>
                  </div>

                  <form onsubmit="submitInlineReconExpense(event, '${car.id}')" class="grid grid-cols-1 sm:grid-cols-12 gap-1.5">
                    <select name="category" class="sm:col-span-4 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] font-bold">
                      ${RECON_CATEGORIES.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('')}
                    </select>
                    <input type="text" name="note" required placeholder="Expense note (e.g., Exterior buff)" class="sm:col-span-4 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px]" />
                    <input type="number" name="amount" required min="100" step="100" placeholder="PHP ₱" class="sm:col-span-2 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-[11px] font-bold" />
                    <button type="submit" class="sm:col-span-2 px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-extrabold">
                      + Add
                    </button>
                  </form>

                  <div class="bg-white rounded-xl border border-slate-200 px-3 py-2">
                    <div class="flex items-center justify-between text-[11px] font-bold text-slate-600 mb-1">
                      <span>Itemized Recon &amp; Detailing (${(car.reconExpenses || []).length})</span>
                      <span class="text-amber-800">Total: +${formatPHP(reconTotal)}</span>
                    </div>
                    ${(car.reconExpenses || []).length === 0 ? `
                      <p class="text-[11px] text-slate-400 italic py-1">No recon or detailing expenses logged yet.</p>
                    ` : `
                      <div class="divide-y divide-slate-100 max-h-28 overflow-y-auto">
                        ${car.reconExpenses.map(exp => `
                          <div class="py-1.5 flex items-center justify-between gap-2 text-[11px]">
                            <div class="truncate">
                              <strong class="text-slate-800">${escapeHtml(exp.category)}:</strong>
                              <span class="text-slate-600">${escapeHtml(exp.note)}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                              <span class="font-extrabold text-amber-800">+${formatPHP(exp.amount)}</span>
                              <button type="button" onclick="deleteReconExpense('${car.id}', '${exp.id}')" class="text-slate-400 hover:text-rose-600">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                              </button>
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    `}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 7. VIEW 3: VIEWING CALENDAR (3-DAY CONFLICT-FREE GRID)
    // =========================================================================
    function renderCalendarView() {
      const user = getCurrentUser();
      const leadership = isLeadership(user);
      const showroomCars = state.cars.filter(c => !isCarSold(c) && !isCarInPreparation(c));

      if (!showroomCars.some(c => c.id === state.calendarCarId) && showroomCars.length > 0) {
        state.calendarCarId = showroomCars[0].id;
      }

      const selectedCar = showroomCars.find(c => c.id === state.calendarCarId) || showroomCars[0];
      const rollingDays = [getDateOffsetStr(0), getDateOffsetStr(1), getDateOffsetStr(2)];
      const priorityLockedForMe = selectedCar ? hasActivePriorityLock(selectedCar, user) : false;
      const scoutAgent = selectedCar?.sourcedByAgentId ? getUserRecord(selectedCar.sourcedByAgentId) : null;
      const scoutBonus = scoutAgent ? getCarFindersFeeAmount(selectedCar) : 0;

      return `

    // =========================================================================
    // 9. VIEW 5: SALES & PAYOUTS + CSV EXPORT
    // =========================================================================
    function renderSalesView() {
      const user = getCurrentUser();
      const leadership = isLeadership(user);

      const userRelevantSales = leadership
        ? state.sales
        : state.sales.filter(s => s.agentId === user.id || s.sourcedByAgentId === user.id);

      const visibleSales = userRelevantSales.filter(s => {
        if (state.salesFilter === 'SOURCED') return Boolean(s.sourcedByAgentId && (Number(s.sourcingBonus) || 0) > 0);
        if (state.salesFilter === 'SPLIT') return Boolean(s.sourcedByAgentId && s.sourcedByAgentId !== s.agentId && (Number(s.sourcingBonus) || 0) > 0);
        return true;
      });

      const grossDealershipRevenue = state.sales.reduce((sum, s) => sum + (Number(s.finalSellingPrice) || 0), 0);
      const totalClosingPayoutsAll = state.sales.reduce((sum, s) => sum + (Number(s.agentPayout) || 0), 0);
      const totalFinderIncentivesAll = state.sales.reduce((sum, s) => sum + (Number(s.sourcingBonus) || 0), 0);
      const totalCombinedAgentPayoutsAll = totalClosingPayoutsAll + totalFinderIncentivesAll;

      const totalVerifiedNetProfit = state.sales.reduce((sum, s) => {
        const selling = Number(s.finalSellingPrice) || 0;
        const unitCost = Number(s.unitCostSnapshot) || Number(s.basePriceSnapshot) || 0;
        const closingPay = Number(s.agentPayout) || 0;
        const finderPay = Number(s.sourcingBonus) || 0;
        return sum + (selling - unitCost - closingPay - finderPay);
      }, 0);

      const activeLotCapital = state.cars
        .filter(c => !isCarSold(c))
        .reduce((sum, c) => sum + getCarTotalInvested(c), 0);

      const myClosingDeals = state.sales.filter(s => s.agentId === user.id);
      const mySourcedDeals = state.sales.filter(s => s.sourcedByAgentId === user.id && (Number(s.sourcingBonus) || 0) > 0);
      const myClosingEarned = myClosingDeals.reduce((sum, s) => sum + (Number(s.agentPayout) || 0), 0);
      const myFinderEarned = mySourcedDeals.reduce((sum, s) => sum + (Number(s.sourcingBonus) || 0), 0);
      const myCombinedPayout = myClosingEarned + myFinderEarned;

      const myReleasedPayout =
        myClosingDeals.filter(s => s.closingPayoutReleased).reduce((sum, s) => sum + (Number(s.agentPayout) || 0), 0) +
        mySourcedDeals.filter(s => s.sourcingBonusReleased).reduce((sum, s) => sum + (Number(s.sourcingBonus) || 0), 0);
      const myPendingReleasePayout = myCombinedPayout - myReleasedPayout;

      const partnerAgents = Object.values(state.agents).filter(u => u.tier === 'AGENT');
      const agentBreakdownRows = partnerAgents.map(agent => {
        const closedDeals = state.sales.filter(s => s.agentId === agent.id);
        const sourcedDeals = state.sales.filter(s => s.sourcedByAgentId === agent.id && (Number(s.sourcingBonus) || 0) > 0);

        const closingEarned = closedDeals.reduce((sum, s) => sum + (Number(s.agentPayout) || 0), 0);
        const finderEarned = sourcedDeals.reduce((sum, s) => sum + (Number(s.sourcingBonus) || 0), 0);
        const combinedTotal = closingEarned + finderEarned;

        const allReleased =
          closedDeals.every(s => s.closingPayoutReleased) &&
          sourcedDeals.every(s => s.sourcingBonusReleased) &&
          combinedTotal > 0;

        return {
          ...agent,
          closedDeals,
          sourcedDeals,
          closedCount: closedDeals.length,
          sourcedCount: sourcedDeals.length,
          closingEarned,
          finderEarned,
          combinedTotal,
          allReleased
        };
      }).sort((a, b) => b.combinedTotal - a.combinedTotal);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">
              ${leadership ? 'Sales Ledger, Agent Payouts & Fixed Finder’s Fees (₱3k – ₱10k)' : 'My Closing Commissions & Sourced Car Finder’s Fees'}
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
              Itemizes Closing Deal Payouts (Patong or ${Number(state.commissionRate).toFixed(1)}% Comm) alongside Fixed Sourced Car Finder’s Incentives (₱3,000–₱10,000).
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <span class="px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-900 text-xs font-bold">
              Finder’s Scale: ${escapeHtml(getSourcingRuleLabel())}
            </span>
            <button
              type="button"
              onclick="exportSalesLedgerCSV()"
              class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5 shadow-2xs transition"
            >
              <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>Export CSV</span>
            </button>
          </div>
        </div>

        ${leadership ? `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Gross Revenue</span>
              <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(grossDealershipRevenue)}</p>
              <p class="text-[11px] text-slate-500 font-medium mt-0.5">${state.sales.length} closed vehicle(s)</p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-emerald-200 shadow-2xs">
              <span class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider">Verified Net Profit</span>
              <p class="text-2xl font-black text-emerald-700 mt-1">${formatPHP(totalVerifiedNetProfit)}</p>
              <p class="text-[11px] text-slate-500 font-medium mt-0.5">After Buy-In, Recon &amp; Finder’s Fees</p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-indigo-200 shadow-2xs">
              <span class="text-[11px] font-bold text-indigo-700 uppercase tracking-wider">Total Agent Payouts</span>
              <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(totalCombinedAgentPayoutsAll)}</p>
              <p class="text-[11px] text-indigo-700 font-semibold mt-0.5">
                Closing: ${formatPHP(totalClosingPayoutsAll)} + Finder’s: ${formatPHP(totalFinderIncentivesAll)}
              </p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Active Lot Capital</span>
              <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(activeLotCapital)}</p>
              <p class="text-[11px] text-slate-500 font-medium mt-0.5">Showroom + Under Prep cost</p>
            </div>
          </div>
        ` : `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Closing Deals Earned</span>
              <p class="text-2xl font-black text-slate-900 mt-1">${formatPHP(myClosingEarned)}</p>
              <p class="text-[11px] text-slate-500 font-medium mt-0.5">${myClosingDeals.length} deal(s) closed by you</p>
            </div>

    function updateCarFindersAmount(carId, newAmount) {
      if (!isLeadership(getCurrentUser())) return;
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const clamped = clampFindersAmount(newAmount);
      car.finderFeeAmount = clamped;
      car.finderFeeAutoScaled = false;
      saveState();
      renderApp();
      emitLiveEvent(
        'Fixed Finder’s Fee Adjusted',
        `${car.year} ${car.make} ${car.model} set to ${formatPHP(clamped)}.`,
        'indigo'
      );
    }

    function resetCarFindersAutoScale(carId) {
      if (!isLeadership(getCurrentUser())) return;
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.finderFeeAutoScaled = true;
      car.finderFeeAmount = getAutoTieredFindersAmount(car.basePrice);
      saveState();
      renderApp();
      emitLiveEvent('Auto-Tier Restored', `${car.year} ${car.make} ${car.model} synced to ${formatPHP(car.finderFeeAmount)}.`, 'indigo');
    }

    function updateLeadFindersAmount(leadId, newAmount) {
      if (!isLeadership(getCurrentUser())) return;
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      const clamped = clampFindersAmount(newAmount);
      lead.finderFeeAmount = clamped;
      saveState();
      renderApp();
      emitLiveEvent(
        'Lead Finder’s Fee Adjusted',
        `${lead.makeModel} set to ${formatPHP(clamped)} fixed fee.`,
        'indigo'
      );
    }

    function updateSubmitLeadFeePreview(autoTierFromPrice = false) {
      const form = document.getElementById('submit-lead-form');
      const labelEl = document.getElementById('submit-lead-fee-preview');
      if (!form || !labelEl) return;

      if (autoTierFromPrice && form.finderFeeAmount) {
        form.finderFeeAmount.value = getAutoTieredFindersAmount(floor) || 6000;

      labelEl.textContent = `${formatPHP(fee)} (${getPriceTierLabel(floor)})`;
    }

    function handleReceiptFileUpload(fileInput, hiddenInputId, previewBoxId) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        const hiddenEl = document.getElementById(hiddenInputId);
        const previewEl = document.getElementById(previewBoxId);
        if (hiddenEl) hiddenEl.value = dataUrl;
        if (previewEl) {
          previewEl.innerHTML = `
            <div class="mt-2 flex items-center gap-3 p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
              <img src="${dataUrl}" alt="Receipt" class="w-12 h-14 object-cover rounded-lg border border-emerald-300 shrink-0" />
              <div class="text-xs">
                <p class="font-extrabold text-emerald-950">Receipt Attached: ${escapeHtml(file.name)}</p>
                <p class="text-[11px] text-emerald-700">Ready for duplicate check &amp; verification</p>
              </div>
            </div>
          `;
        }
      };
      reader.readAsDataURL(file);
    }

    function generateSampleReceiptForForm(formPrefix, defaultAmount) {
      const form = document.getElementById(`${formPrefix}-form`);
      if (!form) return;
      const channel = form.paymentChannel?.value || 'GCash';
      let refNo = normalizePaymentRef(form.referenceNo?.value);
      if (!refNo) {
        refNo = (channel === 'GCash' ? '901' : channel === 'Maya' ? 'MYA' : 'IPY') + Math.floor(1000000000 + Math.random() * 9000000000);
        if (form.referenceNo) {
          form.referenceNo.value = refNo;
          checkLiveReferenceDuplicate(form.referenceNo, `${formPrefix}-ref-feedback`, form.dataset.carId || null);
        }
      }
      const amt = Number(form.depositAmount?.value || form.finalSellingPrice?.value || defaultAmount) || defaultAmount;
      const buyer = form.buyerName?.value?.trim() || 'Verified Buyer';
      const pngDataUrl = generateCanvasReceiptPNG(channel, refNo, amt, buyer);

      const hiddenEl = document.getElementById(`${formPrefix}-receipt-data`);
      const previewEl = document.getElementById(`${formPrefix}-receipt-preview`);
      if (hiddenEl) hiddenEl.value = pngDataUrl;
      if (previewEl) {
        previewEl.innerHTML = `
          <div class="mt-2 flex items-center gap-3 p-2.5 rounded-xl bg-sky-50 border border-sky-200">
            <img src="${pngDataUrl}" alt="Sample E-Receipt" class="w-12 h-14 object-cover rounded-lg border border-sky-300 shrink-0" />
            <div class="text-xs">
              <p class="font-extrabold text-sky-950">Sample ${escapeHtml(channel)} E-Receipt Generated</p>
              <p class="text-[11px] text-sky-700 font-mono">Ref #${escapeHtml(refNo)} &bull; ${formatPHP(amt)}</p>
            </div>
          </div>
        `;
      }
    }

    function updateSoldModalPayoutPreview(carId) {
      const form = document.getElementById('sold-form');
      const box = document.getElementById('sold-payout-preview');
      const car = state.cars.find(c => c.id === carId);
      if (!form || !box || !car) return;

      const closerId = form.agentId.value;
      const closer = getUserRecord(closerId);
      const model = form.payoutModel.value;
      const finalPrice = Math.max(car.basePrice, Number(form.finalSellingPrice.value) || car.basePrice);

      const closingPayout = model === 'MARKUP'
        ? Math.max(0, finalPrice - car.basePrice)
        : Math.round(finalPrice * (Number(state.commissionRate) / 100));

      const scout = car.sourcedByAgentId ? getUserRecord(car.sourcedByAgentId) : null;
      const finderBonus = scout && state.sourcingIncentive?.enabled
        ? clampFindersAmount(form.finderFeeAmount?.value ?? getCarFindersFeeAmount(car))
        : 0;

      const badgeEl = document.getElementById('sold-modal-finder-badge');
      if (badgeEl && scout) {
        badgeEl.textContent = `${formatPHP(finderBonus)} Fixed Fee`;
      }

      const leadership = isLeadership(getCurrentUser());
      const netProfit = finalPrice - getCarTotalInvested(car) - closingPayout - finderBonus;

      box.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-slate-300">Closing Agent Payout (${escapeHtml(closer.name)}):</span>
          <strong class="text-emerald-400 text-sm">${formatPHP(closingPayout)}</strong>
        </div>
        ${scout && finderBonus > 0 ? `
          <div class="flex items-center justify-between text-indigo-300 pt-1 border-t border-slate-800">
            <span>Fixed Sourced Car Finder’s Fee (${escapeHtml(scout.name)}):</span>
            <strong class="text-indigo-300 text-sm">+${formatPHP(finderBonus)}</strong>
          </div>
          <p class="text-[10px] text-slate-400">
            ${scout.id === closer.id
              ? `Combined Total for ${escapeHtml(closer.name)}: ${formatPHP(closingPayout + finderBonus)}`
              : `Split Payout: ${escapeHtml(scout.name)} receives Fixed Finder’s Fee &amp; ${escapeHtml(closer.name)} receives Closing Payout.`}
          </p>
        ` : ''}
        ${leadership ? `
          <div class="flex items-center justify-between text-slate-300 pt-1 border-t border-slate-800">
            <span>Dealership Verified Net Profit:</span>
            <strong class="${netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${formatPHP(netProfit)}</strong>
          </div>
        ` : ''}
      `;
    }

    function submitBookViewing(event, carId) {
      event.preventDefault();
      const form = event.target;
      const date = form.date.value;
      const slot = form.slot.value;
      const buyerName = form.buyerName.value.trim();
      const buyerPhone = form.buyerPhone.value.trim();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);

      if (!car || !isCarBookable(car)) {
        emitLiveEvent('Booking Blocked', 'This unit is currently unavailable.', 'rose');
        closeModal();
        return;
      }

      if (hasActivePriorityLock(car, user)) {
        emitLiveEvent('48h Scout Priority Lock', 'This unit is currently protected under the scouting agent’s 48-hour window.', 'amber');
        closeModal();
        return;
      }

      const conflict = state.bookings.find(b => b.carId === carId && b.date === date && b.slot === slot && b.status === 'CONFIRMED');
      if (conflict) {
        emitLiveEvent('Slot Conflict Blocked', `${slot} on ${formatDisplayDate(date)} is already locked.`, 'rose');
        closeModal();
        return;
      }

      state.bookings.push({
        id: 'bk_' + Date.now(),
        carId,
        agentId: user.id,
        date,
        slot,
        buyerName,
        buyerPhone,
        status: 'CONFIRMED'
      });

      if (car.status === 'Ready for Release') {
        car.status = 'Under Viewing';
      }

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Viewing Slot Locked', `${user.name} locked ${car.year} ${car.make} ${car.model} (${formatDisplayDate(date)} @ ${slot}).`, 'emerald');
    }

    function cancelBooking(bookingId) {
      const idx = state.bookings.findIndex(b => b.id === bookingId);
      if (idx === -1) return;
      const booking = state.bookings[idx];
      const car = state.cars.find(c => c.id === booking.carId);
      state.bookings.splice(idx, 1);

      if (car && !car.reservation && !isCarSold(car)) {
        const hasMore = state.bookings.some(b => b.carId === car.id && b.status === 'CONFIRMED');
        if (!hasMore && car.status === 'Under Viewing') car.status = 'Ready for Release';
      }

      saveState();
      renderApp();
      emitLiveEvent('Viewing Slot Released', `${booking.slot} on ${formatDisplayDate(booking.date)} is now open.`, 'amber');
    }

    function submitReserveCar(event, carId) {
      event.preventDefault();
      const form = event.target;
      const buyerName = form.buyerName.value.trim();
      const buyerPhone = form.buyerPhone.value.trim();
      const depositAmount = Math.max(1000, Number(form.depositAmount.value) || 25000);
      const paymentChannel = form.paymentChannel.value;
      const referenceNo = normalizePaymentRef(form.referenceNo.value);
      const receiptProof = form.receiptProof.value || '';
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);

      if (!car || car.reservation || isCarSold(car)) {
        emitLiveEvent('Already Reserved', 'This vehicle already has an active reservation.', 'rose');
        closeModal();
        return;
      }

      const duplicate = findDuplicatePaymentReference(referenceNo, carId);
      if (duplicate) {
        emitLiveEvent('Duplicate Reference # Blocked', `Ref #${referenceNo} was already submitted on ${duplicate.unit}.`, 'rose');

          : `${user.name} uploaded ${paymentChannel} Ref #${referenceNo}. Awaiting Leadership "Funds Cleared" verification.`,
        autoVerified ? 'rose' : 'amber'

    function submitMarkSold(event, carId) {
      event.preventDefault();
      const form = event.target;
      const car = state.cars.find(c => c.id === carId);
      const currentUser = getCurrentUser();
      if (!car || !canUserMarkCarSold(car, currentUser)) return;

      const closerId = form.agentId.value;
      const buyerName = form.buyerName.value.trim();
      const payoutModel = form.payoutModel.value;
      const finalSellingPrice = Math.max(car.basePrice, Number(form.finalSellingPrice.value) || car.basePrice);
      const paymentChannel = form.paymentChannel.value;
      const referenceNo = normalizePaymentRef(form.referenceNo.value);
      const receiptProof = form.receiptProof.value || '';

      const duplicate = findDuplicatePaymentReference(referenceNo, carId);
      if (duplicate) {
        emitLiveEvent('Duplicate Reference # Blocked', `Ref #${referenceNo} was already submitted on ${duplicate.unit}.`, 'rose');
        return;
      }

      const closingPayout = payoutModel === 'MARKUP'
        ? Math.max(0, finalSellingPrice - car.basePrice)
        : Math.round(finalSellingPrice * (Number(state.commissionRate) / 100));

      const scoutId = car.sourcedByAgentId || null;
      const finderBonus = scoutId && state.sourcingIncentive?.enabled
        ? clampFindersAmount(form.finderFeeAmount?.value ?? getCarFindersFeeAmount(car))
        : 0;

      const today = getDateOffsetStr(0);
      car.status = 'Sold';
      car.soldAt = today;
      car.soldByAgentId = closerId;
      car.finderFeeAmount = finderBonus;
      car.reservation = null;

      state.bookings = state.bookings.filter(b => b.carId !== car.id);

      state.sales.unshift({
        id: 'sale_' + Date.now(),
        carId: car.id,
        carTitle: `${car.year} ${car.make} ${car.model}`,
        buyerName,
        agentId: closerId,
        sourcedByAgentId: scoutId,
        sourcingPriceBasis: car.basePrice,
        sourcingTierLabel: getPriceTierLabel(car.basePrice),
        sourcingBonus: finderBonus,
        sourcingBonusReleased: false,
        payoutModel,
        basePriceSnapshot: car.basePrice,
        unitCostSnapshot: getCarTotalInvested(car),
        finalSellingPrice,
        agentMarkup: payoutModel === 'MARKUP' ? closingPayout : 0,
        commissionRateApplied: payoutModel === 'COMMISSION' ? state.commissionRate : null,
        agentPayout: closingPayout,
        closingPayoutReleased: false,
        paymentChannel,
        referenceNo,
        receiptProof,
        paymentVerified: isLeadership(currentUser),
        verifiedBy: isLeadership(currentUser) ? currentUser.name : null,
        date: today,
        notes: 'Closed via AutoBook Dealership Desk.'
      });

      saveState();
      closeModal();
      state.activeTab = 'sales';
      renderApp();

      const closerName = getUserRecord(closerId).name;
      const scoutMsg = scoutId && finderBonus > 0
        ? ` + ${formatPHP(finderBonus)} Fixed Finder's Fee credited to ${getUserRecord(scoutId).name}.`
        : '.';
      emitLiveEvent(
        'Deal Closed & Payouts Credited!',
        `${car.year} ${car.make} ${car.model} sold by ${closerName} (${formatPHP(closingPayout)})${scoutMsg}`,
        'emerald'
      );
    }
