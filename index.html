<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Condensed:wght@500;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--brand-font)', 'Inter', '-apple-system', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: 'var(--brand-50)',
              100: 'var(--brand-100)',
              200: 'var(--brand-200)',
              300: 'var(--brand-300)',
              400: 'var(--brand-400)',
              500: 'var(--brand-500)',
              600: 'var(--brand-600)',
              700: 'var(--brand-700)',
              800: 'var(--brand-700)',

      color: #0f172a;
      -webkit-tap-highlight-color: transparent;

    }

      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideInRight {

        opacity: 0;
        transform: translateX(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }

  <script>
    // =========================================================================
    // AUTOBOOK v2.0 — STATE, SEED DATA & MULTI-TENANT DEALERSHIP STORE
    // =========================================================================

    const STORAGE_KEY = 'autobook_v2_ph_state_v8';

    // Curated Dealership White-Label Theme Presets & Fonts
    const BRAND_THEMES = {
      emerald: {
        name: 'Emerald Executive (Default)',
        c50: '#ecfdf5', c100: '#d1fae5', c200: '#a7f3d0', c300: '#6ee7b7',
        c400: '#34d399', c500: '#10b981', c600: '#059669', c700: '#047857',
        onPrimary: '#ffffff'
      },
      cobalt: {
        name: 'Midnight Cobalt Blue',
        c50: '#eff6ff', c100: '#dbeafe', c200: '#bfdbfe', c300: '#93c5fd',
        c400: '#60a5fa', c500: '#3b82f6', c600: '#2563eb', c700: '#1d4ed8',
        onPrimary: '#ffffff'
      },
      crimson: {
        name: 'Crimson Performance Red',
        c50: '#fff1f2', c100: '#ffe4e6', c200: '#fecdd3', c300: '#fda4af',
        c400: '#fb7185', c500: '#f43f5e', c600: '#e11d48', c700: '#be123c',
        onPrimary: '#ffffff'
      },
      amber: {
        name: 'Luxury Gold & Amber',
        c50: '#fffbeb', c100: '#fef3c7', c200: '#fde68a', c300: '#fcd34d',
        c400: '#fbbf24', c500: '#f59e0b', c600: '#d97706', c700: '#b45309',
        onPrimary: '#ffffff'
      },
      violet: {
        name: 'Royal Violet Prestige',
        c50: '#f5f3ff', c100: '#ede9fe', c200: '#ddd6fe', c300: '#c4b5fd',
        c400: '#a78bfa', c500: '#8b5cf6', c600: '#7c3aed', c700: '#6d28d9',
        onPrimary: '#ffffff'
      }
    };

    const BRAND_FONTS = {
      inter: { label: 'Inter (Clean Modern SaaS)', family: 'Inter' },
      jakarta: { label: 'Plus Jakarta Sans (Geometric)', family: 'Plus Jakarta Sans' },
      condensed: { label: 'Roboto Condensed (Automotive)', family: 'Roboto Condensed' }
    };

    function getDefaultBranding() {
      return {
        dealershipName: 'Magief Cars',
        tagline: 'Trece Martires Cavite',
        logoUrl: '',
        themeKey: 'emerald',
        customHex: '#0f766e',
        fontKey: 'inter'
      };
    }

    function normalizeHexColor(hex) {
      if (!hex || typeof hex !== 'string') return '#0f766e';
      let clean = hex.trim();
      if (!clean.startsWith('#')) clean = '#' + clean;
      if (/^#[0-9a-fA-F]{3}$/.test(clean)) {
        clean = '#' + clean[1] + clean[1] + clean[2] + clean[2] + clean[3] + clean[3];
      }
      return /^#[0-9a-fA-F]{6}$/.test(clean) ? clean.toLowerCase() : '#0f766e';
    }

    function hexToRgb(hex) {
      const h = normalizeHexColor(hex).slice(1);
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16)
      };
    }

    function mixRgb(rgb1, rgb2, weight) {
      const w = Math.max(0, Math.min(1, weight));
      const r = Math.round(rgb1.r * (1 - w) + rgb2.r * w);
      const g = Math.round(rgb1.g * (1 - w) + rgb2.g * w);
      const b = Math.round(rgb1.b * (1 - w) + rgb2.b * w);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function buildCustomThemeFromHex(hex) {
      const base = hexToRgb(hex);
      const white = { r: 255, g: 255, b: 255 };
      const black = { r: 15, g: 23, b: 42 };
      const luminance = (0.299 * base.r + 0.587 * base.g + 0.114 * base.b) / 255;
      return {
        name: 'Custom Brand Color',
        c50: mixRgb(base, white, 0.92),
        c100: mixRgb(base, white, 0.82),
        c200: mixRgb(base, white, 0.65),
        c300: mixRgb(base, white, 0.45),
        c400: mixRgb(base, white, 0.22),
        c500: mixRgb(base, white, 0.08),
        c600: normalizeHexColor(hex),
        c700: mixRgb(base, black, 0.24),
        onPrimary: luminance > 0.62 ? '#0f172a' : '#ffffff'
      };
    }

    function applyDealershipBranding() {
      const b = (state && state.branding) ? state.branding : getDefaultBranding();
      const theme = b.themeKey === 'custom'
        ? buildCustomThemeFromHex(b.customHex || '#0f766e')
        : (BRAND_THEMES[b.themeKey] || BRAND_THEMES.emerald);
      const font = BRAND_FONTS[b.fontKey] || BRAND_FONTS.inter;

      const rootEl = document.documentElement;
      rootEl.style.setProperty('--brand-font', `'${font.family}'`);
      rootEl.style.setProperty('--brand-50', theme.c50);
      rootEl.style.setProperty('--brand-100', theme.c100);
      rootEl.style.setProperty('--brand-200', theme.c200);
      rootEl.style.setProperty('--brand-300', theme.c300);
      rootEl.style.setProperty('--brand-400', theme.c400);
      rootEl.style.setProperty('--brand-500', theme.c500);
      rootEl.style.setProperty('--brand-600', theme.c600);
      rootEl.style.setProperty('--brand-700', theme.c700);
      rootEl.style.setProperty('--brand-on-primary', theme.onPrimary || '#ffffff');

      const nameEl = document.getElementById('header-dealership-name');
      const tagEl = document.getElementById('header-dealership-tagline');
      const logoBox = document.getElementById('header-brand-logo-box');

      if (nameEl) nameEl.textContent = b.dealershipName || 'Magief Cars';
      if (tagEl) tagEl.textContent = b.tagline || 'Trece Martires Cavite';
      if (logoBox) {
        if (b.logoUrl) {
          logoBox.innerHTML = `<img src="${b.logoUrl}" alt="${b.dealershipName}" class="w-full h-full object-cover" />`;
        } else {
          logoBox.innerHTML = `<i data-lucide="car-front" class="w-5 h-5"></i>`;
        }
      }
      document.title = `${b.dealershipName || 'AutoBook'} — Dealership & Agent Portal`;
    }

    // 9-Point Used Car Screening Checklist (Owner Intake & Agent Sourcing)
    const CHECKLIST_ITEMS = [
      { id: 'orcr_docs', group: 'Legal & LTO Verification', label: 'Original OR/CR On-Hand & Verified', shortLabel: 'Orig OR/CR' },
      { id: 'no_lto_alarm', group: 'Legal & LTO Verification', label: 'Clean LTO / HPG Status (No Alarm / Encumbrance)', shortLabel: 'Clean LTO/HPG' },
      { id: 'open_deed_ids', group: 'Legal & LTO Verification', label: 'Signed Open Deed of Sale + 2 Valid IDs w/ 3 Specimens', shortLabel: 'Deed & IDs' },
      { id: 'not_flooded', group: 'Structural & Mechanical Integrity', label: 'Guaranteed Not Flooded (No Silt / Rust / Waterline)', shortLabel: 'Not Flooded' },
      { id: 'no_major_accident', group: 'Structural & Mechanical Integrity', label: 'No Major Collision / Intact Chassis & Airbags', shortLabel: 'No Accident' },
      { id: 'odo_not_tampered', group: 'Structural & Mechanical Integrity', label: 'Verified Original Odometer (Not Tampered)', shortLabel: 'Orig Odometer' },
      { id: 'cold_ac_engine', group: 'Condition, History & Completeness', label: 'Cold A/C & Healthy Engine / Transmission', shortLabel: 'Cold A/C & Engine' },
      { id: 'fresh_paint_interior', group: 'Condition, History & Completeness', label: 'Fresh Exterior Paint & Clean Interior', shortLabel: 'Fresh Paint & Interior' },
      { id: 'spare_jack_keys', group: 'Condition, History & Completeness', label: 'Complete Spare Tire, Jack & 2 Original Keys', shortLabel: 'Spare, Jack & 2 Keys' }
    ];

    // Default Dealership Users & Roles (Magief Cars — Trece Martires, Cavite)
    const DEFAULT_USERS = {
      owner_rv: { id: 'owner_rv', name: 'Rv Santiago III', role: 'OWNER', label: 'Owner', isFounder: true, phone: '0917-100-0001', active: true, joinedAt: 'Founder' },
      coowner_ryan: { id: 'coowner_ryan', name: 'Ryan Paolo Santiago', role: 'OWNER', label: 'Co-owner', isFounder: false, phone: '0917-100-0002', active: true, joinedAt: 'Co-Founder' },
      admin_rico: { id: 'admin_rico', name: 'Rico Donato', role: 'OWNER', label: 'Admin', isFounder: false, phone: '0917-200-1101', active: true, joinedAt: 'Oct 10' },
      admin_marc: { id: 'admin_marc', name: 'Marc Jamero', role: 'OWNER', label: 'Admin', isFounder: false, phone: '0917-200-1102', active: true, joinedAt: 'Oct 12' },
      agent_jester: { id: 'agent_jester', name: 'Jester Cabiltes', role: 'AGENT', label: 'Agent', isFounder: false, phone: '0917-234-8812', active: true, joinedAt: 'Oct 15' },
      agent_paul: { id: 'agent_paul', name: 'Paul Collante', role: 'AGENT', label: 'Agent', isFounder: false, phone: '0918-902-4410', active: true, joinedAt: 'Oct 20' }
    };

    function getUserRecord(userId) {
      if (typeof state !== 'undefined' && state && state.agents && state.agents[userId]) {
        return state.agents[userId];
      }
      return DEFAULT_USERS[userId] || { id: userId, name: 'Agent', role: 'AGENT', label: 'Agent', active: true };
    }

    // Date, Time & Currency Helpers
    function formatPHP(amount) {
      if (amount === null || amount === undefined || isNaN(amount)) return '₱0';
      return '₱' + Number(amount).toLocaleString('en-PH', { maximumFractionDigits: 0 });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getDateOffsetStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      if (dateStr === today) return `Today (${dateStr})`;
      if (dateStr === tomorrow) return `Tomorrow (${dateStr})`;
      return dateStr;
    }

    function getDaysBetween(startDateStr, endDateStr = getDateOffsetStr(0)) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr + 'T00:00:00');
      const end = new Date(endDateStr + 'T00:00:00');
      const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24));
      return Math.max(0, diffDays);
    }

    function getCarDaysOnLot(car) {
      const end = car.status === 'Sold' && car.soldAt ? car.soldAt : getDateOffsetStr(0);
      return getDaysBetween(car.listedAt || getDateOffsetStr(-5), end);
    }

    // Generate crisp SVG Data-URI vehicle preview cards (works offline, never breaks)
    function makeCarSamplePhoto(title, subtitle, bgHex, accentHex, badgeText) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bgHex}"/>
            <stop offset="100%" stop-color="#020617"/>
          </linearGradient>
        </defs>
        <rect width="800" height="500" fill="url(#g)"/>
        <circle cx="680" cy="110" r="180" fill="${accentHex}" fill-opacity="0.14"/>
        <circle cx="140" cy="430" r="160" fill="${accentHex}" fill-opacity="0.10"/>
        <g transform="translate(215, 130)" fill="none" stroke="${accentHex}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M35 125 L75 55 C85 38 102 30 122 30 L248 30 C268 30 285 38 295 55 L335 125 Z" fill="${accentHex}" fill-opacity="0.12"/>

    // Compress uploaded image files via HTML5 Canvas so localStorage stays fast & mobile-friendly
    function compressImageFile(file, maxWidth = 900, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      const container = document.getElementById('toast-container');
      const colors = {

        amber: 'bg-slate-900 border-amber-500/60 text-white',

        amber: 'bg-amber-400',
        rose: 'bg-rose-400',
        indigo: 'bg-indigo-400'
      };

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto rounded-2xl border p-3.5 shadow-2xl ${colors[tone] || colors.emerald}`;
      toast.innerHTML = `
        <div class="flex items-start gap-2.5">
          <span class="w-2 h-2 rounded-full mt-1.5 shrink-0 ${dotColors[tone] || dotColors.emerald}"></span>

            <div class="text-xs font-bold tracking-tight flex items-center justify-between gap-2">
              <span>${title}</span>
              <span class="text-[10px] font-normal text-slate-400">Live Sync</span>
            </div>
            <p class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">${message}</p>
          </div>
        </div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(1rem)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 4200);
    }

    function isPriorityLockActive(car) {
      return car.priorityLockUntil && Date.now() < car.priorityLockUntil;
    }

    function getPriorityLockRemainingText(car) {
      if (!isPriorityLockActive(car)) return '';
      const diffMs = car.priorityLockUntil - Date.now();
      const hrs = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      return `${hrs}h ${mins}m left`;
    }

    function canUserBookCar(car, user) {
      if (car.status === 'Sold' || car.status === 'Reserved') return false;
      if (user.role === 'OWNER') return true;
      if (isPriorityLockActive(car) && car.sourcedByAgentId !== user.id) {
        return false;
      }
      return true;
    }

    // =========================================================================
    // VIEW 2: REAL-TIME VIEWING CALENDAR (CONFLICT-FREE SLOT LOCKING)
    // =========================================================================

    function renderCalendarView(user) {
      const selectedCar = state.cars.find(c => c.id === state.calendarCarId) || state.cars[0];
      const today = getDateOffsetStr(0);
      const tomorrow = getDateOffsetStr(1);
      const dayAfter = getDateOffsetStr(2);
      const dates = [today, tomorrow, dayAfter];

      const dayBookings = state.bookings.filter(
        b => b.carId === selectedCar.id && b.date === state.calendarDateFilter && b.status === 'CONFIRMED'
      );

      const priorityLockedForMe = isPriorityLockActive(selectedCar) &&
        user.role === 'AGENT' &&
        selectedCar.sourcedByAgentId !== user.id;

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Conflict-Free Viewing Calendar</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                Real-time slot locks prevent double-booked buyer viewings on the same vehicle.
              </p>
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-2 rounded-xl">
              <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
              <span>Atomic Slot Lock Active (1 Agent per Vehicle Slot)</span>
            </div>
          </div>

          <!-- Vehicle & Date Selector -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
            <div class="lg:col-span-6">
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Select Vehicle</label>
              <select
                onchange="setCalendarCar(this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm font-bold text-slate-900 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                ${state.cars.map(c => `
                  <option value="${c.id}" ${c.id === selectedCar.id ? 'selected' : ''}>
                    ${c.year} ${c.make} ${c.model} — [${c.status}]
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="lg:col-span-6">
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Select Viewing Date</label>
              <div class="grid grid-cols-3 gap-2">
                ${dates.map(d => {
                  const active = state.calendarDateFilter === d;
                  return `
                    <button
                      onclick="setCalendarDate('${d}')"
                      class="py-2.5 px-3 rounded-xl text-xs font-bold border transition ${
                        active
                          ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                          : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                      }">
                      ${formatDisplayDate(d).split(' ')[0]}
                      <span class="block text-[10px] font-normal opacity-75">${d}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Slot Grid -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
              <div>
                <h2 class="text-base font-extrabold text-slate-900">
                  ${selectedCar.year} ${selectedCar.make} ${selectedCar.model}
                </h2>
                <p class="text-xs text-slate-500">${selectedCar.location} • Base: ${formatPHP(selectedCar.basePrice)}</p>
              </div>
              <div>${getStatusBadgeHTML(selectedCar.status)}</div>
            </div>

            ${selectedCar.status === 'Reserved' || selectedCar.status === 'Sold' ? `
              <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-900 font-medium">
                This vehicle is currently <strong>${selectedCar.status}</strong>. New viewing slots are automatically paused until released or relisted.
              </div>
            ` : ''}

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${TIME_SLOTS.map(slot => {
                const existing = dayBookings.find(b => b.slot === slot);
                if (existing) {
                  const holder = getUserRecord(existing.agentId);
                  const isMine = existing.agentId === user.id;
                  const canCancel = isMine || user.role === 'OWNER';

                  return `
                    <div class="p-4 rounded-2xl border-2 ${isMine ? 'border-emerald-500 bg-emerald-50/40' : 'border-amber-300 bg-amber-50/50'} flex flex-col justify-between space-y-3">
                      <div>
                        <div class="flex items-center justify-between">
                          <span class="text-sm font-extrabold text-slate-900">${slot}</span>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${isMine ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-slate-950'}">
                            ${isMine ? 'Your Lock' : 'Booked'}
                          </span>
                        </div>
                        <div class="mt-2 text-xs font-bold text-slate-800">
                          Agent: ${holder?.name || 'Agent'}
                        </div>
                        <div class="text-[11px] text-slate-600 mt-0.5">
                          Buyer: ${isMine || user.role === 'OWNER' ? `${existing.buyerName} (${existing.buyerPhone})` : '•••••• (Masked for Privacy)'}
                        </div>
                        ${existing.notes && (isMine || user.role === 'OWNER') ? `
                          <div class="text-[11px] text-slate-500 mt-1 italic">"${existing.notes}"</div>

                      </div>

                      ${canCancel ? `
                        <button
                          onclick="cancelBooking('${existing.id}')"
                          class="w-full py-2 rounded-xl bg-white hover:bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold transition">
                          Release / Cancel Slot
                        </button>
                      ` : `
                        <div class="w-full py-2 text-center rounded-xl bg-amber-100/70 text-amber-800 text-[11px] font-bold">
                          Locked by Another Agent
                        </div>
                      `}
                    </div>
                  `;
                }

                const disabled = selectedCar.status === 'Reserved' || selectedCar.status === 'Sold' || priorityLockedForMe;

                return `
                  <div class="p-4 rounded-2xl border border-slate-200 hover:border-emerald-400 bg-slate-50/50 flex flex-col justify-between space-y-3 transition">
                    <div>
                      <div class="flex items-center justify-between">
                        <span class="text-sm font-extrabold text-slate-900">${slot}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Open Slot</span>
                      </div>
                      <p class="text-[11px] text-slate-500 mt-2">
                        Available for immediate client viewing &amp; test drive at the dealership lot.
                      </p>
                    </div>

                    <button
                      onclick="openBookingModal('${selectedCar.id}', '${state.calendarDateFilter}', '${slot}')"
                      ${disabled ? 'disabled' : ''}
                      class="w-full py-2.5 rounded-xl text-xs font-bold transition ${
                        disabled
                          ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                          : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
                      }">
                      ${priorityLockedForMe ? '48h Priority Locked' : '+ Lock This Slot'}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 3: SALES LEDGER & PHILIPPINE COMMISSION / PATONG PAYOUTS
    // =========================================================================

    function renderSalesView(user) {
      const pendingSales = state.sales.filter(s => s.status === 'PENDING');
      const approvedSales = state.sales.filter(s => s.status === 'APPROVED');

      const totalFloorRemitted = approvedSales.reduce((acc, s) => acc + s.basePriceSnapshot, 0);
      const totalCommissionPaid = approvedSales.reduce((acc, s) => acc + s.calculatedPayout, 0);
      const mySales = state.sales.filter(s => s.agentId === user.id);

      // Owner Analytics & Turnover BI Calculations
      const soldCars = state.cars.filter(c => c.status === 'Sold');
      const activeCars = state.cars.filter(c => c.status !== 'Sold');
      const avgSoldTurnoverDays = soldCars.length > 0
        ? Math.round(soldCars.reduce((sum, c) => sum + getCarDaysOnLot(c), 0) / soldCars.length)
        : 0;
      const avgActiveLotDays = activeCars.length > 0
        ? Math.round(activeCars.reduce((sum, c) => sum + getCarDaysOnLot(c), 0) / activeCars.length)
        : 0;

      const totalConfirmedViewings = state.bookings.filter(b => b.status === 'CONFIRMED').length;
      const conversionDenominator = Math.max(1, totalConfirmedViewings + approvedSales.length);
      const viewingConversionRate = Math.round((approvedSales.length / conversionDenominator) * 100);

      // Agent Performance Leaderboard (Units Sold, Floor Volume, Viewings, Leads)
      const leaderboard = Object.values(state.agents)
        .filter(u => u.role === 'AGENT' || state.sales.some(s => s.agentId === u.id))
        .map(agent => {
          const agentApproved = approvedSales.filter(s => s.agentId === agent.id);
          const agentPending = pendingSales.filter(s => s.agentId === agent.id);
          const agentBookings = state.bookings.filter(b => b.agentId === agent.id && b.status === 'CONFIRMED');
          const agentLeads = state.leads.filter(l => l.agentId === agent.id && l.status === 'ACQUIRED');
          const floorVolume = agentApproved.reduce((sum, s) => sum + s.basePriceSnapshot, 0);
          return {
            agent,
            soldCount: agentApproved.length,
            pendingCount: agentPending.length,
            floorVolume,
            bookingsCount: agentBookings.length,
            acquiredLeadsCount: agentLeads.length
          };
        })
        .sort((a, b) => (b.soldCount - a.soldCount) || (b.floorVolume - a.floorVolume) || (b.bookingsCount - a.bookingsCount));

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Sales Ledger, Turnover BI &amp; Payouts</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">

    let activeGalleryState = { type: 'car', id: '', index: 0 };

    function openGalleryModal(type, id, startIndex = 0) {
      const item = type === 'car'
        ? state.cars.find(c => c.id === id)
        : state.leads.find(l => l.id === id);
      if (!item) return;

      const photos = (item.photos && item.photos.length > 0)
        ? item.photos
        : [{ label: 'Unit Photo', url: makeCarSamplePhoto(item.model || item.makeModel, item.color || item.location || '', '#0f172a', '#10b981', 'UNIT PHOTO') }];

      activeGalleryState = {
        type,
        id,
        index: Math.max(0, Math.min(startIndex, photos.length - 1))
      };

      const title = type === 'car' ? `${item.year} ${item.make} ${item.model}` : item.makeModel;
      const current = photos[activeGalleryState.index];
      const user = getCurrentUser();
      const isLockedApproved = type === 'car' ? item.status === 'Sold' : item.status === 'ACQUIRED';
      const canEditPhotos = user.role === 'OWNER' && !isLockedApproved;

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
          <div class="max-w-4xl w-full bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col">
            <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between gap-3 text-white">
              <div>
                <h3 class="text-sm sm:text-base font-extrabold">${title}</h3>
                <p class="text-xs text-slate-400">
                  Photo ${activeGalleryState.index + 1} of ${photos.length} • <span class="text-emerald-400 font-semibold">${current.label || 'Vehicle Angle'}</span>
                </p>
              </div>

    function stepGallery(delta) {
      const item = activeGalleryState.type === 'car'
        ? state.cars.find(c => c.id === activeGalleryState.id)
        : state.leads.find(l => l.id === activeGalleryState.id);
      if (!item || !item.photos || item.photos.length === 0) return;
      const total = item.photos.length;
      const nextIdx = (activeGalleryState.index + delta + total) % total;
      openGalleryModal(activeGalleryState.type, activeGalleryState.id, nextIdx);
    }

    function renderEditPhotosGrid() {
      const grid = document.getElementById('edit-photos-preview-grid');
      if (!grid) return;
      if (editingPhotosDraft.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-6 text-center text-xs text-slate-400">No photos selected yet. Click <strong>+ Add Photos</strong> to upload.</div>`;
        return;
      }
      grid.innerHTML = editingPhotosDraft.map((p, idx) => `
        <div class="relative rounded-xl overflow-hidden border border-slate-200 bg-white shadow-sm">
          <img src="${p.url}" alt="${p.label}" class="w-full h-24 object-cover" />
          <div class="p-1.5 flex items-center justify-between gap-1 bg-white">

            <div class="flex items-center gap-1 shrink-0">
              ${idx > 0 ? `
                <button type="button" onclick="promoteDraftCoverPhoto(${idx})" title="Set as Cover Photo" class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 text-[9px] font-bold">
                  Cover
                </button>
              ` : ''}

                ✕
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleEditPhotosUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const angleLabels = ['Front 3/4 Exterior', 'Side Profile', 'Cabin & Dashboard', 'Odometer', 'Rear & Trunk', 'OR/CR & Engine'];
      for (const file of files) {
        if (editingPhotosDraft.length >= 6) break;
        try {
          const compressedUrl = await compressImageFile(file);
          editingPhotosDraft.push({
            label: angleLabels[editingPhotosDraft.length] || `Angle ${editingPhotosDraft.length + 1}`,
            url: compressedUrl
          });
        } catch (err) {
          console.warn('Photo compression failed:', err);
        }
      }
      renderEditPhotosGrid();
      event.target.value = '';
    }

    function promoteDraftCoverPhoto(idx) {
      if (idx <= 0 || idx >= editingPhotosDraft.length) return;
      const [chosen] = editingPhotosDraft.splice(idx, 1);
      editingPhotosDraft.unshift(chosen);
      renderEditPhotosGrid();
    }

    function removeDraftPhoto(idx) {
      editingPhotosDraft.splice(idx, 1);
      renderEditPhotosGrid();
    }

    function saveEditedPhotos(type, id) {
      const user = getCurrentUser();
      if (user.role !== 'OWNER') return;

      const item = type === 'car'
        ? state.cars.find(c => c.id === id)
        : state.leads.find(l => l.id === id);
      if (!item) return;

      const isLockedApproved = type === 'car' ? item.status === 'Sold' : item.status === 'ACQUIRED';
      if (isLockedApproved) {
        emitLiveEvent('Images Locked', 'Cannot save changes because this vehicle is already Sold/Approved.', 'amber');
        closeModal();
        return;
      }

      if (editingPhotosDraft.length === 0) {
        emitLiveEvent('At Least 1 Photo Required', 'Please keep or upload at least one vehicle photo before saving.', 'amber');
        return;
      }

      item.photos = JSON.parse(JSON.stringify(editingPhotosDraft));
      if (type === 'car') cardActivePhotoIndex[id] = 0;
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Vehicle Photos Updated',
        `${user.name} updated ${item.photos.length} photo(s) for ${type === 'car' ? `${item.year} ${item.make} ${item.model}` : item.makeModel}.`,
        'emerald'
      );
    }

    let pendingUploadPhotos = [];

    function renderUploadedPhotoGrid(containerId) {
      const el = document.getElementById(containerId);

      if (pendingUploadPhotos.length === 0) {

        </div>

    function removePendingUploadPhoto(idx, containerId) {
      pendingUploadPhotos.splice(idx, 1);

    async function handleMultiPhotoSelect(event, containerId) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const defaultLabels = ['Front 3/4 Exterior', 'Side Profile', 'Cabin & Dashboard', 'Odometer', 'Rear & Trunk', 'OR/CR & Engine'];
      for (const file of files) {
        if (pendingUploadPhotos.length >= 6) break;
        try {
          const dataUrl = await compressImageFile(file);
          const label = defaultLabels[pendingUploadPhotos.length] || `Angle ${pendingUploadPhotos.length + 1}`;
          pendingUploadPhotos.push({ label, url: dataUrl });
        } catch (err) {
          console.warn('Photo upload skipped:', err);
        }
      }
      renderUploadedPhotoGrid(containerId);
      event.target.value = '';
    }

    function exportSalesLedgerCSV() {
      const headers = ['Sale ID', 'Vehicle', 'Agent', 'Payout Structure', 'Base Price (PHP)', 'Reported Sale Price (PHP)', 'Agent Payout (PHP)', 'Status', 'Submitted At'];
      const rows = state.sales.map(s => {
        const agent = getUserRecord(s.agentId)?.name || s.agentId;
        const reported = s.payoutModel === 'MARKUP' ? 'Private (Patong)' : (s.reportedSalePrice || s.basePriceSnapshot);
        const payout = s.payoutModel === 'MARKUP' ? 'Private Patong' : s.calculatedPayout;
        return [s.id, s.carTitle, agent, s.payoutModel, s.basePriceSnapshot, reported, payout, s.status, s.submittedAt]
          .map(val => `"${String(val).replace(/"/g, '""')}"`)
          .join(',');
      });
      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', `magief-cars-ledger-${getDateOffsetStr(0)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      emitLiveEvent('CSV Ledger Exported', 'Downloaded dealership sales & payout ledger CSV.', 'emerald');
    }

        if (!state.branding) state.branding = getDefaultBranding();
        state.branding.logoUrl = logoDataUrl;
        saveState();
        applyDealershipBranding();
        openSettingsModal('branding');
        emitLiveEvent('Dealership Logo Uploaded', 'Updated custom company logo.', 'emerald');

        emitLiveEvent('Logo Upload Failed', 'Please choose a valid PNG or JPG image.', 'rose');

      openModal('accept-invite-modal', { token });
    }

    function submitAcceptInviteForm(event, token) {
      event.preventDefault();
      const invite = state.invites.find(i => i.token === token && i.status === 'ACTIVE');
      if (!invite) return;

      const fd = new FormData(event.target);
      const agentName = fd.get('agentName').trim();
      const agentPhone = fd.get('agentPhone').trim();
      const newAgentId = 'agent_' + Date.now();

      state.agents[newAgentId] = {
        id: newAgentId,
        name: agentName,
        role: 'AGENT',
        label: 'Agent',
        isFounder: false,
        phone: agentPhone,
        active: true,
        joinedAt: 'Just now'
      };

      invite.status = 'USED';
      invite.usedByName = agentName;
      state.currentUserId = newAgentId;

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('New Agent Activated', `${agentName} joined the dealership roster via single-use invite!`, 'emerald');
    }

    function toggleAgentAdminRole(agentId) {
      const member = state.agents[agentId];
      if (!member || member.isFounder || agentId === 'owner_rv') return;

      if (member.role === 'OWNER') {
        member.role = 'AGENT';
        member.label = 'Agent';
        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent(
          'Role Updated to Sales Agent',
          `${member.name} was changed back to Agent access.`,
          'amber'
        );
      } else {
        member.role = 'OWNER';
        member.label = 'Co-Owner / Admin';
        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent(
          'Promoted to Co-Owner / Admin',
          `${member.name} now has full Owner/Admin access (inventory, approvals, branding & team).`,
          'indigo'
        );
      }
    }

    function toggleAgentActiveStatus(agentId) {
      const member = state.agents[agentId];
      if (!member || member.isFounder || agentId === 'owner_rv') return;

      const willActivate = member.active === false;
      member.active = willActivate;

      if (!willActivate) {
        let releasedCount = 0;
        state.bookings.forEach(bk => {
          if (bk.agentId === agentId && bk.status === 'CONFIRMED') {
            bk.status = 'CANCELLED';
            releasedCount++;
          }
        });

        state.cars.forEach(c => {
          if (c.status === 'Under Viewing') {
            const hasRemaining = state.bookings.some(b => b.carId === c.id && b.status === 'CONFIRMED');
            if (!hasRemaining) c.status = 'Available';
          }
        });

        if (state.currentUserId === agentId) {
          state.currentUserId = 'owner_rv';
        }

        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent(
          'Agent Deactivated',
          `${member.name} deactivated${releasedCount > 0 ? ` and ${releasedCount} future viewing slot(s) released` : ''}. Past sales preserved.`,
          'rose'
        );
      } else {
        saveState();
        openModal('agents-modal');
        renderApp();
        emitLiveEvent('Agent Reactivated', `${member.name} restored to active dealership roster.`, 'emerald');
      }
    }

    function submitBookingForm(event, carId) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const date = fd.get('date');
      const slot = fd.get('slot');
      const buyerName = fd.get('buyerName');
      const buyerPhone = fd.get('buyerPhone');
      const notes = fd.get('notes');
      const user = getCurrentUser();

      // Atomic Slot Conflict Guard
      const conflict = state.bookings.find(
        b => b.carId === carId && b.date === date && b.slot === slot && b.status === 'CONFIRMED'
      );
      if (conflict) {
        const holder = getUserRecord(conflict.agentId);
        emitLiveEvent(
          'Slot Lock Rejected (Conflict)',
          `Already locked by ${holder?.name || 'another agent'} for ${date} at ${slot}.`,
          'rose'
        );
        return;
      }

      const car = state.cars.find(c => c.id === carId);
      state.bookings.push({
        id: 'bk_' + Date.now(),
        carId,
        agentId: user.id,
        buyerName,
        buyerPhone,
        date,
        slot,
        status: 'CONFIRMED',
        notes
      });

      if (car.status === 'Available') {
        car.status = 'Under Viewing';
      }

      state.calendarCarId = carId;
      state.calendarDateFilter = date;
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Viewing Slot Locked',
        `${user.name} locked ${car.year} ${car.make} ${car.model} on ${date} at ${slot}.`,
        'emerald'
      );
    }

    function cancelBooking(bookingId) {
      const idx = state.bookings.findIndex(b => b.id === bookingId);
      if (idx === -1) return;
      const bk = state.bookings[idx];
      const car = state.cars.find(c => c.id === bk.carId);
      state.bookings.splice(idx, 1);

      // Revert car to Available if no other confirmed bookings exist
      if (car && car.status === 'Under Viewing') {
        const remaining = state.bookings.some(b => b.carId === car.id && b.status === 'CONFIRMED');
        if (!remaining) car.status = 'Available';
      }

      saveState();
      renderApp();
      emitLiveEvent(
        'Viewing Slot Released',
        `${bk.slot} (${bk.date}) on ${car ? `${car.make} ${car.model}` : 'vehicle'} is open again.`,
        'amber'
      );
    }

    function submitReserveForm(event, carId) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const buyerName = fd.get('buyerName');
      const depositAmount = Number(fd.get('depositAmount'));
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);

      car.status = 'Reserved';
      car.reservation = {
        agentId: user.id,
        buyerName,
        depositAmount,
        reservedAt: 'Just now'
      };

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Unit Marked Reserved',
        `${car.year} ${car.make} ${car.model} locked by ${user.name} (${formatPHP(depositAmount)} deposit).`,
        'rose'
      );
    }

    function releaseReservation(carId) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.status = 'Available';
      car.reservation = null;
      saveState();
      renderApp();
      emitLiveEvent(
        'Reservation Released',
        `${car.year} ${car.make} ${car.model} is back on Available status.`,
        'emerald'
      );
    }

    function recalculateSalePreview() {
      const select = document.getElementById('sale-car-select');
      if (!select) return;
      const opt = select.options[select.selectedIndex];
      const base = Number(opt.dataset.base);
      const model = document.querySelector('input[name="payoutModel"]:checked')?.value || 'MARKUP';

      document.getElementById('sale-base-display').textContent = formatPHP(base);

      const sellingWrap = document.getElementById('sale-selling-price-wrap');
      const reportedInput = document.getElementById('sale-reported-price');
      if (Number(reportedInput.value) < base) {
        reportedInput.value = base;
      }

      const commAmount = base * (state.commissionRate / 100);
      document.getElementById('sale-comm-preview').textContent = formatPHP(commAmount);

      if (model === 'PERCENTAGE') {
        sellingWrap.classList.remove('hidden');
        const reported = Math.max(base, Number(reportedInput.value) || base);
        const payout = reported * (state.commissionRate / 100);
        document.getElementById('sale-final-payout').textContent = formatPHP(payout);
      } else {
        sellingWrap.classList.add('hidden');
      }
    }

    function submitSaleForm(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const carId = fd.get('carId');
      const payoutModel = fd.get('payoutModel');
      const car = state.cars.find(c => c.id === carId);
      const user = getCurrentUser();

      let reportedSalePrice = null;
      let commissionRateSnapshot = null;
      let calculatedPayout = 0;

      if (payoutModel === 'PERCENTAGE') {
        reportedSalePrice = Math.max(car.basePrice, Number(fd.get('reportedSalePrice')) || car.basePrice);
        commissionRateSnapshot = state.commissionRate;
        calculatedPayout = Math.round(reportedSalePrice * (state.commissionRate / 100));
      }

      state.sales.unshift({
        id: 'sale_' + Date.now(),
        carId: car.id,
        carTitle: `${car.year} ${car.make} ${car.model}`,
        agentId: user.id,
        payoutModel,
        basePriceSnapshot: car.basePrice,
        reportedSalePrice,
        commissionRateSnapshot,
        calculatedPayout,
        status: 'PENDING',
        submittedAt: 'Just now',
        approvedAt: null
      });

      saveState();
      closeModal();
      switchTab('sales');
      emitLiveEvent(
        'Sale Logged for Verification',
        `${user.name} submitted ${car.year} ${car.make} ${car.model} (${payoutModel}).`,
        'amber'
      );
    }

    function approveSale(saleId) {
      const sale = state.sales.find(s => s.id === saleId);
      if (!sale) return;
      sale.status = 'APPROVED';
      sale.approvedAt = 'Just now';

      const car = state.cars.find(c => c.id === sale.carId);
      if (car) {
        car.status = 'Sold';
        car.location = 'Released to Buyer';
        car.soldAt = getDateOffsetStr(0);
      }

      saveState();
      renderApp();
      emitLiveEvent(
        'Sale Verified & Unit Marked Sold',
        `${sale.carTitle} closed and inventory synced across all agents.`,
        'emerald'
      );
    }

    function updateCommissionRate(val) {
      const num = Math.min(3.0, Math.max(1.0, Number(val)));
      state.commissionRate = num;
      saveState();
      renderApp();
      emitLiveEvent(
        'Commission Rate Updated',
        `Dealership percentage commission set to ${num.toFixed(1)}%.`,
        'indigo'
      );
    }

    function submitAddCarForm(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const year = Number(fd.get('year'));
      const make = fd.get('make');
      const model = fd.get('model');
      const category = fd.get('category');
      const basePrice = Number(fd.get('basePrice'));
      const mileage = fd.get('mileage') || '25,000 km';
      const color = fd.get('color') || 'Silver Metallic';
      const checklist = extractChecklistFromForm(fd, 'addchk');
      const photos = pendingUploadPhotos.length > 0
        ? [...pendingUploadPhotos]
        : [
            { label: 'Front 3/4 Exterior', url: makeCarSamplePhoto(`${year} ${make} ${model}`, `${color} • Newly Listed Unit`, '#0f172a', '#10b981', 'FRONT 3/4 ANGLE') },
            { label: 'Interior & Odometer', url: makeCarSamplePhoto(`${year} ${make} ${model}`, `${mileage} • Verified 9-Point Inspection`, '#1e293b', '#38bdf8', 'INTERIOR & ODO') }
          ];

      state.cars.unshift({
        id: 'car_' + Date.now(),
        make,
        model,
        year,
        category,
        mileage,
        transmission: 'Automatic',
        fuel: 'Gasoline',
        plateEnding: '4 (Tuesday Coding)',
        color,
        basePrice,
        status: 'Available',
        location: 'Main Showroom • Magief Cars Trece Martires',
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        photos,
        checklist,
        sourcedByAgentId: null,
        priorityLockUntil: null,
        reservation: null
      });

      pendingUploadPhotos = [];
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'New Vehicle Published',
        `${year} ${make} ${model} (${formatPHP(basePrice)}) with ${photos.length} photo(s) is live.`,
        'emerald'
      );
    }

    function submitLeadForm(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const user = getCurrentUser();
      const checklist = extractChecklistFromForm(fd, 'leadchk');
      const makeModel = fd.get('makeModel');
      const location = fd.get('location');
      const photos = pendingUploadPhotos.length > 0
        ? [...pendingUploadPhotos]
        : [{ label: 'Seller Front 3/4', url: makeCarSamplePhoto(makeModel, `Sourced Lead • ${location}`, '#1e1b4b', '#818cf8', 'SCOUT PHOTO 1') }];

      state.leads.unshift({
        id: 'lead_' + Date.now(),
        agentId: user.id,
        makeModel,
        plateNo: fd.get('plateNo') || 'TBA',
        mileage: fd.get('mileage') || 'TBA',
        askingPrice: Number(fd.get('askingPrice')),
        sellerName: fd.get('sellerName'),
        sellerPhone: fd.get('sellerPhone'),
        location,
        notes: 'Submitted via Agent Sourcing Portal with 9-point pre-screen.',
        photos,
        checklist,
        status: 'PENDING',
        submittedAt: 'Just now'
      });

      pendingUploadPhotos = [];
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Off-Market Lead Submitted',
        `${user.name} submitted ${makeModel} with ${photos.length} photo(s) for dealership acquisition.`,
        'indigo'
      );
    }

    function setLeadStatus(leadId, status) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      lead.status = status;
      saveState();
      renderApp();
      emitLiveEvent(
        'Lead Stage Updated',
        `${lead.makeModel} moved to ${status}.`,
        status === 'REJECTED' ? 'rose' : 'amber'
      );
    }

    function acquireLeadToInventory(leadId) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      lead.status = 'ACQUIRED';

      const scout = getUserRecord(lead.agentId);
      const newCarId = 'car_' + Date.now();
      const acquiredPhotos = (lead.photos && lead.photos.length > 0)
        ? [...lead.photos]
        : [{ label: 'Front 3/4 Exterior', url: makeCarSamplePhoto(lead.makeModel, `Sourced by ${scout?.name || 'Agent'} • 48h Priority`, '#1e1b4b', '#818cf8', 'ACQUIRED UNIT') }];

      state.cars.unshift({
        id: newCarId,
        make: 'Sourced Unit',
        model: lead.makeModel,
        year: 2021,
        category: 'SUV / Pickup',
        mileage: lead.mileage,
        transmission: 'Automatic',
        fuel: 'Diesel',
        plateEnding: lead.plateNo,
        color: 'Verified Unit',
        basePrice: lead.askingPrice + 50000,
        status: 'Available',
        location: 'Newly Acquired • Bay 4 (Trece Martires)',
        listedAt: getDateOffsetStr(0),
        soldAt: null,
        photos: acquiredPhotos,
        checklist: lead.checklist || {
          orcr_docs: true, no_lto_alarm: true, open_deed_ids: true,
          not_flooded: true, no_major_accident: true, odo_not_tampered: true,
          cold_ac_engine: true, fresh_paint_interior: true, spare_jack_keys: true
        },
        sourcedByAgentId: lead.agentId,
        priorityLockUntil: Date.now() + (48 * 60 * 60 * 1000), // 48-hour Priority Window
        reservation: null
      });

      saveState();
      switchTab('inventory');
      emitLiveEvent(
        '48-Hour Priority Lock Activated!',
        `${lead.makeModel} added to Live Inventory. Exclusive selling priority granted to ${scout?.name || 'Agent'}.`,
        'indigo'
      );
    }

    // =========================================================================
    // MAIN RENDER & BOOTSTRAP
    // =========================================================================

    function renderRoleSwitcher() {
      const switcher = document.getElementById('role-switcher');
      if (!switcher) return;
      const activeMembers = Object.values(state.agents).filter(u => u.isFounder || u.active !== false);
      switcher.innerHTML = activeMembers.map(u => {
        const roleTag = u.isFounder ? 'Owner' : (u.label || (u.role === 'OWNER' ? 'Admin' : 'Agent'));
        return `
          <option value="${u.id}" ${u.id === state.currentUserId ? 'selected' : ''}>
            ${roleTag}: ${u.name}
          </option>
        `;
      }).join('');
    }

    function renderApp() {
      applyDealershipBranding();
      renderRoleSwitcher();
      const user = getCurrentUser();
      const root = document.getElementById('app-root');

      // Show/Hide Owner/Admin-only Settings & Team controls
      const settingsBtn = document.getElementById('owner-settings-btn');
      const manageBtn = document.getElementById('manage-agents-btn');
      if (settingsBtn) {
        if (user.role === 'OWNER') {
          settingsBtn.classList.remove('hidden');
          settingsBtn.classList.add('inline-flex');
        } else {
          settingsBtn.classList.add('hidden');
          settingsBtn.classList.remove('inline-flex');
        }
      }
      if (manageBtn) {
        if (user.role === 'OWNER') {
          manageBtn.classList.remove('hidden');
          manageBtn.classList.add('inline-flex');
        } else {
          manageBtn.classList.add('hidden');
          manageBtn.classList.remove('inline-flex');
        }
      }

      // Sync navigation active states (wide desktop + tablet sub-bar)
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = `nav-tab-btn px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 whitespace-nowrap ${
          active ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-800'
        }`;
      });

      document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = `mobile-tab-btn relative flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition ${
          active ? 'text-emerald-400 bg-slate-900' : 'text-slate-400 hover:text-white'
        }`;
      });

      // Update notification badges
      const pendingSalesCount = state.sales.filter(s => s.status === 'PENDING').length;
      const openLeadsCount = state.leads.filter(l => l.status === 'PENDING' || l.status === 'INSPECTING').length;

      ['nav-pending-badge', 'subnav-pending-badge', 'mobile-pending-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = pendingSalesCount;
        el.classList.toggle('hidden', pendingSalesCount === 0);
      });

      ['nav-leads-badge', 'subnav-leads-badge', 'mobile-leads-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = openLeadsCount;
        el.classList.toggle('hidden', openLeadsCount === 0);
      });

      // Render active workspace tab
      if (state.activeTab === 'inventory') {
        root.innerHTML = renderInventoryView(user);
      } else if (state.activeTab === 'calendar') {
        root.innerHTML = renderCalendarView(user);
      } else if (state.activeTab === 'sales') {
        root.innerHTML = renderSalesView(user);
      } else if (state.activeTab === 'sourcing') {
        root.innerHTML = renderSourcingView(user);
      }

      lucide.createIcons();
    }

    // Wire up static listeners on load
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-tab-btn, .mobile-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      const roleSelect = document.getElementById('role-switcher');
      roleSelect.addEventListener('change', (e) => {
        state.currentUserId = e.target.value;
        saveState();
        renderApp();
        const u = getCurrentUser();
        emitLiveEvent('Switched Workspace Role', `Viewing portal as ${u.name} (${u.label}).`, 'indigo');
      });

      // Check URL for single-use invite token (?invite=AB-XXXXXX)
      const urlParams = new URLSearchParams(window.location.search);
      const inviteToken = urlParams.get('invite');
      if (inviteToken) {
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
        setTimeout(() => openAcceptInviteModal(inviteToken), 200);
      }

      renderApp();
    });
  </script>
</body>
</html>
