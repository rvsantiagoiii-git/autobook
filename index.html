    // Helper: Format PHP Currency
    function formatPHP(amount) {
      const num = Number(amount) || 0;
      return '₱' + num.toLocaleString('en-PH', { maximumFractionDigits: 0 });
    }

    // Helper: Date string offset from today
    function getDateOffsetISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function getDateOffsetLabel(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', weekday: 'short' });
    }

    // Helper: Tiered Finder's Fee based on asking price
    function computeFindersFee(askingPrice) {
      const price = Number(askingPrice) || 0;
      if (price < 650000) return 3000;
      if (price < 1200000) return 6000;
      return 10000;
    }

    // Generate realistic GCash/Bank transfer receipt PNG on an offscreen HTML5 Canvas
    function generateSampleReceiptDataURL({ channel = 'GCash Express Send', amount = 20000, refNo = 'GC-9084712231', sender = 'Partner Agent / Buyer', receiver = 'MAGIEF CARS (0916-634-6726)', timestamp = 'Today, 02:14 PM' }) {

      canvas.width = 520;
      canvas.height = 700;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Top blue header bar
      ctx.fillStyle = channel.toLowerCase().includes('maya') ? '#059669' : '#0055ff';
      ctx.fillRect(0, 0, canvas.width, 150);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(channel, 260, 62);

      ctx.font = '600 15px Inter, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillText('VERIFIED ELECTRONIC TRANSFER SLIP', 260, 92);

      // White card body
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(34, 118, 452, 540, 20);
      ctx.fill();

      // Checkmark circle
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(260, 175, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(247, 175);
      ctx.lineTo(256, 184);
      ctx.lineTo(274, 166);
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.font = '800 20px Inter, sans-serif';
      ctx.fillText('Transfer Successful', 260, 228);

      ctx.fillStyle = '#64748b';
      ctx.font = '500 14px Inter, sans-serif';
      ctx.fillText(timestamp, 260, 252);

      // Amount box
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(58, 275, 404, 86);
      ctx.fillStyle = '#64748b';
      ctx.font = '700 12px Inter, sans-serif';
      ctx.fillText('AMOUNT TRANSFERRED', 260, 300);
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 34px Inter, sans-serif';
      ctx.fillText(formatPHP(amount), 260, 340);

      // Details rows
      const rows = [
        ['Recipient', receiver],
        ['Sender', sender],
        ['Reference No.', refNo],
        ['Settlement', 'InstaPay Real-Time'],
        ['Branch Tag', 'Trece Martires Cavite'],
      ];

      let y = 402;
      rows.forEach(([label, val]) => {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#64748b';
        ctx.font = '600 14px Inter, sans-serif';
        ctx.fillText(label, 62, y);

        ctx.textAlign = 'right';
        ctx.fillStyle = label === 'Reference No.' ? '#b45309' : '#0f172a';
        ctx.font = label === 'Reference No.' ? '800 15px monospace' : '700 14px Inter, sans-serif';
        ctx.fillText(val, 458, y);

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(62, y + 16);
        ctx.lineTo(458, y + 16);
        ctx.stroke();
        y += 46;
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 11px Inter, sans-serif';
      ctx.fillText('AutoBook v2.0 Anti-Fraud Audit Trail • Magief Cars', 260, 640);

      return canvas.toDataURL('image/png');
    }

    // Load state from localStorage or initialize cleanly
    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.users && parsed.cars && parsed.settings) {
            return parsed;
          }
        }
      } catch (err) {
        console.warn('Resetting corrupted state:', err);
      }
      const fresh = createInitialState();
      // Hydrate default receipt images so lightbox works right away
      hydrateDefaultReceipts(fresh);
      saveState(fresh);
      return fresh;
    }

    function hydrateDefaultReceipts(targetState) {
      const fort = targetState.cars.find(c => c.id === 'car_fortuner');
      if (fort && fort.reservation && !fort.reservation.receiptDataUrl) {
        fort.reservation.receiptDataUrl = generateSampleReceiptDataURL({
          channel: fort.reservation.channel,
          amount: fort.reservation.amount,
          refNo: fort.reservation.refNo,
          sender: 'Jester Cabiltes / Engr. Gabriel Santos',
          timestamp: fort.reservation.timestamp,
        });
      }
      const s1 = targetState.sales.find(s => s.id === 'sale_901');
      if (s1 && !s1.receiptDataUrl) {
        s1.receiptDataUrl = generateSampleReceiptDataURL({
          channel: 'BPI InstaPay Transfer',
          amount: s1.soldPrice,
          refNo: s1.refNo,
          sender: s1.buyerName,
          timestamp: 'Yesterday, 04:40 PM',
        });
      }
      const s2 = targetState.sales.find(s => s.id === 'sale_902');
      if (s2 && !s2.receiptDataUrl) {
        s2.receiptDataUrl = generateSampleReceiptDataURL({
          channel: 'GCash Bank Transfer',
          amount: s2.soldPrice,
          refNo: s2.refNo,
          sender: s2.buyerName,
          timestamp: '3 days ago, 01:15 PM',
        });
      }
    }

    function saveState(nextState = state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      } catch (err) {
        console.warn('Storage quota warning:', err);
      }
    }

    // Role & User Helpers
    function getCurrentUser() {
      return state.users.find(u => u.id === state.currentUserId) || state.users[0];
    }

    function getUserById(id) {
      return state.users.find(u => u.id === id);
    }

    function isOwnerOrCoOwner(user = getCurrentUser()) {
      return user.role === 'owner' || user.role === 'co_owner';
    }

    function isLeadership(user = getCurrentUser()) {
      return ['owner', 'co_owner', 'admin'].includes(user.role);
    }

    function formatRoleLabel(role) {
      if (role === 'owner') return 'Owner';
      if (role === 'co_owner') return 'Co-owner';
      if (role === 'admin') return 'Admin';
      return 'Agent';
    }

    // Financial Helpers for Vehicles
    function getCarReconTotal(car) {
      return (car.expenses || []).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
    }

    function getCarFloorPrice(car) {
      return (Number(car.acquisitionCost) || 0) + getCarReconTotal(car) + (Number(car.targetMargin) || 0);
    }

    // Anti-Fraud Global Reference Number Registry Check
    function findDuplicateReference(refNo) {
      const clean = String(refNo || '').trim().toUpperCase();
      if (!clean) return null;

      // Check active reservations
      for (const car of state.cars) {
        if (car.reservation && String(car.reservation.refNo).trim().toUpperCase() === clean) {
          return `Active Reservation on ${car.title} (${car.reservation.buyerName})`;
        }
        // Check recon expenses
        for (const exp of car.expenses || []) {
          if (String(exp.refNo).trim().toUpperCase() === clean) {
            return `Recon Expense on ${car.title} (${exp.desc})`;
          }
        }
      }

      // Check closed sales
      for (const sale of state.sales) {
        if (String(sale.refNo).trim().toUpperCase() === clean) {
          return `Closed Sale ${sale.id.toUpperCase()} (${sale.carTitle})`;
        }
      }
      return null;
    }

    // Non-blocking Toast Feedback
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors =
        type === 'error'
          ? 'bg-rose-950 border-rose-700 text-rose-100'
          : type === 'warning'
          ? 'bg-amber-950 border-amber-700 text-amber-100'
          : 'bg-slate-900 border-slate-700 text-white';

      toast.className = `pointer-events-auto border ${colors} px-4 py-3 rounded-xl shadow-2xl text-xs sm:text-sm font-medium flex items-center justify-between gap-3 transition-all duration-200`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white font-bold">✕</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4200);
    }

    function pushLiveEvent(msg) {
      const timeStr = new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
      const formatted = `[${timeStr}] ${msg}`;
      state.recentEvents.unshift(formatted);
      if (state.recentEvents.length > 10) state.recentEvents.pop();
      document.getElementById('live-ticker-message').textContent = formatted;
      saveState();
    }

      if (!tabs.some(t => t.id === state.activeView)) {
        state.activeView = isOwnerOrCoOwner(user) ? 'overview' : 'inventory';

      const navContainer = document.getElementById('main-nav-tabs');
      navContainer.innerHTML = tabs
        .map(tab => {

    function handleUserSwitch(userId) {
      state.currentUserId = userId;
      const user = getCurrentUser();
      if (!isOwnerOrCoOwner(user) && (state.activeView === 'overview' || state.activeView === 'settings')) {
        state.activeView = 'inventory';
      }
      if (!isLeadership(user) && state.activeView === 'under_prep') {
        state.activeView = 'inventory';
      }
      saveState();
      renderApp();
      showToast(`Switched active session to ${user.name} (${formatRoleLabel(user.role)})`);
    }

    function switchView(viewId) {
      state.activeView = viewId;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

          return sum + (Number(c.reservation.amount) || 0);

      }, 0);
      const pendingDepositsTotal = state.cars.reduce((sum, c) => {

                  Action Required — Pending Sign-Offs & Reviews

                <p class="text-xs text-slate-500">Verify incoming transfer receipts, recon expenses, and partner payouts.</p>

                pendingItems.length > 0 ? 'bg-amber-500 text-slate-950' : 'bg-emerald-100 text-emerald-800'

                ${pendingItems.length} Pending

            ${
              pendingItems.length === 0
                ? `<div class="p-8 text-center text-sm text-slate-500">
                    All deposits, recon receipts, and agent payouts are verified and up to date.
                  </div>`
                : `<div class="divide-y divide-slate-100">
                    ${pendingItems
                      .map(
                        item => `
                      <div class="p-4 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/80 transition">
                        <div class="space-y-1 min-w-0">
                          <div class="flex items-center gap-2 flex-wrap">
                            <span class="px-2 py-0.5 text-[11px] font-bold rounded-md border ${item.badgeColor}">
                              ${item.badge}
                            </span>
                            <span class="font-bold text-sm text-slate-900">${item.title}</span>
                          </div>
                          <p class="text-xs text-slate-500">${item.subtitle}</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          <button
                            onclick="${item.proofFn}"
                            class="px-3 py-2 rounded-xl border border-slate-300 hover:bg-slate-100 text-xs font-semibold text-slate-700 transition"
                          >
                            Inspect Proof
                          </button>
                          <button
                            onclick="${item.actionFn}"
                            class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition shadow-sm"

                            ${item.actionLabel}

                        </div>
                      </div>
                    `

          <!-- Partner Agent & Scout ROI Attribution -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900">Partner Agent & Scout ROI Attribution</h2>
                <p class="text-xs text-slate-500">Private owner-level breakdown of closed sales, sourced leads, and payouts.</p>
              </div>
              <span class="text-xs font-semibold text-slate-400">Owner Eyes Only</span>
            </div>

            <!-- Mobile Stacked Attribution Cards -->
            <div class="md:hidden divide-y divide-slate-100">
              ${attributionRows
                .map(
                  r => `
                <div class="p-4 space-y-2.5">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="font-bold text-sm text-slate-900">${r.partner.name}</div>
                      <div class="text-xs text-slate-500">${formatRoleLabel(r.partner.role)} • ${r.partner.phone}</div>

                  <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-xl text-center text-xs">

                    <div>
                      <div class="text-slate-400">Sales Vol.</div>
                      <div class="font-bold text-slate-900 mt-0.5">${formatPHP(r.volumeGenerated)}</div>
                    </div>
                    <div>
                      <div class="text-slate-400">Payouts</div>
                      <div class="font-bold text-amber-700 mt-0.5">${formatPHP(r.totalEarned)}</div>

            <!-- Desktop Attribution Table -->
            <div class="hidden md:block overflow-x-auto">
              <table class="w-full text-left border-collapse">

                  <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-5">Partner / Team Member</th>
                    <th class="py-3 px-4">Role</th>
                    <th class="py-3 px-4 text-center">Closed Deals</th>

                <tbody class="divide-y divide-slate-100 text-sm">
                  ${attributionRows
                    .map(
                      r => `

    // =====================================================================
    // VIEW 2: LIVE INVENTORY (SHOWROOM)
    // =====================================================================
    function renderLiveInventory() {
      const user = getCurrentUser();
      const leadership = isLeadership(user);
      const accent = getAccentClasses();
      const todayISO = getDateOffsetISO(0);

      const showroomCars = state.cars.filter(c => c.stage === 'showroom');
      const readyCount = showroomCars.filter(c => c.status === 'Ready for Release').length;
      const viewingCount = showroomCars.filter(c => c.status === 'Under Viewing').length;
      const reservedCount = showroomCars.filter(c => c.status === 'Reserved').length;
      const soldCount = showroomCars.filter(c => c.status === 'Sold').length;

      const filterPills = ['All Showroom', 'Ready for Release', 'Under Viewing', 'Reserved', 'Sold'];

      const filteredCars = showroomCars.filter(car => {
        const matchesStatus =
          state.inventoryFilter === 'All Showroom'
            ? car.status !== 'Sold'
            : car.status === state.inventoryFilter;
        const q = (state.inventorySearch || '').trim().toLowerCase();
        const matchesSearch =
          !q ||
          car.title.toLowerCase().includes(q) ||
          car.variant.toLowerCase().includes(q) ||
          car.plateEnding.toLowerCase().includes(q);
        return matchesStatus && matchesSearch;
      });

      return `
        <div class="space-y-5">
          <!-- KPI Strip -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm">
              <div class="text-[11px] font-bold uppercase text-slate-400">Ready for Release</div>
              <div class="text-xl sm:text-2xl font-black text-emerald-600 mt-0.5">${readyCount}</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm">
              <div class="text-[11px] font-bold uppercase text-slate-400">Under Viewing</div>
              <div class="text-xl sm:text-2xl font-black text-sky-600 mt-0.5">${viewingCount}</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm">
              <div class="text-[11px] font-bold uppercase text-slate-400">Reserved</div>
              <div class="text-xl sm:text-2xl font-black text-amber-600 mt-0.5">${reservedCount}</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-sm">
              <div class="text-[11px] font-bold uppercase text-slate-400">Sold Units</div>
              <div class="text-xl sm:text-2xl font-black text-slate-800 mt-0.5">${soldCount}</div>
            </div>
          </div>

          <!-- Filter Pills, Search & Intake Button -->
          <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 lg:pb-0">
              ${filterPills
                .map(pill => {
                  const active = state.inventoryFilter === pill;
                  return `
                    <button
                      onclick="setInventoryFilter('${pill}')"
                      class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                        active
                          ? 'bg-slate-900 text-white shadow-sm'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }"
                    >
                      ${pill}
                    </button>
                  `;
                })
                .join('')}
            </div>

            <div class="flex items-center gap-2">
              <input
                type="text"
                value="${state.inventorySearch}"
                oninput="setInventorySearch(this.value)"
                placeholder="Search model, variant, plate..."
                class="w-full sm:w-64 px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
              />
              ${
                leadership
                  ? `<button
                      onclick="openAddCarModal()"
                      class="px-3.5 py-2 rounded-xl ${accent.bg} ${accent.hover} ${accent.btnText} text-xs sm:text-sm font-extrabold whitespace-nowrap shadow-sm transition"
                    >
                      + Intake Unit
                    </button>`
                  : ''
              }
            </div>
          </div>

          <!-- Showroom Vehicle Cards Grid -->
          ${
            filteredCars.length === 0
              ? `<div class="bg-white rounded-2xl p-10 border border-slate-200 text-center text-slate-500 text-sm">
                  No showroom vehicles match your current filter. Try switching to <strong>All Showroom</strong> or clearing search.
                </div>`
              : `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5">
                  ${filteredCars
                    .map(car => {
                      const floorPrice = getCarFloorPrice(car);
                      const reconTotal = getCarReconTotal(car);
                      const passedChecks = (car.checklist || []).filter(Boolean).length;
                      const todaysViewings = state.viewings.filter(v => v.carId === car.id && v.date === todayISO);
                      const coverUrl =
                        (car.images && car.images[0] && car.images[0].url) ||
                        createCarSVG(car.title, '#334155', car.plateEnding);

                      const statusBadge =
                        car.status === 'Ready for Release'
                          ? 'bg-emerald-500 text-white'
                          : car.status === 'Under Viewing'
                          ? 'bg-sky-600 text-white'
                          : car.status === 'Reserved'
                          ? 'bg-amber-500 text-slate-950'
                          : 'bg-slate-800 text-slate-200';

                      return `
                        <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                          <div>
                            <!-- Vehicle Image Header -->
                            <div class="relative h-48 bg-slate-900 overflow-hidden group cursor-pointer" onclick="openGalleryModal('${car.id}')">
                              <img
                                src="${coverUrl}"
                                alt="${car.title}"
                                onerror="this.src='${createCarSVG(car.title, '#334155', car.plateEnding)}'"
                                class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                              />
                              <div class="absolute top-3 left-3 flex items-center gap-1.5">
                                <span class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold uppercase tracking-wide shadow ${statusBadge}">
                                  ${car.status}
                                </span>
                              </div>
                              <button
                                type="button"
                                onclick="event.stopPropagation(); openChecklistModal('car', '${car.id}')"
                                class="absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-slate-950/85 hover:bg-slate-950 text-emerald-400 border border-emerald-500/40 text-[11px] font-bold flex items-center gap-1 backdrop-blur-sm"
                              >
                                <span>✓ ${passedChecks}/9 Checklist</span>
                              </button>
                              <div class="absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded bg-slate-950/75 text-white text-[11px] font-semibold">
                                📷 ${(car.images || []).length} Photo(s)
                              </div>
                            </div>

                            <!-- Card Body -->
                            <div class="p-4 sm:p-5 space-y-3.5">
                              <div>
                                <div class="flex items-start justify-between gap-2">
                                  <h3 class="font-extrabold text-base text-slate-900 leading-snug">${car.title}</h3>
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5">${car.variant} • ${car.mileage} • ${car.plateEnding}</p>
                              </div>

                              <!-- Pricing & Recon Summary Box -->
                              <div class="bg-slate-50 rounded-xl p-3 border border-slate-200/80 flex items-center justify-between">
                                <div>
                                  <div class="text-[11px] font-bold uppercase text-slate-400">Dealership Floor Price</div>
                                  <div class="text-xl font-black text-slate-900">${formatPHP(floorPrice)}</div>
                                  <div class="text-[11px] text-slate-500">Agent Patong allowed above floor</div>
                                </div>
                                <button
                                  onclick="openCarReconModal('${car.id}')"
                                  class="px-2.5 py-1.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-right transition"
                                >
                                  <div class="text-[10px] font-bold uppercase text-slate-400">Recon Ledger</div>
                                  <div class="text-xs font-extrabold text-slate-700">${formatPHP(reconTotal)}</div>
                                </button>
                              </div>

                              <!-- Reservation Deposit Status Banner (if Reserved) -->
                              ${
                                car.reservation
                                  ? `<div class="rounded-xl p-3 border ${
                                      car.reservation.verified
                                        ? 'bg-emerald-50 border-emerald-200 text-emerald-900'
                                        : 'bg-amber-50 border-amber-200 text-amber-950'
                                    } text-xs space-y-1.5">
                                      <div class="flex items-center justify-between font-bold">
                                        <span>
                                          ${car.reservation.verified ? '✓ Deposit Verified' : '⏳ Deposit Pending Sign-Off'}: ${formatPHP(car.reservation.amount)}
                                        </span>
                                        <button
                                          onclick="openReceiptLightbox('deposit', '${car.id}')"
                                          class="underline font-extrabold hover:opacity-80"
                                        >
                                          View Receipt
                                        </button>
                                      </div>
                                      <div class="text-[11px] opacity-85">
                                        Ref: <span class="font-mono font-bold">${car.reservation.refNo}</span> • ${
                                      isLeadership(user) || car.reservation.agentId === user.id
                                        ? `Buyer: ${car.reservation.buyerName}`
                                        : 'Client Locked by Partner'
                                    }
                                      </div>
                                      ${
                                        !car.reservation.verified && isOwnerOrCoOwner(user)
                                          ? `<button
                                              onclick="verifyReservationDeposit('${car.id}')"
                                              class="w-full mt-1 py-1.5 rounded-lg bg-slate-900 text-white font-bold text-[11px] hover:bg-slate-800"
                                            >
                                              Owner Quick-Verify Deposit
                                            </button>`
                                          : ''
                                      }
                                    </div>`
                                  : ''
                              }

                              <!-- Today's Booked Viewings -->
                              <div class="space-y-1.5">
                                <div class="flex items-center justify-between text-[11px] font-bold uppercase text-slate-400">
                                  <span>Today's Viewing Slots (${todaysViewings.length})</span>
                                  <button onclick="jumpToCarCalendar('${car.id}')" class="text-sky-600 hover:underline">Full Schedule →</button>
                                </div>
                                ${
                                  todaysViewings.length === 0
                                    ? `<div class="text-xs text-slate-400 italic">No viewings booked yet today — all 6 slots open.</div>`
                                    : `<div class="space-y-1">
                                        ${todaysViewings
                                          .map(v => {
                                            const bAgent = getUserById(v.agentId);
                                            const canSeeClient = isLeadership(user) || v.agentId === user.id;
                                            return `
                                              <div class="flex items-center justify-between bg-sky-50/80 border border-sky-100 rounded-lg px-2.5 py-1.5 text-xs">
                                                <span class="font-bold text-sky-900">${v.slot}</span>
                                                <span class="text-slate-600 truncate max-w-[175px]">
                                                  ${canSeeClient ? `${v.buyerName} (${bAgent ? bAgent.name.split(' ')[0] : 'Agent'})` : `Locked (${bAgent ? bAgent.name.split(' ')[0] : 'Partner'})`}
                                                </span>
                                              </div>
                                            `;
                                          })
                                          .join('')}
                                      </div>`
                                }
                              </div>
                            </div>
                          </div>

                          <!-- Action Footer: Book / Reserve / Sold -->
                          ${
                            car.status === 'Sold'
                              ? `<div class="px-4 py-3 bg-slate-100 border-t border-slate-200 text-center text-xs font-extrabold text-slate-600">
                                  UNIT SOLD & CLOSED IN LEDGER
                                </div>`
                              : `<div class="p-3.5 bg-slate-50 border-t border-slate-200 grid grid-cols-3 gap-2">
                                  <button
                                    onclick="openBookViewingModal('${car.id}')"
                                    class="py-2.5 px-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-300 text-slate-800 font-bold text-xs transition"
                                  >
                                    📅 Book
                                  </button>
                                  <button
                                    onclick="openReserveCarModal('${car.id}')"
                                    ${car.status === 'Reserved' ? 'disabled' : ''}
                                    class="py-2.5 px-2 rounded-xl font-bold text-xs transition ${
                                      car.status === 'Reserved'
                                        ? 'bg-amber-100 text-amber-500 cursor-not-allowed'
                                        : 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm'
                                    }"
                                  >
                                    🔒 Reserve
                                  </button>
                                  <button
                                    onclick="openMarkSoldModal('${car.id}')"
                                    class="py-2.5 px-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition shadow-sm"
                                  >
                                    ✓ Sold
                                  </button>
                                </div>`
                          }
                        </article>
                      `;
                    })
                    .join('')}
                </div>`
          }
        </div>
      `;
    }

    function setInventoryFilter(filter) {
      state.inventoryFilter = filter;
      saveState();
      renderApp();
    }

    function setInventorySearch(val) {
      state.inventorySearch = val;
      renderApp();
    }

    // =====================================================================
    // VIEW 3: UNDER PREP BAY (LEADERSHIP ONLY)
    // =====================================================================
    function renderUnderPrep() {
      const user = getCurrentUser();
      if (!isLeadership(user)) {
        return `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-600">Under Prep Bay is restricted to Leadership (Owner, Co-owner, Admin).</div>`;
      }

      const prepCars = state.cars.filter(c => c.stage === 'under_prep');
      const steps = [
        { num: 1, label: '1. Intake' },
        { num: 2, label: '2. Recon/PMS' },
        { num: 3, label: '3. Detailing' },
        { num: 4, label: '4. Release' },
      ];

      return `
        <div class="space-y-5">
          <!-- Header Banner -->
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">Under Prep & Reconditioning Bay</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                Track 4-stage mechanical & detailing readiness. Adding recon expenses or adjusting target margin auto-updates the Showroom Floor Price.
              </p>
            </div>
            <button
              onclick="openAddCarModal('under_prep')"
              class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-bold shrink-0"
            >
              + Intake to Under Prep
            </button>
          </div>

          ${
            prepCars.length === 0
              ? `<div class="bg-white rounded-2xl p-10 border border-slate-200 text-center text-slate-500 text-sm">
                  No units currently in Under Prep. All units have been released to the Live Showroom!
                </div>`
              : `<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  ${prepCars
                    .map(car => {
                      const reconTotal = getCarReconTotal(car);
                      const floorPrice = getCarFloorPrice(car);
                      const scout = car.scoutedByUserId ? getUserById(car.scoutedByUserId) : null;

                      return `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                          <div class="p-5 space-y-4">
                            <!-- Title & Scout Attribution -->
                            <div class="flex items-start justify-between gap-3">
                              <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                  <h2 class="text-base sm:text-lg font-extrabold text-slate-900">${car.title}</h2>
                                  <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[11px] font-bold">
                                    Step ${car.prepStep} of 4
                                  </span>

    function setPrepStep(carId, stepNum) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.prepStep = stepNum;
      if (stepNum === 4) {
        releaseCarToShowroom(carId);
        return;
      }
      saveState();
      renderApp();
      showToast(`Updated ${car.title} to Prep Step ${stepNum}`);
    }

    function updateTargetMargin(carId, newVal) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.targetMargin = Math.max(0, Number(newVal) || 0);
      saveState();
      renderApp();
      pushLiveEvent(`Floor price updated for ${car.title} -> ${formatPHP(getCarFloorPrice(car))}`);
      showToast(`Target margin updated. New Floor Price: ${formatPHP(getCarFloorPrice(car))}`);
    }

    function handleInlineAddExpense(event, carId) {
      event.preventDefault();
      const form = event.target;
      const desc = form.desc.value.trim();
      const amount = Number(form.amount.value) || 0;
      const refNo = form.refNo.value.trim().toUpperCase();

      const dup = findDuplicateReference(refNo);
      if (dup) {
        showToast(`Duplicate Reference Blocked: ${refNo} already exists on ${dup}`, 'error');
        return;
      }

      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const user = getCurrentUser();

      car.expenses.push({
        id: 'exp_' + Date.now(),
        desc,
        amount,
        refNo,
        verified: isOwnerOrCoOwner(user),
        addedBy: user.name,
      });

      saveState();
      renderApp();
      pushLiveEvent(`Recon expense (${formatPHP(amount)}) logged on ${car.title}`);
      showToast(`Added ${formatPHP(amount)} recon expense. Floor price updated automatically!`);
    }

    function releaseCarToShowroom(carId) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.stage = 'showroom';
      car.prepStep = 4;
      car.status = 'Ready for Release';
      saveState();
      renderApp();
      pushLiveEvent(`${car.title} released from Under Prep to Live Showroom (${formatPHP(getCarFloorPrice(car))})`);
      showToast(`${car.title} is now LIVE on the Showroom Floor!`);
    }

      const lead = state.leads[idx];
      const scout = getUserById(lead.scoutedByUserId);
      const fee = computeFindersFee(lead.askingPrice);

      const newCar = {
        id: 'car_' + Date.now(),
        title: lead.title,
        variant: lead.variant,
        mileage: 'Verified Intake',
        plateEnding: 'Plate Ending 6',
        stage: 'under_prep',
        status: 'Intake Inspection',
        prepStep: 1,
        acquisitionCost: Number(lead.askingPrice) || 0,
        targetMargin: Math.max(65000, ((Number(lead.estMarketValue) || 0) - (Number(lead.askingPrice) || 0)) - 25000),
        scoutedByUserId: lead.scoutedByUserId,
        priorityLockUntil: Date.now() + 48 * 3600 * 1000,

    // =====================================================================
    // CSV EXECUTIVE LEDGER EXPORT
    // =====================================================================
    function exportExecutiveCSV() {
      const lines = [
        ['Record Type', 'ID', 'Vehicle', 'Floor Price', 'Sold/Asking Price', 'Payout/Deposit', 'Reference No', 'Status'].join(','),
      ];
      state.sales.forEach(s => {
        lines.push(
          [
            'Closed Sale',
            s.id,
            `"${s.carTitle}"`,
            s.floorPrice,
            s.soldPrice,
            (Number(s.agentPayout) || 0) + (Number(s.scoutBonus) || 0),
            s.refNo,
            s.payoutApproved ? 'Payout Cleared' : 'Pending Payout',
          ].join(',')
        );
      });
      state.cars.forEach(c => {
        lines.push(
          [
            c.stage === 'showroom' ? 'Showroom Unit' : 'Under Prep Unit',
            c.id,
            `"${c.title}"`,
            getCarFloorPrice(c),
            c.acquisitionCost,
            c.reservation ? c.reservation.amount : 0,
            c.reservation ? c.reservation.refNo : 'N/A',
            c.status,
          ].join(',')
        );
      });

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Magief_Cars_AutoBook_Ledger_${getDateOffsetISO(0)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported Magief Cars Executive CSV Ledger.');
    }

    function refreshBookingSlotAvailability() {
      const carSel = document.getElementById('bv-car');
      const dateSel = document.getElementById('bv-date');
      const slotSel = document.getElementById('bv-slot');
      const warn = document.getElementById('bv-slot-warning');
      const btn = document.getElementById('bv-submit-btn');
      if (!carSel || !dateSel || !slotSel) return;

      const carId = carSel.value;
      const date = dateSel.value;
      const bookedSlots = state.viewings.filter(v => v.carId === carId && v.date === date).map(v => v.slot);

      Array.from(slotSel.options).forEach(opt => {
        const isTaken = bookedSlots.includes(opt.value);
        opt.disabled = isTaken;
        opt.textContent = isTaken ? `${opt.value} (LOCKED — ALREADY BOOKED)` : `${opt.value} (Available)`;
      });

      if (bookedSlots.includes(slotSel.value)) {
        const firstOpen = Array.from(slotSel.options).find(o => !o.disabled);
        if (firstOpen) slotSel.value = firstOpen.value;
      }

      if (bookedSlots.includes(slotSel.value)) {
        warn.textContent = 'All viewing slots for this vehicle on this date are locked.';
        warn.classList.remove('hidden');
        btn.disabled = true;
      } else {
        warn.classList.add('hidden');
        btn.disabled = false;
      }
    }

    function submitBookViewing(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const carId = fd.get('carId');
      const date = fd.get('date');
      const slot = fd.get('slot');

      const conflict = state.viewings.find(v => v.carId === carId && v.date === date && v.slot === slot);
      if (conflict) {
        showToast('Slot conflict detected! Another agent already locked this time slot.', 'error');
        return;
      }

      const user = getCurrentUser();
      state.viewings.push({
        id: 'vw_' + Date.now(),
        carId,
        date,
        slot,
        agentId: user.id,
        buyerName: fd.get('buyerName').trim(),
        buyerPhone: fd.get('buyerPhone').trim(),
        notes: fd.get('notes').trim(),
      });

      const car = state.cars.find(c => c.id === carId);
      if (car && car.status === 'Ready for Release') {
        car.status = 'Under Viewing';
      }

      saveState();
      closeModal();
      renderApp();
      pushLiveEvent(`${user.name} locked ${slot} viewing on ${car ? car.title : 'Unit'}`);
      showToast(`Viewing locked for ${slot} (${car ? car.title : 'Vehicle'})!`);
    }

    function recalcSoldCommission(carId) {
      const car = state.cars.find(c => c.id === carId);
      const box = document.getElementById('sold-payout-preview');
      const priceInput = document.getElementById('sold-price-input');
      if (!car || !box || !priceInput) return;

      const floorPrice = getCarFloorPrice(car);
      const soldPrice = Number(priceInput.value) || 0;
      const patong = soldPrice - floorPrice;
      const commRate = Number(state.settings.defaultCommRate) || 2.0;
      const defaultComm = Math.round(soldPrice * (commRate / 100));

      const usesPatong = patong > defaultComm;
      const payoutModel = usesPatong ? 'Base + Patong' : `${commRate.toFixed(1)}% Comm`;
      const agentPayout = usesPatong ? patong : defaultComm;
      const scout = car.scoutedByUserId ? getUserById(car.scoutedByUserId) : null;
      const scoutBonus = scout ? computeFindersFee(car.acquisitionCost) : 0;

      box.innerHTML = `
        <div class="flex items-center justify-between text-slate-400">
          <span>Active Payout Rule:</span>
          <span class="font-extrabold text-amber-400">${payoutModel}</span>
        </div>
        <div class="flex items-center justify-between">
          <span>Closing Agent Payout (${getCurrentUser().name}):</span>
          <span class="font-black text-emerald-400 text-sm">${formatPHP(agentPayout)}</span>
        </div>
        ${
          scout
            ? `<div class="flex items-center justify-between text-slate-300">
                <span>Scout Finder's Fee (${scout.name}):</span>
                <span class="font-bold text-amber-300">${formatPHP(scoutBonus)}</span>
              </div>`
            : ''
        }
      `;
    }

        btn.disabled = false;

    function submitMarkSold(event, carId) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const refNo = fd.get('refNo').trim().toUpperCase();
      if (findDuplicateReference(refNo)) {
        showToast(`Blocked duplicate settlement reference ${refNo}!`, 'error');
        return;
      }

      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const user = getCurrentUser();
      const floorPrice = getCarFloorPrice(car);
      const soldPrice = Number(fd.get('soldPrice')) || floorPrice;
      const buyerName = fd.get('buyerName').trim();

      const patong = soldPrice - floorPrice;
      const commRate = Number(state.settings.defaultCommRate) || 2.0;
      const defaultComm = Math.round(soldPrice * (commRate / 100));
      const usesPatong = patong > defaultComm;

      const payoutModel = usesPatong ? 'Base + Patong' : `${commRate.toFixed(1)}% Comm`;
      const agentPayout = usesPatong ? patong : defaultComm;
      const scoutBonus = car.scoutedByUserId ? computeFindersFee(car.acquisitionCost) : 0;
      const dealershipGross = soldPrice - (Number(car.acquisitionCost) || 0) - getCarReconTotal(car);
      const netProfit = Math.max(0, dealershipGross - agentPayout - scoutBonus);

      if (!tempSoldReceiptUrl) {
        tempSoldReceiptUrl = generateSampleReceiptDataURL({
          channel: 'Bank Settlement',
          amount: soldPrice,
          refNo,
          sender: buyerName,
          timestamp: 'Today • Closed Deal',
        });
      }

      car.status = 'Sold';
      const newSaleId = 'sale_' + Math.floor(903 + Math.random() * 90);
      state.sales.unshift({
        id: newSaleId,
        carId: car.id,
        carTitle: car.title,
        floorPrice,
        soldPrice,
        agentId: user.id,
        scoutId: car.scoutedByUserId || null,
        payoutModel,
        agentPayout,
        scoutBonus,
        netProfit,
        buyerName,
        refNo,
        closedDate: getDateOffsetISO(0),
        payoutApproved: isOwnerOrCoOwner(user),
        receiptDataUrl: tempSoldReceiptUrl,
      });

      saveState();
      closeModal();
      renderApp();
      pushLiveEvent(`SOLD: ${car.title} closed by ${user.name} at ${formatPHP(soldPrice)} (${payoutModel})`);

    function openReceiptLightbox(kind, id) {
      let title = 'Payment Receipt Proof';
      let subtitle = '';
      let imgUrl = '';
      let verifyActionHtml = '';

      if (kind === 'deposit') {
        const car = state.cars.find(c => c.id === id);
        if (!car || !car.reservation) return;
        const r = car.reservation;
        title = `Reservation Deposit • ${formatPHP(r.amount)}`;
        subtitle = `${car.title} • Ref: ${r.refNo} • ${r.channel} (${r.timestamp})`;
        imgUrl =
          r.receiptDataUrl ||
          generateSampleReceiptDataURL({
            channel: r.channel,
            amount: r.amount,
            refNo: r.refNo,
            sender: r.buyerName,
            timestamp: r.timestamp,
          });
        if (!r.verified && isOwnerOrCoOwner()) {
          verifyActionHtml = `<button onclick="verifyReservationDeposit('${car.id}'); closeModal();" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">✓ Verify Deposit Now</button>`;
        }
      } else if (kind === 'sale') {
        const sale = state.sales.find(s => s.id === id);
        if (!sale) return;
        title = `Closed Sale Receipt • ${formatPHP(sale.soldPrice)}`;
        subtitle = `${sale.carTitle} • Ref: ${sale.refNo} • Buyer: ${sale.buyerName}`;
        imgUrl =
          sale.receiptDataUrl ||
          generateSampleReceiptDataURL({
            channel: 'Dealership Settlement',
            amount: sale.soldPrice,
            refNo: sale.refNo,
            sender: sale.buyerName,
            timestamp: sale.closedDate,
          });
      }

      openModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-3">
            <div>
              <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${title}</h3>
              <p class="text-xs text-slate-500">${subtitle}</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100">✕</button>
          </div>
          <div class="bg-slate-900 rounded-2xl p-3 flex items-center justify-center">
            <img src="${imgUrl}" alt="Receipt Proof" class="max-h-[60vh] rounded-xl shadow-lg" />

            <span class="text-[11px] font-semibold text-emerald-600">✓ Unique Reference Hash Verified</span>

          </div>

      `);

    function submitAddCar(event) {

      const newCar = {
        id: 'car_' + Date.now(),
        title,
        variant: fd.get('variant').trim(),
        mileage: fd.get('mileage').trim(),
        plateEnding: fd.get('plateEnding').trim(),
        stage,
        status: stage === 'showroom' ? 'Ready for Release' : 'Intake Inspection',
        prepStep: stage === 'showroom' ? 4 : 1,
        acquisitionCost: Number(fd.get('acquisitionCost')) || 0,
        targetMargin: Number(fd.get('targetMargin')) || 0,
        scoutedByUserId: null,
        priorityLockUntil: null,
        checklist: [true, true, true, true, true, true, true, true, true],
        expenses: [],
        reservation: null,
        images: [
          { label: 'Showroom Angle', url: createCarSVG(title, '#334155', fd.get('plateEnding').trim().toUpperCase()) },

    function updateLeadFeePreview(asking) {
      const fee = computeFindersFee(asking);
      const banner = document.getElementById('lead-fee-banner');
      if (!banner) return;
      const tierText =
        fee === 3000 ? 'Under ₱650k bracket' : fee === 6000 ? '₱650k – ₱1.19M bracket' : '₱1.2M+ flagship bracket';
      banner.textContent = `Qualified Finder's Fee Tier: ${formatPHP(fee)} (${tierText})`;
    }

    function submitNewLead(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const user = getCurrentUser();
      const title = fd.get('title').trim();
      const askingPrice = Number(fd.get('askingPrice')) || 0;

      state.leads.unshift({
        id: 'lead_' + Date.now(),
        title,
        variant: fd.get('variant').trim(),
        sellerInfo: fd.get('sellerInfo').trim(),
        askingPrice,
        estMarketValue: Number(fd.get('estMarketValue')) || askingPrice + 100000,
        scoutedByUserId: user.id,
        status: '48h Priority Lock Active',
        lockExpiresAt: Date.now() + 48 * 3600 * 1000,
        checklist: [true, true, true, true, true, true, true, true, true],
        notes: fd.get('notes').trim(),
      });

      saveState();
      closeModal();
      renderApp();
      pushLiveEvent(`New sourcing lead registered by ${user.name}: ${title} (Finder's Fee: ${formatPHP(computeFindersFee(askingPrice))})`);
      showToast(`Lead registered! Your Finder's Fee (${formatPHP(computeFindersFee(askingPrice))}) is locked.`);
    }

    // ---------------------------------------------------------------------
    // MODAL 8: checklist-modal (9-POINT INSPECTION)
    // ---------------------------------------------------------------------
    function openChecklistModal(targetType, targetId) {
      const item =
        targetType === 'car'
          ? state.cars.find(c => c.id === targetId)
          : state.leads.find(l => l.id === targetId);
      if (!item) return;

      const canEdit = isLeadership();
      const checks = item.checklist || Array(9).fill(true);

      openModal(`
        <div class="p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
              <h3 class="text-lg font-extrabold text-slate-900">9-Point Dealership Inspection Checklist</h3>
              <p class="text-xs text-slate-500">${item.title} (${checks.filter(Boolean).length}/9 Passed)</p>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100">✕</button>
          </div>

          <div class="space-y-2">
            ${DEFAULT_CHECKLIST_ITEMS.map((label, idx) => {
              const checked = !!checks[idx];
              return `
                <label class="flex items-center justify-between p-2.5 rounded-xl border ${
                  checked ? 'bg-emerald-50/70 border-emerald-200' : 'bg-slate-50 border-slate-200'
                } text-xs cursor-pointer">
                  <span class="font-semibold text-slate-800">${idx + 1}. ${label}</span>
                  <input
                    type="checkbox"
                    ${checked ? 'checked' : ''}
                    ${canEdit ? '' : 'disabled'}
                    onchange="toggleChecklistPoint('${targetType}', '${targetId}', ${idx}, this.checked)"
                    class="w-4 h-4 accent-emerald-600 rounded"
                  />
                </label>
              `;
            }).join('')}
          </div>

          <div class="flex items-center justify-between pt-2">
            <span class="text-[11px] text-slate-400">
              ${canEdit ? 'Leadership can toggle inspection items live.' : 'Read-only verified inspection report.'}
            </span>
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Done</button>
          </div>
        </div>
      `);
    }

    function toggleChecklistPoint(targetType, targetId, index, value) {
      const item =
        targetType === 'car'
          ? state.cars.find(c => c.id === targetId)
          : state.leads.find(l => l.id === targetId);
      if (!item) return;
      if (!item.checklist) item.checklist = Array(9).fill(true);
      item.checklist[index] = value;
      saveState();
      renderApp();
    }

    function submitAddCarImage(event, carId) {
      event.preventDefault();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const fd = new FormData(event.target);
      const label = fd.get('label').trim();
      const url = fd.get('url').trim() || createCarSVG(label, '#475569', 'VERIFIED');
      car.images.push({ label, url });
      saveState();
      openGalleryModal(carId, car.images.length - 1);
      showToast('Added photo to vehicle gallery.');
    }

    function removeCarImage(carId, idx) {
      const car = state.cars.find(c => c.id === carId);
      if (!car || car.images.length <= 1) return;
      car.images.splice(idx, 1);
      saveState();
      openEditCarImagesModal(carId);
    }

    // MAIN RENDER LOOP
    // =====================================================================
    function renderApp() {
      renderHeaderAndNav();

      const main = document.getElementById('app-main');
      switch (state.activeView) {
        case 'overview':
          main.innerHTML = renderOwnerOverview();
          break;
        case 'inventory':
          main.innerHTML = renderLiveInventory();
          break;
        case 'under_prep':
          main.innerHTML = renderUnderPrep();
          break;
        case 'calendar':
          main.innerHTML = renderViewingCalendar();
          break;
        case 'sourcing':
          main.innerHTML = renderCarSourcing();
          break;
        case 'sales':
          main.innerHTML = renderSalesAndPayouts();
          break;
        case 'settings':
          main.innerHTML = renderSettingsView();
          break;
        default:
          main.innerHTML = renderLiveInventory();
      }
    }

    // Initialize application on DOMContentLoaded
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
