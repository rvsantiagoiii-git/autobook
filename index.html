    function toggleSoldModelFields(val) {
      const markupEl = document.getElementById('markup-fields');
      const commEl = document.getElementById('commission-fields');
      if (!markupEl || !commEl) return;
      if (val === 'COMMISSION') {
        markupEl.classList.add('hidden');
        commEl.classList.remove('hidden');
      } else {
        markupEl.classList.remove('hidden');
        commEl.classList.add('hidden');
      }
    }

    function submitBookViewing(event, carId) {
      event.preventDefault();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car || !isCarBookable(car)) return;

      const form = event.target;
      const date = form.date.value;
      const slot = form.slot.value;
      const buyerName = form.buyerName.value.trim();
      const buyerPhone = form.buyerPhone.value.trim();

      const conflict = state.bookings.find(
        b => b.carId === carId && b.date === date && b.slot === slot && b.status === 'CONFIRMED'
      );
      if (conflict) {
        const holder = getUserRecord(conflict.agentId);
        emitLiveEvent('Slot Conflict Prevented', `${slot} on ${formatDisplayDate(date)} is already locked by ${holder.name}.`, 'rose');
        return;
      }

      state.bookings.push({
        id: 'bk_' + Date.now(),
        carId,
        agentId: user.id,
        date,
        slot,
        buyerName,
        buyerPhone,
        status: 'CONFIRMED',
        createdAt: 'Just now'
      });

      const viewingStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'ACTIVE');
      if (viewingStage && getStatusStageMeta(car.status).systemRole === 'AVAILABLE') {
        car.status = viewingStage.label;
      }

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Viewing Slot Locked',
        `${user.name} locked ${car.year} ${car.make} ${car.model} for ${formatDisplayDate(date)} at ${slot}.`,
        'emerald'
      );
    }

    function cancelBooking(bookingId) {
      const idx = state.bookings.findIndex(b => b.id === bookingId);
      if (idx === -1) return;
      const bk = state.bookings[idx];
      const car = state.cars.find(c => c.id === bk.carId);
      state.bookings.splice(idx, 1);

      if (car && !isCarReserved(car) && !isCarSold(car)) {
        const remaining = state.bookings.some(b => b.carId === car.id && b.status === 'CONFIRMED');
        if (!remaining) {
          const readyStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'AVAILABLE');
          if (readyStage) car.status = readyStage.label;
        }
      }

      saveState();
      renderApp();
      emitLiveEvent('Viewing Slot Released', `${bk.slot} on ${formatDisplayDate(bk.date)} is open again.`, 'amber');
    }

    // Verified Reservation Deposit Lock
    function submitReserveCar(event, carId) {
      event.preventDefault();
      const user = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      const form = event.target;
      const buyerName = form.buyerName.value.trim();
      const buyerPhone = form.buyerPhone.value.trim();
      const depositAmount = Number(form.depositAmount.value) || 20000;

      const reservedStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'RESERVED');
      car.status = reservedStage ? reservedStage.label : 'Reserved';
      car.reservation = {
        agentId: user.id,
        buyerName,
        buyerPhone,
        depositAmount,
        reservedAt: 'Just now'
      };

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Unit Reserved (Deposit Lock)',
        `${car.year} ${car.make} ${car.model} is now RESERVED by ${user.name} (${formatPHP(depositAmount)} deposit).`,
        'rose'
      );
    }

    function releaseReservation(carId) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.reservation = null;
      const readyStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'AVAILABLE');
      car.status = readyStage ? readyStage.label : 'Ready for Release';
      saveState();
      renderApp();
      emitLiveEvent('Reservation Hold Released', `${car.year} ${car.make} ${car.model} is back to ${car.status}.`, 'amber');
    }

    function submitMarkSold(event, carId) {
      event.preventDefault();
      const currentUser = getCurrentUser();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;

      if (!canUserMarkCarSold(car, currentUser)) {
        emitLiveEvent('Action Locked', 'Only the agent with a booked viewing or reservation on this car can mark it Sold.', 'rose');
        closeModal();
        return;
      }

      const form = event.target;
      const agentId = isOwnerRole(currentUser) ? form.agentId.value : currentUser.id;
      const payoutModel = form.payoutModel.value;
      const notes = form.notes.value.trim();

      let agentPayout = 0;
      let dealershipNet = car.basePrice;
      let agentMarkup = 0;
      let reportedSalePrice = null;
      let commissionRateApplied = null;

      if (payoutModel === 'MARKUP') {
        agentMarkup = Math.max(0, Number(form.agentMarkup.value) || 0);
        agentPayout = agentMarkup;
        dealershipNet = car.basePrice;
      } else {
        reportedSalePrice = Number(form.reportedSalePrice.value) || car.basePrice;
        commissionRateApplied = Number(state.commissionRate) || 2.0;
        agentPayout = Math.round(reportedSalePrice * (commissionRateApplied / 100));
        dealershipNet = reportedSalePrice - agentPayout;
      }

      const soldStage = (state.statusPipeline || getDefaultStatusPipeline()).find(s => s.systemRole === 'SOLD');
      car.status = soldStage ? soldStage.label : 'Sold';
      car.soldAt = getDateOffsetStr(0);
      car.soldByAgentId = agentId;

      const sourcingBonus = car.sourcedByAgentId ? getSourcingBonusAmount(car.basePrice) : 0;

      state.sales.unshift({
        id: 'sale_' + Date.now(),
        carId: car.id,
        carTitle: `${car.year} ${car.make} ${car.model}`,
        agentId,
        sourcedByAgentId: car.sourcedByAgentId || null,
        sourcingBonus,
        payoutModel,
        basePriceSnapshot: car.basePrice,
        unitCostSnapshot: getCarTotalInvested(car),
        reportedSalePrice,
        agentMarkup,
        commissionRateApplied,
        agentPayout,
        dealershipNet,
        status: isOwnerRole(currentUser) ? 'APPROVED' : 'PENDING',
        date: getDateOffsetStr(0),
        notes: notes || 'Submitted via AutoBook Showroom'
      });

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent(
        'Vehicle Marked Sold',
        `${car.year} ${car.make} ${car.model} closed by ${getUserRecord(agentId).name}${sourcingBonus > 0 ? ` (+${formatPHP(sourcingBonus)} scout incentive)` : ''}.`,
        'emerald'
      );
    }

    function toggleSourcingIncentiveEnabled(enabled) {
      if (!state.sourcingIncentive) state.sourcingIncentive = { enabled: false, type: 'FIXED', amount: 5000 };
      state.sourcingIncentive.enabled = Boolean(enabled);
      saveState();
      renderApp();
      emitLiveEvent(
        enabled ? 'Sourcing Incentive Enabled' : 'Sourcing Incentive Disabled',
        enabled
          ? `Scouts will earn ${state.sourcingIncentive.type === 'PERCENT' ? state.sourcingIncentive.amount + '%' : formatPHP(state.sourcingIncentive.amount)} when their sourced car sells.`
          : 'Sourced car finder’s bonus turned off (48h booking lock remains active).',
        'indigo'
      );
    }

    function updateSourcingIncentiveConfig(newType, newAmount) {
      if (!state.sourcingIncentive) state.sourcingIncentive = { enabled: true, type: 'FIXED', amount: 5000 };
      if (newType) state.sourcingIncentive.type = newType;
      if (newAmount !== null && newAmount !== undefined) {
        state.sourcingIncentive.amount = Math.max(0, Number(newAmount) || 0);
      }
      saveState();
      renderApp();
      emitLiveEvent('Sourcing Bonus Updated', 'Updated finder’s incentive rate for acquired car leads.', 'indigo');
    }

    function approveSalePayout(saleId) {
      const sale = state.sales.find(s => s.id === saleId);
      if (!sale) return;
      sale.status = 'APPROVED';
      saveState();
      renderApp();
      emitLiveEvent('Payout Verified & Approved', `${sale.carTitle} (${formatPHP(sale.agentPayout)}) approved.`, 'emerald');
    }

    function updateCommissionRate(val) {
      const clamped = Math.min(3.0, Math.max(1.0, Number(val) || 2.0));
      state.commissionRate = clamped;
      saveState();
      renderApp();
      emitLiveEvent('Commission Rate Updated', `Dealership default commission rate set to ${clamped.toFixed(1)}%.`, 'indigo');
    }

    // Reconditioning, Detailing & Margin Roll-Up Actions
    function submitInlineReconExpense(event, carId) {
      event.preventDefault();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const form = event.target;
      const category = form.category.value;
      const note = form.note.value.trim();
      const amount = Math.max(0, Number(form.amount.value) || 0);
      if (!amount) return;

      if (!Array.isArray(car.reconExpenses)) car.reconExpenses = [];
      car.reconExpenses.push({
        id: 'rec_' + Date.now(),
        category,
        note,
        amount,
        addedAt: 'Just now'
      });
      recalculateCarBasePrice(car);
      saveState();
      renderApp();
      emitLiveEvent('Recon Cost Added', `+${formatPHP(amount)} (${category}) rolled into ${car.make} ${car.model} base price (${formatPHP(car.basePrice)}).`, 'amber');
    }

    function submitModalReconExpense(event, carId) {
      submitInlineReconExpense(event, carId);
      openCarReconModal(carId);
    }

    function deleteReconExpense(carId, expId, reopenModal = false) {
      const car = state.cars.find(c => c.id === carId);
      if (!car || !Array.isArray(car.reconExpenses)) return;
      car.reconExpenses = car.reconExpenses.filter(e => e.id !== expId);
      recalculateCarBasePrice(car);
      saveState();
      renderApp();
      if (reopenModal) openCarReconModal(carId);
      emitLiveEvent('Recon Cost Removed', `Updated ${car.make} ${car.model} base price to ${formatPHP(car.basePrice)}.`, 'amber');
    }

    function updateCarMarginInline(carId, val) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.targetMargin = Math.max(0, Number(val) || 0);
      recalculateCarBasePrice(car);
      saveState();
      renderApp();
      emitLiveEvent('Profit Margin Updated', `${car.make} ${car.model} Base Sell Price is now ${formatPHP(car.basePrice)}.`, 'emerald');
    }

    function submitUpdateAcquisitionAndMargin(event, carId) {
      event.preventDefault();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const form = event.target;
      car.acquisitionPrice = Math.max(0, Number(form.acquisitionPrice.value) || 0);
      car.targetMargin = Math.max(0, Number(form.targetMargin.value) || 0);
      recalculateCarBasePrice(car);
      saveState();
      renderApp();
      openCarReconModal(carId);
      emitLiveEvent('Unit Pricing Updated', `${car.make} ${car.model} Base Sell Price updated to ${formatPHP(car.basePrice)}.`, 'emerald');
    }

    function advanceCarPrepStage(carId) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const nextStage = getNextPrepWorkflowStage(car);
      if (!nextStage) return;
      car.status = nextStage.label;
      saveState();
      renderApp();
      emitLiveEvent(
        nextStage.systemRole === 'AVAILABLE' ? 'Released to Live Inventory' : 'Prep Stage Advanced',
        `${car.year} ${car.make} ${car.model} moved to "${nextStage.label}" at ${formatPHP(car.basePrice)}.`,
        'emerald'
      );
    }

    function changeCarPipelineStatus(carId, newStatus) {
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      car.status = newStatus;
      if (newStatus !== 'Reserved') {
        car.reservation = null;
      }
      saveState();
      renderApp();
      emitLiveEvent('Status Updated', `${car.year} ${car.make} ${car.model} is now "${newStatus}".`, 'indigo');
    }

    function submitAddCar(event) {
      event.preventDefault();
      const form = event.target;
      const year = Number(form.year.value) || 2021;
      const make = form.make.value.trim();
      const model = form.model.value.trim();
      const plateNo = form.plateNo.value.trim().toUpperCase();
      const mileage = form.mileage.value.trim();
      const fuel = form.fuel.value;
      const color = form.color.value.trim();
      const acquisitionPrice = Math.max(0, Number(form.acquisitionPrice.value) || 0);
      const targetMargin = Math.max(0, Number(form.targetMargin.value) || 0);
      const status = form.status.value;

      const newCar = {
        id: 'car_' + Date.now(),
        make,
        model,
        year,
        plateNo,
        mileage,
        transmission: 'Automatic',
        fuel,
        color,
        acquisitionPrice,
        targetMargin,
        reconExpenses: [],
        basePrice: acquisitionPrice + targetMargin,
        status,
        listedDaysAgo: 0,
        soldAt: null,
        photos: [
          { label: 'Front 3/4 Exterior', url: makeCarSamplePhoto(`${year} ${make} ${model}`, '#065f46', '#34d399', 'INTAKE PHOTO') }
        ],
        checklist: {
          orcr_docs: true, no_lto_alarm: true, open_deed_ids: true,
          not_flooded: true, no_major_accident: true, odo_not_tampered: true,
          cold_ac_engine: true, fresh_paint_interior: true, spare_jack_keys: true
        },
        sourcedByAgentId: null,
        priorityLockUntil: null,
        reservation: null
      };

      state.cars.unshift(newCar);
      if (isCarInPreparation(newCar)) {
        state.activeTab = 'prep';
      }
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Unit Added', `${year} ${make} ${model} added to "${status}".`, 'emerald');
    }

    function toggleChecklistItem(targetType, targetId, itemId, checked) {
      const target = targetType === 'lead'
        ? state.leads.find(l => l.id === targetId)
        : state.cars.find(c => c.id === targetId);
      if (!target) return;
      if (!target.checklist) target.checklist = {};
      target.checklist[itemId] = checked;
      if (targetType === 'lead' && target.status === 'PENDING') {
        target.status = 'INSPECTING';
      }
      saveState();
      renderApp();
      openModal('checklist-modal', { targetType, targetId });
    }

    async function submitAddCarPhoto(event, carId) {
      event.preventDefault();
      const car = state.cars.find(c => c.id === carId);
      if (!car) return;
      const form = event.target;
      const label = form.label.value.trim();
      const file = form.photoFile.files[0];
      if (!file) return;

      const dataUrl = await compressImageFile(file);
      if (!Array.isArray(car.photos)) car.photos = [];
      car.photos.push({ label, url: dataUrl });
      saveState();
      renderApp();
      openEditCarImagesModal(carId);
      emitLiveEvent('Photo Added', `Added "${label}" to ${car.year} ${car.make} ${car.model}.`, 'emerald');
    }

    function removeCarPhoto(carId, index) {
      const car = state.cars.find(c => c.id === carId);
      if (!car || !Array.isArray(car.photos) || car.photos.length <= 1) return;
      car.photos.splice(index, 1);
      saveState();
      renderApp();
      openEditCarImagesModal(carId);
    }

    // Car Sourcing & Lead Acquisition
    function submitNewLead(event) {
      event.preventDefault();
      const user = getCurrentUser();
      const form = event.target;
      state.leads.unshift({
        id: 'lead_' + Date.now(),
        agentId: user.id,
        makeModel: form.makeModel.value.trim(),
        plateNo: form.plateNo.value.trim().toUpperCase(),
        mileage: form.mileage.value.trim(),
        askingPrice: Number(form.askingPrice.value) || 0,
        sellerName: form.sellerName.value.trim(),
        sellerPhone: form.sellerPhone.value.trim(),
        location: form.location.value.trim(),
        notes: form.notes.value.trim(),
        photos: [
          { label: 'Seller Front 3/4', url: makeCarSamplePhoto(form.makeModel.value.trim(), '#1e1b4b', '#818cf8', 'SCOUT LEAD') }
        ],
        checklist: {
          orcr_docs: true, no_lto_alarm: true, open_deed_ids: true,
          not_flooded: true, no_major_accident: true, odo_not_tampered: true,
          cold_ac_engine: true, fresh_paint_interior: true, spare_jack_keys: true
        },
        status: 'PENDING',
        submittedAt: 'Just now'
      });
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('New Car Lead Submitted', `${user.name} submitted ${form.makeModel.value.trim()}.`, 'indigo');
    }

    function updateLeadStatus(leadId, newStatus) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      lead.status = newStatus;
      saveState();
      renderApp();
      emitLiveEvent('Lead Stage Updated', `${lead.makeModel} marked as ${newStatus}.`, 'indigo');
    }

    function acquireLeadIntoInventory(leadId) {
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      lead.status = 'ACQUIRED';

      const parts = lead.makeModel.split(' ');
      const parsedYear = Number(parts[0]) || 2020;
      const parsedMake = parts[1] || 'Unit';
      const parsedModel = parts.slice(2).join(' ') || lead.makeModel;

      const newCar = {
        id: 'car_' + Date.now(),
        make: parsedMake,
        model: parsedModel,
        year: parsedYear,
        plateNo: lead.plateNo,
        mileage: lead.mileage,
        transmission: 'Automatic',
        fuel: 'Gasoline',
        color: 'Showroom Spec',
        acquisitionPrice: lead.askingPrice,
        targetMargin: 45000,
        reconExpenses: [],
        basePrice: lead.askingPrice + 45000,
        status: 'Reconditioning / PMS',
        listedDaysAgo: 0,
        soldAt: null,
        photos: lead.photos && lead.photos.length
          ? lead.photos
          : [{ label: 'Acquired Unit', url: makeCarSamplePhoto(lead.makeModel, '#065f46', '#34d399', 'RECON BAY') }],
        checklist: { ...(lead.checklist || {}) },
        sourcedByAgentId: lead.agentId,
        priorityLockUntil: Date.now() + (48 * 60 * 60 * 1000),
        reservation: null
      };

      state.cars.unshift(newCar);
      state.activeTab = 'prep';
      saveState();
      renderApp();
      emitLiveEvent(
        'Lead Acquired -> Under Prep',
        `${lead.makeModel} moved to Reconditioning / PMS with a 48h priority lock for ${getUserRecord(lead.agentId).name}.`,
        'emerald'
      );
    }

    // Settings: Branding, Pipeline, Team & Support
    function syncBrandColorInputs(val, fromText = false) {
      const valid = normalizeHexColor(val);
      const picker = document.getElementById('brand-color-picker');
      const hexInput = document.getElementById('brand-color-hex');
      const radio = document.getElementById('theme-custom-radio');
      if (picker && fromText) picker.value = valid;
      if (hexInput && !fromText) hexInput.value = valid;
      if (radio) radio.checked = true;
    }

    async function submitBrandingSettings(event) {
      event.preventDefault();
      const form = event.target;
      const dealershipName = form.dealershipName.value.trim() || DEFAULT_BRANDING.dealershipName;
      const tagline = form.tagline.value.trim() || DEFAULT_BRANDING.tagline;
      const themeId = form.themeId.value;
      const customColor = normalizeHexColor(form.customColor.value);
      const fontFamily = form.fontFamily.value;

      let logoDataUrl = state.branding?.logoDataUrl || null;
      const file = form.logoFile?.files?.[0];
      if (file) {
        logoDataUrl = await compressImageFile(file, 256, 0.85);
      }

      state.branding = { dealershipName, tagline, themeId, customColor, fontFamily, logoDataUrl };
      saveState();
      applyBrandingToDocument(state.branding);
      closeModal();
      renderApp();
      emitLiveEvent('Brand Updated', `Applied ${dealershipName} theme & typography.`, 'emerald');
    }

    function removeCustomLogo() {
      if (!state.branding) state.branding = { ...DEFAULT_BRANDING };
      state.branding.logoDataUrl = null;
      saveState();
      applyBrandingToDocument(state.branding);
      openSettingsModal('branding');
    }

    function submitAddPipelineStage(event) {
      event.preventDefault();
      const form = event.target;
      const label = form.label.value.trim();
      const color = form.color.value;
      const allowBooking = form.allowBooking.checked;
      if (!label) return;

      state.statusPipeline.splice(Math.max(0, state.statusPipeline.length - 2), 0, {
        id: 'st_' + Date.now(),
        label,
        color,
        allowBooking,
        systemRole: 'ACTIVE',
        isCore: false
      });
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function togglePipelineStageBooking(stageId) {
      const st = state.statusPipeline.find(s => s.id === stageId);
      if (!st) return;
      st.allowBooking = !st.allowBooking;
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function movePipelineStage(stageId, dir) {
      const idx = state.statusPipeline.findIndex(s => s.id === stageId);
      const newIdx = idx + dir;
      if (idx === -1 || newIdx < 0 || newIdx >= state.statusPipeline.length) return;
      const [item] = state.statusPipeline.splice(idx, 1);
      state.statusPipeline.splice(newIdx, 0, item);
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function deletePipelineStage(stageId) {
      const st = state.statusPipeline.find(s => s.id === stageId);
      if (!st || st.isCore) return;
      state.statusPipeline = state.statusPipeline.filter(s => s.id !== stageId);
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function resetStatusPipelineDefault() {
      state.statusPipeline = getDefaultStatusPipeline();
      saveState();
      openSettingsModal('pipeline');
      renderApp();
    }

    function submitCreateInvite(event) {
      event.preventDefault();
      const note = event.target.note.value.trim();
      const token = 'AB-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      state.invites.unshift({
        token,
        note,
        status: 'ACTIVE',
        createdAt: 'Just now',
        usedByName: null
      });
      saveState();
      openSettingsModal('team');
      emitLiveEvent('Invite Token Created', `Single-use invite ${token} generated for ${note}.`, 'indigo');
    }

    function copyInviteUrl(token) {
      const url = `${window.location.origin}${window.location.pathname}?invite=${token}`;
      const temp = document.createElement('textarea');
      temp.value = url;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      emitLiveEvent('Invite Link Copied', `Copied ${url} to clipboard.`, 'emerald');
    }

    function submitAcceptInviteForm(event, token) {
      event.preventDefault();
      const invite = state.invites.find(i => i.token === token && i.status === 'ACTIVE');
      if (!invite) return;
      const form = event.target;
      const agentName = form.agentName.value.trim();
      const agentPhone = form.agentPhone.value.trim();

      const newId = 'agent_' + Date.now();
      state.agents[newId] = {
        id: newId,
        name: agentName,
        role: 'AGENT',
        label: 'Agent',
        phone: agentPhone,
        active: true,
        joinedAt: 'Just now'
      };
      invite.status = 'USED';
      invite.usedByName = agentName;
      state.currentUserId = newId;

      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Partner Onboarded', `${agentName} activated their single-use invite token!`, 'emerald');
    }

    function setTeamMemberRole(memberId, targetTier) {
      const member = state.agents[memberId];
      if (!member || member.isFounder || memberId === 'owner_rv') return;
      if (targetTier === 'COOWNER') {
        member.role = 'OWNER';
        member.label = 'Co-owner';
      } else if (targetTier === 'ADMIN') {
        member.role = 'OWNER';
        member.label = 'Admin';
      } else {
        member.role = 'AGENT';
        member.label = 'Agent';
      }
      saveState();
      renderRoleSwitcher();
      openSettingsModal('team');
      emitLiveEvent('Role Updated', `${member.name} is now set as ${member.label}.`, 'indigo');
    }

    function toggleAgentActiveStatus(memberId) {
      const member = state.agents[memberId];
      if (!member || member.isFounder || memberId === 'owner_rv') return;
      member.active = member.active === false ? true : false;
      if (!member.active) {
        state.bookings = state.bookings.filter(b => b.agentId !== memberId);
      }
      saveState();
      renderRoleSwitcher();
      openSettingsModal('team');
      emitLiveEvent(
        member.active ? 'Partner Reactivated' : 'Partner Deactivated',
        `${member.name} access ${member.active ? 'restored' : 'paused & future slots released'}.`,
        member.active ? 'emerald' : 'rose'
      );
    }

    function copySupportNumber() {
      const temp = document.createElement('textarea');
      temp.value = '0917-100-0001';
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      emitLiveEvent('Support Number Copied', 'AutoBook Support (0917-100-0001) copied to clipboard.', 'indigo');
    }

    function resetDemoWorkspace() {
      localStorage.removeItem(STORAGE_KEY);
      state = createDefaultState();
      saveState();
      closeModal();
      renderApp();
      emitLiveEvent('Workspace Reset', 'Restored default Magief Cars dealership data.', 'amber');
    }

    function exportSalesLedgerCSV() {
      const rows = [
        ['Date', 'Vehicle', 'Agent', 'Payout Model', 'Floor Price', 'Unit Cost (Buy-In + Recon)', 'Scout Incentive', 'Dealership Net', 'Verified Net Profit', 'Agent Payout', 'Status']
      ];
      state.sales.forEach(s => {
        const car = state.cars.find(c => c.id === s.carId);
        const unitCost = typeof s.unitCostSnapshot === 'number'
          ? s.unitCostSnapshot
          : (car ? getCarTotalInvested(car) : s.basePriceSnapshot);
        const scoutBonus = Number(s.sourcingBonus) || 0;
        const netProfit = s.dealershipNet - unitCost - scoutBonus;
        rows.push([
          s.date,
          `"${s.carTitle}"`,
          `"${getUserRecord(s.agentId).name}"`,
          s.payoutModel,
          s.basePriceSnapshot,
          unitCost,
          scoutBonus,
          s.dealershipNet,
          netProfit,
          s.agentPayout,
          s.status
        ]);
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', `AutoBook_Sales_Ledger_${getDateOffsetStr(0)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // =========================================================================
    // 10. MAIN APPLICATION RENDER LOOP & INITIALIZATION
    // =========================================================================
    function renderApp() {
      applyBrandingToDocument(state.branding);
      renderRoleSwitcher();
      renderNavigation();

      const container = document.getElementById('app-content');
      if (!container) return;

      if (state.activeTab === 'prep') {
        container.innerHTML = renderUnderPrepView();
      } else if (state.activeTab === 'calendar') {
        container.innerHTML = renderCalendarView();
      } else if (state.activeTab === 'sales') {
        container.innerHTML = renderSalesView();
      } else if (state.activeTab === 'sourcing') {
        container.innerHTML = renderSourcingView();
      } else {
        container.innerHTML = renderInventoryView();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const switcher = document.getElementById('role-switcher');
      if (switcher) {
        switcher.addEventListener('change', e => {
          state.currentUserId = e.target.value;
          saveState();
          renderApp();
          const u = getCurrentUser();
          emitLiveEvent('Switched Active View', `Now viewing as ${u.name} (${u.label || u.role}).`, 'indigo');
        });
      }

      const params = new URLSearchParams(window.location.search);
      const inviteToken = params.get('invite');
      renderApp();

      if (inviteToken) {
        openModal('accept-invite-modal', { token: inviteToken });
      }
    });
  </script>
</body>
</html>
