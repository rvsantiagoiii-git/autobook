<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magief Cars — AutoBook v2.0 Dealership &amp; Partner Agent Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.9; }
      70% { transform: scale(1.65); opacity: 0; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .live-pulse::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background-color: #10b981;
      animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes slideInToast {
      from { transform: translateY(14px) scale(0.97); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .toast-enter {
      animation: slideInToast 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

      function formatPHP(amount) {
        const num = Math.round(Number(amount) || 0);
        const sign = num < 0 ? '-' : '';
        return sign + '₱' + Math.abs(num).toLocaleString('en-PH');
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTodayStr() {
        return new Date().toISOString().split('T')[0];
      }

      function isExecutive(user) {
        return user && (user.role === 'owner' || user.role === 'co-owner');
      }

      function isManagement(user) {
        return user && (user.role === 'owner' || user.role === 'co-owner' || user.role === 'admin');
      }

      function getUserById(id) {
        return TEAM_USERS.find(u => u.id === id) || TEAM_USERS[0];
      }

      function getCurrentUser() {
        return getUserById(state.currentUserId);
      }

      function getPlateEnding(plateNo) {
        const digits = String(plateNo || '').replace(/\D/g, '');
        return digits ? digits.slice(-1) : '8';
      }

        const r = rules || state.finderRules;
        const val = Number(price) || 0;
        if (val < r.tier1Max) return r.tier1Fee;
        if (val < r.tier2Max) return r.tier2Fee;
        return r.tier3Fee;
      }

      function emitToast(title, message, tone = 'emerald') {
        const ticker = document.getElementById('live-feed-ticker');
        if (ticker) ticker.textContent = `${title}: ${message}`;

        const stack = document.getElementById('toast-container');
        if (!stack) return;

        const borderTone = {
          emerald: 'border-emerald-500/70',
          amber: 'border-amber-500/70',
          rose: 'border-rose-500/70',
          indigo: 'border-indigo-500/70'
        }[tone] || 'border-emerald-500/70';

        const titleColor = {
          emerald: 'text-emerald-400',
          amber: 'text-amber-400',
          rose: 'text-rose-400',
          indigo: 'text-indigo-400'
        }[tone] || 'text-emerald-400';

        const el = document.createElement('div');
        el.className = `toast-enter pointer-events-auto rounded-2xl bg-slate-900 border ${borderTone} text-white px-4 py-3 shadow-2xl flex items-start gap-3`;
        el.innerHTML = `
          <div class="mt-0.5 ${titleColor}">${svgIcon('check', 'w-4 h-4')}</div>
          <div class="min-w-0 flex-1">
            <p class="text-[11px] font-extrabold uppercase tracking-wider ${titleColor}">${escapeHtml(title)}</p>
            <p class="text-xs text-slate-200 mt-0.5 leading-relaxed">${escapeHtml(message)}</p>
          </div>
        `;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(8px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 4000);
      }

      function renderRoleSwitcher() {

      function enforceRoleRouteGuard() {
        const user = getCurrentUser();
        if (!isExecutive(user) && state.activeTab === 'owner-overview') {
          state.activeTab = 'inventory';
        }
        if (!isManagement(user) && state.activeTab === 'settings') {
          state.activeTab = 'inventory';
        }
      }

      function renderNavigation() {
        enforceRoleRouteGuard();
        const user = getCurrentUser();
        const exec = isExecutive(user);
        const mgmt = isManagement(user);

        const liveCount = state.cars.filter(c => c.stage === 'LIVE').length;
        const prepCount = state.cars.filter(c => c.stage === 'PREP').length;
        const leadsCount = state.leads.filter(l => l.status !== 'ACQUIRED').length;
        const salesCount = mgmt
          ? state.sales.length
          : state.sales.filter(s => s.closingAgentId === user.id || s.sourcedByAgentId === user.id).length;

        const tabs = [
          ...(exec ? [{ id: 'owner-overview', label: 'Owner Overview', shortLabel: 'Overview', icon: 'crown', badge: 'VIP', badgeCls: 'bg-amber-400 text-slate-950' }] : []),

      // =========================================================================
      // 5. TAB 1: OWNER OVERVIEW (OWNER & CO-OWNER ONLY)
      // =========================================================================
      function renderOwnerOverviewView() {
        const user = getCurrentUser();
        if (!isExecutive(user)) return renderInventoryView();

        const liveCars = state.cars.filter(c => c.stage === 'LIVE');
        const prepCars = state.cars.filter(c => c.stage === 'PREP');
        const unsoldCars = [...liveCars, ...prepCars];

        const realizedNetProfit = state.sales.reduce((sum, s) => {
          return sum + ((Number(s.dealershipNet) || 0) - (Number(s.unitCost) || 0));
        }, 0);

        const unsoldStockCapital = unsoldCars.reduce((sum, c) => sum + c.buyInPrice + c.reconTotal, 0);
        const liveCapital = liveCars.reduce((sum, c) => sum + c.buyInPrice + c.reconTotal, 0);
        const prepCapital = prepCars.reduce((sum, c) => sum + c.buyInPrice + c.reconTotal, 0);

        const clearedDeposits = state.cars.reduce((sum, c) => {
          return sum + (c.reservation && c.reservation.verified ? c.reservation.depositAmount : 0);
        }, 0);
        const pendingDeposits = state.cars.reduce((sum, c) => {
          return sum + (c.reservation && !c.reservation.verified ? c.reservation.depositAmount : 0);
        }, 0);

        const pendingPayoutLiability = state.sales
          .filter(s => s.payoutStatus === 'PENDING_RELEASE')
          .reduce((sum, s) => sum + s.closingPayout + s.finderFee, 0);
        const totalPaidOut = state.sales
          .filter(s => s.payoutStatus === 'RELEASED')
          .reduce((sum, s) => sum + s.closingPayout + s.finderFee, 0);

        // Action Required Queue
        const actions = [];
        state.cars.forEach(car => {
          if (car.reservation && !car.reservation.verified) {
            const agent = getUserById(car.reservation.agentId);
            actions.push({
              badge: 'DEPOSIT PROOF',
              badgeCls: 'bg-indigo-100 text-indigo-900 border-indigo-300',
              title: `${car.year} ${car.make} ${car.model}`,
              detail: `${formatPHP(car.reservation.depositAmount)} via ${car.reservation.channel} (Ref #${car.reservation.referenceNo}) • Buyer: ${car.reservation.buyerName} (${agent.name})`,
              btnLabel: 'Verify: Funds Cleared',
              btnCls: 'bg-emerald-600 hover:bg-emerald-700 text-white',
              dataAttr: `data-action="verify-deposit" data-car-id="${car.id}"`
            });
          }
          if (car.stage === 'PREP' && Array.isArray(car.expenses)) {
            car.expenses.forEach(exp => {
              if (!exp.verified) {
                actions.push({
                  badge: 'RECON RECEIPT',

      // =========================================================================
      // 9. TAB 5: SALES & PAYOUTS (STRICT ROLE-GATED PRIVACY)
      // =========================================================================
      function renderSalesView() {
        const user = getCurrentUser();
        const mgmt = isManagement(user);

        // Management sees all deals; Agents see ONLY deals they closed or sourced
        const visibleSales = mgmt
          ? state.sales
          : state.sales.filter(s => s.closingAgentId === user.id || s.sourcedByAgentId === user.id);

        // Management sees ranked Partner Agent Leaderboard; Agents see ONLY their own Private Summary
        const agentsList = mgmt ? TEAM_USERS.filter(u => u.role === 'agent') : [user];
        const summaries = agentsList.map(ag => {
          const closed = state.sales.filter(s => s.closingAgentId === ag.id);
          const sourced = state.sales.filter(s => s.sourcedByAgentId === ag.id);
          const closingTotal = closed.reduce((sum, s) => sum + s.closingPayout, 0);
          const finderTotal = sourced.reduce((sum, s) => sum + s.finderFee, 0);
          return {
            ...ag,
            closedCount: closed.length,
            sourcedCount: sourced.length,
            closingTotal,
            finderTotal,
            grandTotal: closingTotal + finderTotal
          };
        }).sort((a, b) => b.grandTotal - a.grandTotal);

        const totalGrossSales = visibleSales.reduce((sum, s) => sum + s.finalPrice, 0);
        const totalDealershipNet = visibleSales.reduce((sum, s) => sum + s.dealershipNet, 0);

        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">
                ${mgmt ? 'Sales & Partner Agent Payout Ledger' : 'My Personal Earnings & Payouts'}
              </h2>
              <p class="text-xs text-slate-500 mt-0.5">
                ${mgmt
                  ? 'Full dealership closed deals, ranked agent payout summary, and payout release controls.'
                  : 'Private earnings view — team rankings and other agents’ payouts are hidden.'}
              </p>
            </div>
            <button type="button" data-action="export-sales-csv"
              class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold flex items-center gap-1.5 transition">
              ${svgIcon('download', 'w-3.5 h-3.5 text-emerald-400')}
              <span>${mgmt ? 'Export Full Payout CSV' : 'Export My Payouts CSV'}</span>
            </button>
          </div>

          ${mgmt ? `
            <!-- Dealership Totals (Management Only) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
                <span class="text-[11px] font-bold uppercase text-slate-400 block">Total Closed Volume</span>
                <strong class="text-xl sm:text-2xl font-black text-slate-900 mt-1 block">${formatPHP(totalGrossSales)}</strong>
              </div>
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
                <span class="text-[11px] font-bold uppercase text-slate-400 block">Dealership Net Retained</span>
                <strong class="text-xl sm:text-2xl font-black text-emerald-700 mt-1 block">${formatPHP(totalDealershipNet)}</strong>
              </div>
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
                <span class="text-[11px] font-bold uppercase text-slate-400 block">Total Agent Payouts</span>
                <strong class="text-xl sm:text-2xl font-black text-indigo-700 mt-1 block">${formatPHP(summaries.reduce((s, a) => s + a.grandTotal, 0))}</strong>
              </div>
            </div>
          ` : ''}

          <!-- Agent Payout Summary (Leaderboard for Management vs Private Summary for Agent) -->
          <div class="mb-6">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-3">
              ${mgmt ? 'Partner Agent Payout Ranking (Closing Deals + Sourced Finder\'s Fees)' : `My Personal Earnings & Payout Summary (${escapeHtml(user.name)})`}
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${summaries.map((ag, idx) => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      ${mgmt
                        ? `<span class="px-2.5 py-0.5 rounded-lg bg-indigo-100 text-indigo-800 text-xs font-black">#${idx + 1}</span>`
                        : `<span class="px-2.5 py-0.5 rounded-lg bg-emerald-100 text-emerald-800 text-xs font-extrabold">Private View</span>`}
                      <div>
                        <h4 class="text-sm font-extrabold text-slate-900">${escapeHtml(ag.name)}</h4>
                        <p class="text-[11px] text-slate-500">${ag.closedCount} closed deal(s) &bull; ${ag.sourcedCount} sourced car(s)</p>
                      </div>
                    </div>
                    <div class="text-right">
                      <span class="text-[10px] font-bold uppercase text-slate-400 block">Total Earned</span>
                      <span class="text-lg font-black text-emerald-700">${formatPHP(ag.grandTotal)}</span>
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200/70 text-xs">
                    <div>
                      <span class="text-[10px] font-bold uppercase text-slate-400 block">Closing Deal Payouts</span>
                      <strong class="text-slate-900">${formatPHP(ag.closingTotal)}</strong>
                    </div>
                    <div>
                      <span class="text-[10px] font-bold uppercase text-slate-400 block">Sourced Car Finder's Fees</span>
                      <strong class="text-indigo-700">${formatPHP(ag.finderTotal)}</strong>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Closed Deals Ledger -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden divide-y divide-slate-100">
            <div class="px-4 sm:px-5 py-3.5 bg-slate-50 border-b border-slate-200">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600">
                ${mgmt ? `All Closed Deals Ledger (${visibleSales.length})` : `My Closed & Sourced Deals (${visibleSales.length})`}
              </h3>
            </div>

            ${visibleSales.length === 0 ? `
              <div class="p-8 text-center text-xs text-slate-500">No closed transactions recorded for your account yet.</div>
            ` : visibleSales.map(sale => {
              const closer = getUserById(sale.closingAgentId);
              const scout = sale.sourcedByAgentId ? getUserById(sale.sourcedByAgentId) : null;
              const isReleased = sale.payoutStatus === 'RELEASED';

              // Role-gated counterparty masking on split deals
              const showClosingAmount = mgmt || sale.closingAgentId === user.id;
              const showFinderAmount = mgmt || sale.sourcedByAgentId === user.id;

              return `
                <div class="p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="text-sm font-extrabold text-slate-900">${escapeHtml(sale.carTitle)}</span>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isReleased ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">
                        ${isReleased ? 'Payout Released' : 'Pending Release'}
                      </span>
                    </div>
                    <p class="text-xs text-slate-500">
                      Closer: <strong class="text-slate-700">${escapeHtml(closer.name)}</strong>
                      ${scout ? ` &bull; Scout: <strong class="text-indigo-700">${escapeHtml(scout.name)}</strong>` : ''}
                      &bull; ${escapeHtml(sale.paymentMode)} (Ref #${escapeHtml(sale.referenceNo)})
                    </p>
                  </div>

                  <div class="flex flex-wrap items-center gap-4 text-xs">
                    <div>
                      <span class="text-[10px] text-slate-400 block">Sale Price</span>
                      <strong class="text-slate-900">${formatPHP(sale.finalPrice)}</strong>
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-400 block">Closing Payout</span>
                      ${showClosingAmount
                        ? `<strong class="text-emerald-700">${formatPHP(sale.closingPayout)}</strong>`
                        : `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 font-bold inline-flex items-center gap-1">${svgIcon('lock', 'w-3 h-3')} Private</span>`}
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-400 block">Finder's Fee</span>
                      ${showFinderAmount
                        ? `<strong class="text-indigo-700">${formatPHP(sale.finderFee)}</strong>`
                        : `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 font-bold inline-flex items-center gap-1">${svgIcon('lock', 'w-3 h-3')} Private</span>`}
                    </div>
                    ${mgmt && !isReleased ? `
                      <button type="button" data-action="release-payout" data-sale-id="${sale.id}"
                        class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">
                        Release Payout
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // =========================================================================
      function calculateFinancingMetrics(sellingPrice, includeFinancing, dpPercent, months, annualRate) {
        const price = Math.max(0, Number(sellingPrice) || 0);
        const dpPct = Math.min(80, Math.max(10, Number(dpPercent) || 20));
        const term = Math.max(12, Number(months) || 48);
        const rate = Math.max(0, Number(annualRate) || 9.5);

        const downPayment = Math.round(price * (dpPct / 100));
        const financedAmount = Math.max(0, price - downPayment);
        const totalWithInterest = financedAmount * (1 + (rate / 100) * (term / 12));
        const monthlyAmortization = includeFinancing ? Math.round(totalWithInterest / term) : 0;

        return {
          price,
          dpPct,
          downPayment,
          financedAmount,
          term,
          rate,
          monthlyAmortization
        };
      }

          `📍 Trece Martires City, Cavite`,
          ``,
          `*${car.year} ${car.make} ${car.model}*`,
          `• Mileage: ${car.mileage}`,
          `• Transmission: ${car.transmission}`,
          `• Fuel Type: ${car.fuel}`,
          `• Exterior Color: ${car.color}`,
          `• Plate Ending: Ends in ${plateEnding}`,
          `• Documentation: Complete Original OR/CR`,
          ``,
          `💰 *Cash Selling Price: ${formatPHP(calc.price)}*`
        ];

        if (q.includeFinancing) {
          lines.push(
            ``,
            `🏦 *Bank Financing Estimate (${calc.dpPct}% DP):*`,
            `• Down Payment (${calc.dpPct}%): ${formatPHP(calc.downPayment)}`,
            `• Amount Financed: ${formatPHP(calc.financedAmount)}`,
            `• Loan Term: ${calc.term} Months`,
            `• Est. Monthly Amortization: *${formatPHP(calc.monthlyAmortization)} / mo*`,
            `_(Subject to standard bank credit approval)_`
          );
        }

        lines.push(
          ``,
          `👤 *Sales Advisor:* ${advisor.name}`,
          `📞 *Direct Mobile / Viber:* ${advisor.phone}`,
          `Message me anytime to schedule your showroom viewing & test drive!`
        );

        return lines.join('\n');
      }

      function copyBuyerQuoteToClipboard() {
        if (!quoteBuilder) return;
        const car = state.cars.find(c => c.id === quoteBuilder.carId);
        if (!car) return;
        const advisor = getUserById(quoteBuilder.advisorId);
        const text = buildBuyerQuoteText(car, advisor, quoteBuilder);

        // Reliable iFrame-safe copy using temporary textarea + execCommand('copy')
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.setAttribute('readonly', '');
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (e) {
          copied = false;
        }
        document.body.removeChild(temp);

        if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }

        const btn = document.getElementById('qb-copy-btn');
        if (btn) {
          btn.innerHTML = `${svgIcon('check', 'w-4 h-4')}<span>Copied to Clipboard!</span>`;
          setTimeout(() => {
            if (document.getElementById('qb-copy-btn')) {
              btn.innerHTML = `${svgIcon('copy', 'w-4 h-4')}<span>Copy Messenger Quote</span>`;
            }
          }, 2200);
        }

        emitToast('Buyer Quote Copied', `Clean quote for ${car.year} ${car.make} ${car.model} copied (zero internal data).`, 'emerald');
      }

      function downloadBuyerSpecCardPNG() {
        if (!quoteBuilder) return;
        const car = state.cars.find(c => c.id === quoteBuilder.carId);
        if (!car) return;
        const advisor = getUserById(quoteBuilder.advisorId);
        const calc = calculateFinancingMetrics(
          quoteBuilder.sellingPrice,
          quoteBuilder.includeFinancing,
          quoteBuilder.dpPercent,
          quoteBuilder.months,
          quoteBuilder.annualRate
        );

        const canvas = document.createElement('canvas');
        canvas.width = 900;
        canvas.height = quoteBuilder.includeFinancing ? 1180 : 940;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Outer Card
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(36, 36, 828, canvas.height - 72, 28);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Top Header Band
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(36, 36, 828, 128, [28, 28, 0, 0]);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 30px Inter, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('MAGIEF CARS', 72, 92);

        ctx.fillStyle = '#34d399';
        ctx.font = '700 15px Inter, sans-serif';
        ctx.fillText("Governor's Drive, Trece Martires City, Cavite  •  Verified Quality Pre-Owned", 72, 124);

        // Vehicle Showcase Banner
        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.roundRect(68, 192, 764, 152, 22);
        ctx.fill();

        ctx.fillStyle = '#6ee7b7';
        ctx.font = '800 14px Inter, sans-serif';
        ctx.fillText(`${car.year} MODEL  •  READY FOR SHOWROOM VIEWING`, 98, 232);

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 32px Inter, sans-serif';
        ctx.fillText(`${car.year} ${car.make} ${car.model}`, 98, 276);

        ctx.fillStyle = '#d1fae5';
        ctx.font = '600 16px Inter, sans-serif';
        ctx.fillText('100% Flood-Free Guaranteed  •  Clean LTO / HPG Verification', 98, 312);

        // 6-Box Spec Grid
        const specs = [
          ['MILEAGE', car.mileage],
          ['TRANSMISSION', car.transmission],
          ['FUEL TYPE', car.fuel],
          ['EXTERIOR COLOR', car.color],
          ['PLATE ENDING', `Ends in ${getPlateEnding(car.plateNo)}`],
          ['DOCUMENTATION', 'Complete Original OR/CR']
        ];

        specs.forEach(([label, value], i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const x = 68 + col * 392;
          const y = 372 + row * 94;

          ctx.fillStyle = i === 5 ? '#ecfdf5' : '#f8fafc';
          ctx.beginPath();
          ctx.roundRect(x, y, 372, 78, 16);
          ctx.fill();
          ctx.strokeStyle = i === 5 ? '#a7f3d0' : '#e2e8f0';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = i === 5 ? '#047857' : '#64748b';
          ctx.font = '700 12px Inter, sans-serif';
          ctx.fillText(label, x + 20, y + 30);

          ctx.fillStyle = '#0f172a';
          ctx.font = '800 18px Inter, sans-serif';
          ctx.fillText(String(value), x + 20, y + 58);
        });

        // Cash Selling Price Callout
        const priceY = 674;
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.roundRect(68, priceY, 764, 114, 22);
        ctx.fill();

        ctx.fillStyle = '#34d399';
        ctx.font = '800 14px Inter, sans-serif';
        ctx.fillText('CASH SELLING PRICE', 98, priceY + 40);

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 42px Inter, sans-serif';
        ctx.fillText(formatPHP(calc.price), 98, priceY + 88);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#a7f3d0';
        ctx.font = '700 15px Inter, sans-serif';
        ctx.fillText('Cash or Bank Financing', 802, priceY + 66);
        ctx.textAlign = 'left';

        let nextY = priceY + 138;

        // Financing Card (if toggled ON)
        if (quoteBuilder.includeFinancing) {
          ctx.fillStyle = '#ecfdf5';
          ctx.beginPath();
          ctx.roundRect(68, nextY, 764, 214, 22);
          ctx.fill();
          ctx.strokeStyle = '#6ee7b7';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#064e3b';
          ctx.font = '800 16px Inter, sans-serif';
          ctx.fillText(`BANK FINANCING ESTIMATE (${calc.dpPct}% DOWN PAYMENT)`, 98, nextY + 38);

          const cols = [
            ['DOWN PAYMENT', formatPHP(calc.downPayment)],
            ['AMOUNT FINANCED', formatPHP(calc.financedAmount)],
            ['LOAN TERM', `${calc.term} Months`]
          ];
          cols.forEach(([lbl, val], idx) => {
            const cx = 98 + idx * 242;
            ctx.fillStyle = '#047857';
            ctx.font = '700 12px Inter, sans-serif';
            ctx.fillText(lbl, cx, nextY + 76);
            ctx.fillStyle = '#0f172a';
            ctx.font = '800 20px Inter, sans-serif';
            ctx.fillText(val, cx, nextY + 104);
          });

          ctx.fillStyle = '#065f46';
          ctx.font = '700 16px Inter, sans-serif';
          ctx.fillText('Estimated Monthly Amortization:', 98, nextY + 158);

          ctx.textAlign = 'right';
          ctx.fillStyle = '#047857';
          ctx.font = '900 30px Inter, sans-serif';
          ctx.fillText(`${formatPHP(calc.monthlyAmortization)} / mo`, 802, nextY + 162);
          ctx.textAlign = 'left';

          ctx.fillStyle = '#475569';
          ctx.font = '500 12px Inter, sans-serif';
          ctx.fillText('*Indicative bank auto-loan computation subject to partner bank credit approval.', 98, nextY + 194);

          nextY += 236;
        }

        // Advisor Footer
        ctx.fillStyle = '#0f172a';
        ctx.font = '800 20px Inter, sans-serif';
        ctx.fillText(`Sales Advisor: ${advisor.name}`, 68, nextY + 34);

        ctx.fillStyle = '#475569';
        ctx.font = '600 15px Inter, sans-serif';
        ctx.fillText('Magief Cars Showroom • Trece Martires City, Cavite', 68, nextY + 60);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#059669';
        ctx.font = '800 22px monospace';
        ctx.fillText(advisor.phone, 832, nextY + 46);

        const safeModel = `${car.year}_${car.make}_${car.model}`.replace(/[^a-zA-Z0-9]+/g, '_');
        const link = document.createElement('a');
        link.download = `MagiefCars_Quote_${safeModel}.png`;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        emitToast('Spec Card PNG Downloaded', `Saved MagiefCars_Quote_${safeModel}.png ready to send to your buyer!`, 'emerald');
      }

      function normalizeRef(val) {
        return String(val || '').trim().toUpperCase().replace(/\s+/g, '');
      }

      function findDuplicateReference(refNo) {
        const clean = normalizeRef(refNo);
        if (!clean || clean === 'CASH') return null;
        for (const c of state.cars) {
          if (c.reservation && normalizeRef(c.reservation.referenceNo) === clean) {
            return `${c.year} ${c.make} ${c.model} (Reservation Deposit)`;
          }
        }
        for (const s of state.sales) {
          if (normalizeRef(s.referenceNo) === clean) {
            return `${s.carTitle} (Sales Ledger)`;
          }
        }
        return null;
      }

      }

      function closeModal() {
        quoteBuilder = null;
        const root = document.getElementById('modal-root');
        if (root) root.innerHTML = '';
        renderClientPresentationOverlay();
      }

      // =========================================================================
      // 13. CSV EXPORTS & EVENT DELEGATION
      // =========================================================================
      function triggerCSVDownload(filename, rows) {
        const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.join(',')).join('\n');
        const link = document.createElement('a');
        link.href = encodeURI(csvContent);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      function exportExecutiveCSV() {
        const rows = [
          ['Date', 'Vehicle', 'Closing Agent', 'Scout Agent', 'Final Price', 'Unit Cost', 'Closing Payout', 'Finder Fee', 'Dealership Net', 'Payout Status']
        ];
        state.sales.forEach(s => {
          rows.push([
            s.date,
            `"${s.carTitle}"`,
            `"${getUserById(s.closingAgentId).name}"`,
            `"${s.sourcedByAgentId ? getUserById(s.sourcedByAgentId).name : 'Direct'}"`,
            s.finalPrice,
            s.unitCost,
            s.closingPayout,
            s.finderFee,
            s.dealershipNet,
            s.payoutStatus
          ]);
        });
        triggerCSVDownload(`MagiefCars_Executive_Snapshot_${getTodayStr()}.csv`, rows);
        emitToast('Executive CSV Exported', 'Downloaded Magief Cars executive snapshot.', 'emerald');
      }

      function exportSalesCSV() {
        const user = getCurrentUser();
        const mgmt = isManagement(user);
        const visible = mgmt
          ? state.sales
          : state.sales.filter(s => s.closingAgentId === user.id || s.sourcedByAgentId === user.id);

        const rows = [
          ['Date', 'Vehicle', 'Closing Agent', 'Scout Agent', 'Final Price', 'Closing Payout', 'Finder Fee', 'Payout Status']
        ];
        visible.forEach(s => {
          const showClosing = mgmt || s.closingAgentId === user.id;
          const showFinder = mgmt || s.sourcedByAgentId === user.id;
          rows.push([
            s.date,
            `"${s.carTitle}"`,
            `"${getUserById(s.closingAgentId).name}"`,
            `"${s.sourcedByAgentId ? getUserById(s.sourcedByAgentId).name : 'Direct'}"`,
            s.finalPrice,
            showClosing ? s.closingPayout : 'Private',
            showFinder ? s.finderFee : 'Private',
            s.payoutStatus
          ]);
        });
        triggerCSVDownload(`MagiefCars_Payouts_${user.id}_${getTodayStr()}.csv`, rows);
        emitToast('Payouts CSV Exported', mgmt ? 'Exported full dealership payouts.' : 'Exported your personal payout records.', 'emerald');
      }

      // =========================================================================
      // 14. MAIN APP RENDER & UNIFIED EVENT HANDLERS
      // =========================================================================
      function renderApp() {
        renderRoleSwitcher();
        renderNavigation();

        const container = document.getElementById('app-content');
        if (!container) return;

        switch (state.activeTab) {
          case 'owner-overview':
            container.innerHTML = renderOwnerOverviewView();
            break;
          case 'prep':
            container.innerHTML = renderUnderPrepView();
            break;
          case 'sourcing':
            container.innerHTML = renderSourcingView();
            break;
          case 'sales':
            container.innerHTML = renderSalesView();
            break;
          case 'settings':
            container.innerHTML = renderSettingsView();
            break;
          case 'inventory':
          default:
            container.innerHTML = renderInventoryView();
            break;
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        // Role Switcher Change
        const roleSwitcher = document.getElementById('role-switcher');
        if (roleSwitcher) {
          roleSwitcher.addEventListener('change', e => {
            state.currentUserId = e.target.value;
            enforceRoleRouteGuard();
            saveState();
            renderApp();
            const u = getCurrentUser();
            emitToast('Switched User View', `Active profile: ${u.name} (${u.title})`, 'indigo');
          });
        }

        // Global Delegated Click Listener
        document.addEventListener('click', e => {
          const tabBtn = e.target.closest('[data-tab]');
          if (tabBtn) {
            state.activeTab = tabBtn.getAttribute('data-tab');
            saveState();
            renderApp();
            return;
          }

          const actionEl = e.target.closest('[data-action]');
          if (!actionEl) return;
          const action = actionEl.getAttribute('data-action');

          if (action === 'reset-workspace') {
            localStorage.removeItem(STORAGE_KEY);
            state = createDefaultState();
            saveState();
            closeModal();
            renderApp();
            emitToast('Demo Workspace Restored', 'Reset Magief Cars data to clean defaults.', 'amber');
          } else if (action === 'filter-inventory') {
            state.inventoryFilter = actionEl.getAttribute('data-filter');
            renderApp();
          } else if (action === 'open-quote-builder') {
            openQuoteBuilderModal(actionEl.getAttribute('data-car-id'));
          } else if (action === 'close-modal') {
            closeModal();
          } else if (action === 'qb-patong-preset' && quoteBuilder) {
            const car = state.cars.find(c => c.id === quoteBuilder.carId);
            const addon = Number(actionEl.getAttribute('data-addon')) || 0;
            if (car) {
              quoteBuilder.sellingPrice = car.basePrice + addon;
              const priceInput = document.getElementById('qb-selling-price');
              if (priceInput) priceInput.value = quoteBuilder.sellingPrice;
              refreshQuoteLiveRegions();
            }
          } else if (action === 'qb-dp-preset' && quoteBuilder) {
            quoteBuilder.dpPercent = Number(actionEl.getAttribute('data-dp')) || 20;
            renderQuoteBuilderModal();
          } else if (action === 'qb-term-preset' && quoteBuilder) {
            quoteBuilder.months = Number(actionEl.getAttribute('data-months')) || 48;
            renderQuoteBuilderModal();
          } else if (action === 'qb-copy-text') {
            copyBuyerQuoteToClipboard();
          } else if (action === 'qb-download-png') {
            downloadBuyerSpecCardPNG();
          } else if (action === 'qb-fullscreen-client' && quoteBuilder) {
            quoteBuilder.clientFullScreen = true;
            renderClientPresentationOverlay();
          } else if (action === 'qb-exit-fullscreen' && quoteBuilder) {
            quoteBuilder.clientFullScreen = false;
            renderClientPresentationOverlay();
          } else if (action === 'qb-toggle-textarea' && quoteBuilder) {
            quoteBuilder.showTextBox = !quoteBuilder.showTextBox;
            renderQuoteBuilderModal();
          } else if (action === 'open-reserve-modal') {
            openReserveModal(actionEl.getAttribute('data-car-id'));
          } else if (action === 'open-sold-modal') {
            openSoldModal(actionEl.getAttribute('data-car-id'));
          } else if (action === 'open-submit-lead') {
            openSubmitLeadModal();
          } else if (action === 'verify-deposit') {
            const car = state.cars.find(c => c.id === actionEl.getAttribute('data-car-id'));
            if (car && car.reservation) {
              car.reservation.verified = true;
              car.reservation.verifiedBy = getCurrentUser().name;
              car.status = 'Reserved';
              saveState();
              renderApp();
              emitToast('Funds Cleared', `Deposit verified for ${car.year} ${car.make} ${car.model}. Unit locked!`, 'emerald');
            }
          } else if (action === 'verify-expense') {
            const car = state.cars.find(c => c.id === actionEl.getAttribute('data-car-id'));
            const exp = car?.expenses?.find(x => x.id === actionEl.getAttribute('data-exp-id'));
            if (exp) {
              exp.verified = true;
              saveState();
              renderApp();
              emitToast('Recon Expense Verified', `${exp.label} verified by ${getCurrentUser().name}.`, 'emerald');
            }
          } else if (action === 'release-payout') {
            const sale = state.sales.find(s => s.id === actionEl.getAttribute('data-sale-id'));
            if (sale) {
              sale.payoutStatus = 'RELEASED';
              saveState();
              renderApp();
              emitToast('Payout Released', `${formatPHP(sale.closingPayout + sale.finderFee)} released for ${sale.carTitle}.`, 'emerald');
            }
          } else if (action === 'promote-to-live') {
            const car = state.cars.find(c => c.id === actionEl.getAttribute('data-car-id'));
            if (car) {
              car.stage = 'LIVE';
              car.status = 'Available';
              car.bannerUrl = makeVehicleBannerDataUrl(`${car.year} ${car.make} ${car.model}`, car.plateNo, '#065f46', '#34d399', 'SHOWROOM READY');
              state.activeTab = 'inventory';
              saveState();
              renderApp();
              emitToast('Promoted to Live Inventory', `${car.year} ${car.make} ${car.model} is now live for agents!`, 'emerald');
            }
          } else if (action === 'acquire-lead') {
            const lead = state.leads.find(l => l.id === actionEl.getAttribute('data-lead-id'));
            if (lead) {
              lead.status = 'ACQUIRED';
              state.cars.unshift({
                id: 'prep_' + Date.now(),
                stage: 'PREP',
                year: lead.year,
                make: lead.make,
                model: lead.model,
                plateNo: lead.plateNo,
                mileage: lead.mileage,
                transmission: lead.transmission,
                fuel: lead.fuel,
                color: lead.color,
                buyInPrice: lead.askingPrice,
                reconTotal: 10000,
                basePrice: lead.askingPrice + 55000,
                status: 'Reconditioning / PMS',
                sourcedByAgentId: lead.agentId,
                finderFee: lead.finderFee,
                bannerUrl: makeVehicleBannerDataUrl(`${lead.year} ${lead.make} ${lead.model}`, lead.plateNo, '#312e81', '#818cf8', 'UNDER PREP BAY'),
                checklist: { orcr: true, lto: true, deed: true, flood: true, accident: true, odo: true, ac_engine: true, detailing: false, tools: true },
                expenses: [{ id: 'exp_' + Date.now(), label: 'Initial PMS & Detailing Package', amount: 10000, verified: false }]
              });
              state.activeTab = 'prep';
              saveState();
              renderApp();
              emitToast('Lead Acquired to Under Prep', `${lead.year} ${lead.make} ${lead.model} added with ${formatPHP(lead.finderFee)} Finder's Fee.`, 'emerald');
            }
          } else if (action === 'export-executive-csv') {
            exportExecutiveCSV();
          } else if (action === 'export-sales-csv') {
            exportSalesCSV();
          }
        });

        // Live Input Listeners (Search + Quote Builder + Range Sliders)
        document.addEventListener('input', e => {
          const target = e.target;
          if (target.id === 'inventory-search-input') {
            state.searchQuery = target.value;
            renderApp();
            const restored = document.getElementById('inventory-search-input');
            if (restored) {
              restored.focus();
              restored.setSelectionRange(restored.value.length, restored.value.length);
            }
            return;
          }

          if (target.id === 'qb-selling-price' && quoteBuilder) {
            quoteBuilder.sellingPrice = Math.max(0, Number(target.value) || 0);
            refreshQuoteLiveRegions();
            return;
          }

          if (target.id === 'qb-dp-input' && quoteBuilder) {
            quoteBuilder.dpPercent = Math.min(80, Math.max(10, Number(target.value) || 20));
            refreshQuoteLiveRegions();
            return;
          }

          if (target.id === 'qb-rate-input' && quoteBuilder) {
            quoteBuilder.annualRate = Math.min(18, Math.max(0, Number(target.value) || 9.5));
            refreshQuoteLiveRegions();
            return;
          }

          const action = target.getAttribute('data-action');
          if (action === 'adjust-car-finder-fee') {
            const car = state.cars.find(c => c.id === target.getAttribute('data-car-id'));
            if (car) {
              car.finderFee = Number(target.value) || 3000;
              saveState();
              renderApp();
            }
          } else if (action === 'adjust-lead-finder-fee') {
            const lead = state.leads.find(l => l.id === target.getAttribute('data-lead-id'));
            if (lead) {
              lead.finderFee = Number(target.value) || 3000;
              saveState();
              renderApp();
            }
          }
        });

        // Change Listeners (Selects & Checkboxes)
        document.addEventListener('change', e => {
          const target = e.target;
          if (target.id === 'qb-advisor-select' && quoteBuilder) {
            quoteBuilder.advisorId = target.value;
            refreshQuoteLiveRegions();
            return;
          }

          if (target.id === 'qb-toggle-financing' && quoteBuilder) {
            quoteBuilder.includeFinancing = target.checked;
            renderQuoteBuilderModal();
            return;
          }

          if (target.getAttribute('data-action') === 'toggle-prep-check') {
            const car = state.cars.find(c => c.id === target.getAttribute('data-car-id'));
            const chkId = target.getAttribute('data-check-id');
            if (car && chkId) {
              if (!car.checklist) car.checklist = {};
              car.checklist[chkId] = target.checked;
              saveState();
              renderApp();
            }
          }
        });

        // Form Submissions
        document.addEventListener('submit', e => {
          const form = e.target;
          if (form.id === 'reserve-unit-form') {
            e.preventDefault();
            const car = state.cars.find(c => c.id === form.getAttribute('data-car-id'));
            if (!car) return;

            const refNo = normalizeRef(form.referenceNo.value);
            const dup = findDuplicateReference(refNo);
            const warnEl = document.getElementById('reserve-dup-warning');
            if (dup && warnEl) {
              warnEl.textContent = `Blocked: Reference #${refNo} was already used on ${dup}!`;
              warnEl.classList.remove('hidden');
              return;
            }

            const user = getCurrentUser();
            const verified = isManagement(user);
            car.status = verified ? 'Reserved' : 'Pending Deposit';
            car.reservation = {
              agentId: user.id,
              buyerName: form.buyerName.value.trim(),
              buyerPhone: form.buyerPhone.value.trim(),
              depositAmount: Number(form.depositAmount.value) || 20000,
              channel: form.channel.value,
              referenceNo: refNo,
              receiptUrl: generateReceiptDataUrl(form.channel.value, refNo, form.depositAmount.value, form.buyerName.value.trim()),
              verified,
              verifiedBy: verified ? user.name : null
            };
            saveState();
            closeModal();
            renderApp();
            emitToast(
              verified ? 'Unit Reserved & Locked' : 'Deposit Proof Submitted',
              `${car.year} ${car.make} ${car.model} deposit logged (Ref #${refNo}).`,
              verified ? 'emerald' : 'amber'
            );
          } else if (form.id === 'mark-sold-form') {
            e.preventDefault();
            const carId = form.getAttribute('data-car-id');
            const car = state.cars.find(c => c.id === carId);
            if (!car) return;

            const user = getCurrentUser();
            const closingAgentId = user.role === 'agent' ? user.id : form.closingAgentId.value;
            const finalPrice = Number(form.finalPrice.value) || car.basePrice;
            const finderFee = Number(form.finderFee.value) || car.finderFee;
            const closingPayout = Math.max(0, finalPrice - car.basePrice) || Math.round(finalPrice * (state.defaultCommRate / 100));
            const dealershipNet = finalPrice - closingPayout - finderFee;

            state.sales.unshift({
              id: 'sale_' + Date.now(),
              carId: car.id,
              carTitle: `${car.year} ${car.make} ${car.model}`,
              closingAgentId,
              sourcedByAgentId: car.sourcedByAgentId || null,
              floorPrice: car.basePrice,
              unitCost: car.buyInPrice + car.reconTotal,
              finalPrice,
              closingPayout,
              finderFee: car.sourcedByAgentId ? finderFee : 0,
              dealershipNet,
              paymentMode: form.paymentMode.value,
              referenceNo: normalizeRef(form.referenceNo.value),
              payoutStatus: isExecutive(user) ? 'RELEASED' : 'PENDING_RELEASE',
              date: getTodayStr()
            });

            state.cars = state.cars.filter(c => c.id !== car.id);
            state.activeTab = 'sales';
            saveState();
            closeModal();
            renderApp();
            emitToast('Deal Marked Sold', `${car.year} ${car.make} ${car.model} logged in Sales & Payouts!`, 'emerald');
          } else if (form.id === 'submit-lead-form') {
            e.preventDefault();
            const user = getCurrentUser();
            const asking = Number(form.askingPrice.value) || 500000;
            state.leads.unshift({
              id: 'lead_' + Date.now(),
              agentId: user.id,
              year: Number(form.year.value) || 2021,
              make: form.make.value.trim(),
              model: form.model.value.trim(),
              plateNo: form.plateNo.value.trim().toUpperCase(),
              mileage: form.mileage.value.trim(),
              transmission: 'Automatic',
              fuel: 'Gasoline',
              color: 'Showroom Spec',
              askingPrice: asking,
              finderFee: computeTieredFinderFee(asking),
              sellerName: form.sellerName.value.trim(),
              sellerPhone: form.sellerPhone.value.trim(),
              location: 'Cavite',
              notes: form.notes.value.trim(),
              status: 'PENDING',
              submittedAt: 'Just now'
            });
            saveState();
            closeModal();
            renderApp();
            emitToast('Off-Market Lead Submitted', `Added ${form.year.value} ${form.make.value} ${form.model.value}.`, 'indigo');
          } else if (form.id === 'settings-rules-form') {
            e.preventDefault();
            state.defaultCommRate = Number(form.defaultCommRate.value) || 2.0;
            state.finderRules.tier1Fee = Number(form.tier1Fee.value) || 3000;
            state.finderRules.tier2Fee = Number(form.tier2Fee.value) || 6000;
            state.finderRules.tier3Fee = Number(form.tier3Fee.value) || 10000;
            saveState();
            renderApp();
            emitToast('Settings Updated', 'Saved Magief Cars commission and fixed Finder\'s Fee tiers.', 'emerald');
          }
        });

        renderApp();
      });
    })();
  </script>
</body>
</html>
